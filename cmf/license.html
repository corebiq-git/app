<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F9FC">
  <title>App Licence Info | COREBIQ</title>
  <link rel="icon" href="assets/logo-favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/logo-app.svg">
  <link rel="stylesheet" href="css/corebiq.css">
  <link rel="stylesheet" href="css/license.css">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
</head>
<body>
  <main class="license-shell">
    <header class="license-header">
      <a class="license-back" href="index.html" aria-label="Back to COREBIQ"><span data-lucide="arrow-left"></span></a>
      <a class="license-brand" href="index.html"><img src="assets/name.svg" alt="COREBIQ CRM ERP"></a>
    </header>
    <section class="license-content">
      <div class="license-heading">
        <div><p class="license-eyebrow">ACCOUNT</p><h1>App Licence Info</h1><p>Application and subscription details for this account.</p></div>
        <span class="license-plan-badge" id="licensePlanBadge">Demo</span>
      </div>
      <div class="license-details card">
        <div class="license-detail"><span>App Version</span><strong id="licenseAppVersion">1.0.0</strong></div>
        <div class="license-detail"><span>App Licence Info</span><strong id="licenseInfo">Demo license</strong></div>
        <div class="license-detail"><span>Valid Till</span><strong id="licenseValidTill">Not set</strong></div>
        <div class="license-detail"><span>Plan Name</span><strong id="licensePlanName">Demo</strong></div>
      </div>
      <section class="license-plans">
        <h2>Available plans</h2>
        <div class="license-plan-list" id="licensePlanList" aria-label="Available plan names">
          <span data-plan="Demo">Demo</span><span data-plan="Base">Base</span><span data-plan="Enterprise">Enterprise</span><span data-plan="Pro">Pro</span>
        </div>
      </section>
      <p class="license-feedback" id="licenseFeedback" role="status" hidden></p>
    </section>
  </main>
  <script type="module" src="js/license.js"></script>
</body>
</html>
