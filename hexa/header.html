<style>
.cb-header-component{font-family:'Google Sans','Outfit',sans-serif;position:relative;z-index:1}
.cb-app-header{min-height:72px;padding:10px 16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--border);box-shadow:0 2px 10px rgba(0,0,0,.04);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cb-header-menu-btn,.cb-header-icon{width:44px;height:44px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text-main);display:grid;place-items:center;flex:0 0 44px;cursor:pointer}
.cb-header-menu-btn{display:none}.cb-header-search{min-width:0;flex:1;height:44px;display:flex;align-items:center;gap:10px;padding:0 15px;border:1px solid var(--border);border-radius:22px;background:var(--surface);color:var(--text-muted)}.cb-header-search input{width:100%;border:0;outline:0;background:transparent;color:var(--text-main);font:500 14px 'Google Sans','Outfit',sans-serif}.cb-header-search input::placeholder{color:#8b95a5}.cb-header-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}.cb-header-icon:hover,.cb-header-menu-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:transparent}.cb-header-profile-btn{width:44px;height:44px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text-main);display:grid;place-items:center;cursor:pointer}.cb-header-profile-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:transparent}
@media(max-width:768px){.cb-app-header{padding:10px 14px}.cb-header-menu-btn{display:grid}.cb-header-actions{gap:6px}.cb-header-profile-btn{width:42px;height:42px;flex-basis:42px}}@media(max-width:430px){.cb-header-search{padding:0 12px}.cb-header-search input{font-size:13px}.cb-header-icon{width:40px;height:40px;flex-basis:40px}.cb-header-menu-btn{width:40px;height:40px;flex-basis:40px}}
</style>
<div class="cb-header-component"><header class="cb-app-header">
<button class="cb-header-menu-btn" type="button" onclick="window.toggleMenu()" aria-label="Menu"><span class="material-symbols-rounded">menu</span></button>
<div class="cb-header-search"><span class="material-symbols-rounded">search</span><input id="cb-global-search" type="search" placeholder="Search anything..." autocomplete="off"></div>
<div class="cb-header-actions"><button class="cb-header-icon" type="button" title="Sync" onclick="window.location.reload()"><span class="material-symbols-rounded">sync</span></button><button class="cb-header-icon" type="button" title="Downloads"><span class="material-symbols-rounded">download</span></button><button class="cb-header-icon" type="button" title="Notifications"><span class="material-symbols-rounded">notifications</span></button><button class="cb-header-profile-btn" type="button" aria-label="Profile" title="Profile"><span class="material-symbols-rounded">account_circle</span></button></div>
</header></div>
<script>
(function(){const i=document.getElementById('cb-global-search');if(i){i.addEventListener('keydown',e=>{if(e.key==='Enter'&&window.openModuleSearch)window.openModuleSearch()})}})();
</script>
