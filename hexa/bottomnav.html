<style>
.cb-bottom-shell{display:flex;min-height:76px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));align-items:center;justify-content:space-around;gap:4px;background:rgba(255,255,255,.96);border-top:1px solid var(--border);box-shadow:0 -8px 30px rgba(0,0,0,.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.cb-bottom-link{position:relative;flex:1;min-width:0;max-width:110px;min-height:60px;border:0;border-radius:18px;background:transparent;color:var(--text-muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.cb-bottom-link .material-symbols-rounded{font-size:25px}.cb-bottom-link small{font-size:11px;font-weight:500}.cb-bottom-link.active{background:var(--primary-light);color:var(--primary);font-weight:600}.cb-bottom-link:active{transform:scale(.97)}
@media(min-width:769px){.cb-bottom-shell{display:none!important}}
</style>
<div class="cb-bottom-shell">
<button class="cb-bottom-link active" onclick="window.switchView('view-dashboard',this)"><span class="material-symbols-rounded">home</span><small>Home</small></button>
<button class="cb-bottom-link" onclick="window.switchView('view-clients',this)"><span class="material-symbols-rounded">groups</span><small>Clients</small></button>
<button class="cb-bottom-link" onclick="window.switchView('view-sales',this)"><span class="material-symbols-rounded">point_of_sale</span><small>Sales</small></button>
<button class="cb-bottom-link" onclick="window.toggleMenu()"><span class="material-symbols-rounded">menu</span><small>Menu</small></button>
</div>
