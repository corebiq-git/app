<section class="assistant-page">
  <div class="assistant-hero">
    <div class="assistant-hero-copy">
      <div class="assistant-hero-mark"><span class="material-symbols-rounded">auto_awesome</span></div>
      <div><h1>COREBIQ AI Assistant</h1><p>Bring intelligent business insights into your daily workflow.</p></div>
    </div>
    <button class="assistant-generate" id="assistantGenerate" type="button"><span>Generate response</span><span class="material-symbols-rounded">auto_awesome</span></button>
  </div>
  <div class="assistant-workspace">
    <div class="assistant-conversation" id="assistantConversation" aria-live="polite">
      <div class="assistant-welcome"><span class="material-symbols-rounded">auto_awesome</span><h2>What can I help you with?</h2><p>Ask a question or choose a prompt to get started.</p></div>
    </div>
    <form class="assistant-composer" id="assistantForm">
      <label class="sr-only" for="assistantPrompt">Message COREBIQ AI Assistant</label>
      <textarea id="assistantPrompt" rows="1" maxlength="4000" placeholder="Ask COREBIQ anything..." required></textarea>
      <button type="submit" aria-label="Send message" title="Send message"><span class="material-symbols-rounded">arrow_upward</span></button>
    </form>
    <p class="assistant-status" id="assistantStatus" role="status">COREBIQ plan support is available on WhatsApp.</p>
  </div>
</section>
