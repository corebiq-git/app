<div class="module-container" id="clients-module">
  <link rel="stylesheet" href="css/clients.css">

  <div class="app-card">
    <div class="module-toolbar">
      <div>
        <div class="module-title">
          <span class="material-symbols-rounded">groups</span>
          Clients
        </div>
        <div class="module-subtitle">Manage your customers and business relationships</div>
      </div>

      <div class="toolbar-actions">
        <button class="cb-btn cb-outlined" id="clientRefreshBtn">
          <span class="material-symbols-rounded">refresh</span>
          Refresh
        </button>
        <button class="cb-btn cb-primary" id="clientAddBtn">
          <span class="material-symbols-rounded">add</span>
          Add Client
        </button>
      </div>
    </div>

    <div class="client-tools">
      <div class="search-box">
        <span class="material-symbols-rounded">search</span>
        <input id="clientSearch" type="search" placeholder="Search clients...">
      </div>
      <select id="clientStatusFilter" class="cb-select">
        <option value="">All Status</option>
        <option value="Active">Active</option>
        <option value="Inactive">Inactive</option>
        <option value="Prospect">Prospect</option>
      </select>
    </div>

    <div id="clientLoader" class="client-loader">
      <span class="material-symbols-rounded spin">sync</span>
      Loading clients...
    </div>

    <div class="table-wrap">
      <table class="client-table">
        <thead>
          <tr>
            <th>Client ID</th>
            <th>Client</th>
            <th>Contact</th>
            <th>Type</th>
            <th>GSTIN / PAN</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="clientTableBody"></tbody>
      </table>
    </div>

    <div id="clientEmpty" class="empty-state" style="display:none;">
      <span class="material-symbols-rounded">group_off</span>
      <strong>No clients found</strong>
      <span>Add your first client to get started.</span>
    </div>
  </div>

  <div class="cb-modal-backdrop" id="clientModal" style="display:none;">
    <div class="cb-modal">
      <div class="modal-head">
        <div>
          <div class="modal-title" id="clientModalTitle">Add Client</div>
          <div class="modal-subtitle">Client master information</div>
        </div>
        <button class="icon-btn" id="clientCloseBtn" type="button">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>

      <form id="clientForm">
        <input type="hidden" id="client_id">

        <div class="form-grid">
          <div class="form-group">
            <label>Client Type <span>*</span></label>
            <select id="client_type" class="form-control" required>
              <option value="Business">Business</option>
              <option value="Individual">Individual</option>
            </select>
          </div>

          <div class="form-group">
            <label>Status <span>*</span></label>
            <select id="client_status" class="form-control" required>
              <option value="Active">Active</option>
              <option value="Prospect">Prospect</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>

          <div class="form-group span-2">
            <label>Client / Business Name <span>*</span></label>
            <input id="client_name" class="form-control" required>
          </div>

          <div class="form-group">
            <label>Email</label>
            <input id="client_email" type="email" class="form-control">
          </div>

          <div class="form-group">
            <label>Phone</label>
            <input id="client_phone" type="tel" class="form-control">
          </div>

          <div class="form-group">
            <label>Alternate Phone</label>
            <input id="client_alt_phone" type="tel" class="form-control">
          </div>

          <div class="form-group">
            <label>GSTIN</label>
            <input id="client_gstin" class="form-control" maxlength="15">
          </div>

          <div class="form-group">
            <label>PAN</label>
            <input id="client_pan" class="form-control" maxlength="10">
          </div>

          <div class="form-group">
            <label>Branch ID</label>
            <input id="client_branch_id" class="form-control" placeholder="e.g. BR-00001">
          </div>

          <div class="form-group span-2">
            <label>Address</label>
            <textarea id="client_address" class="form-control" rows="2"></textarea>
          </div>

          <div class="form-group">
            <label>City</label>
            <input id="client_city" class="form-control">
          </div>

          <div class="form-group">
            <label>District</label>
            <input id="client_district" class="form-control">
          </div>

          <div class="form-group">
            <label>State</label>
            <input id="client_state" class="form-control" value="Kerala">
          </div>

          <div class="form-group">
            <label>PIN Code</label>
            <input id="client_pin" class="form-control">
          </div>

          <div class="form-group span-2">
            <label>Notes</label>
            <textarea id="client_notes" class="form-control" rows="2"></textarea>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="cb-btn cb-outlined" id="clientCancelBtn">Cancel</button>
          <button type="submit" class="cb-btn cb-primary" id="clientSaveBtn">
            <span class="material-symbols-rounded">save</span>
            Save Client
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script type="module" src="modules/clients.js"></script>
