<style>
    /* =========================================================
       SIDEBAR BASE
       ========================================================= */

    .sidebar-inner-wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        height: 100%;
    }


    /* =========================================================
       SIDEBAR HEADER / STRA CARE LOGO
       ========================================================= */

    .sidebar-header {
        position: sticky;
        top: 0;
        background: var(--surface);
        z-index: 10;
        border-bottom: 1px solid var(--border);

        padding: 10px 16px;

        display: flex;
        justify-content: space-between;
        align-items: center;

        height: 72px;
        min-height: 72px;
    }

    .sidebar-brand {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        min-width: 0;
    }

    .sidebar-logo {
        display: block;
        width: 38px;
        height: 38px;
        object-fit: contain;
        flex: 0 0 38px;
    }

    .sidebar-name {
        display: block;
        width: min(100%, 150px);
        max-height: 42px;
        object-fit: contain;
    }

    .close-menu {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-main);

        display: flex;
        align-items: center;
        justify-content: center;

        width: 36px;
        height: 36px;
        border-radius: 8px;
    }

    .close-menu:hover {
        background: var(--primary-soft);
        color: var(--primary);
    }

    .sidebar-brand-actions {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
    }


    /* =========================================================
       NAVIGATION
       ========================================================= */

    .sidebar-nav {
        flex: 1;
        overflow-y: auto;

        padding: 14px 0 20px;

        display: flex;
        flex-direction: column;
        gap: 5px;

        scrollbar-width: thin;
    }


    /* =========================================================
       NAVIGATION LINKS
       ========================================================= */

    .nav-link {
        display: flex;
        align-items: center;

        width: calc(100% - 32px);
        margin: 0 16px;

        min-height: 46px;
        padding: 10px 16px;

        border: 1px solid transparent;
        background: transparent;

        text-align: left;
        cursor: pointer;

        font-size: 14px;
        font-weight: 500;

        color: #4B5563;

        border-radius: 999px;

        transition:
            background-color 0.2s ease,
            color 0.2s ease,
            box-shadow 0.2s ease,
            transform 0.2s ease;

        font-family: inherit;
    }

    .nav-link:hover {
        background: #FFFFFF;
        border-color: #C7D9F5;
        color: var(--primary);
    }

    .nav-link:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .nav-link.active {
        background: #FFFFFF;
        border-color: var(--primary);
        color: var(--primary);
        font-weight: 600;
        box-shadow: 0 1px 3px rgba(11, 87, 208, .08);
    }

    .nav-link.active:hover {
        background: #F7FAFF;
        border-color: var(--primary-hover);
    }

    .nav-link .material-symbols-rounded {
        font-size: 21px;
        margin-right: 12px;
        color: inherit;
        transition: color 0.2s ease;
        flex-shrink: 0;
    }


    /* =========================================================
       DIVIDERS
       ========================================================= */

    .nav-divider {
        height: 1px;
        background: var(--border);

        margin: 11px 24px;

        flex-shrink: 0;
    }

    #sidebar-container.is-collapsed .sidebar-header {
        justify-content: center;
        padding: 12px 8px;
    }

    #sidebar-container.is-collapsed .sidebar-brand {
        justify-content: center;
    }

    #sidebar-container.is-collapsed .close-menu {
        display: none;
    }

    #sidebar-container.is-collapsed .sidebar-name {
        display: none;
    }

    #sidebar-container.is-collapsed .sidebar-logo {
        width: 38px;
        height: 38px;
    }

    #sidebar-container.is-collapsed .sidebar-nav {
        padding-left: 7px;
        padding-right: 7px;
    }

    #sidebar-container.is-collapsed .nav-link {
        width: 54px;
        min-height: 50px;
        justify-content: center;
        margin: 0 auto;
        padding: 8px;
        border: 1px solid #D7E4FA;
        border-radius: 16px;
        background: #FFFFFF;
        overflow: hidden;
        font-size: 0;
    }

    #sidebar-container.is-collapsed .nav-link:hover {
        border-color: #4285F4;
        background: #F3F7FF;
        color: #1A73E8;
    }

    #sidebar-container.is-collapsed .nav-link.active {
        border-color: #4285F4;
        background: #FFFFFF;
        color: #1A73E8;
        box-shadow: 0 2px 8px rgba(66, 133, 244, .12);
    }

    #sidebar-container.is-collapsed .nav-link .material-symbols-rounded {
        margin: 0;
        font-size: 22px;
    }

    #sidebar-container.is-collapsed .nav-divider {
        margin: 8px 12px;
    }

    #sidebar-container.is-collapsed .sidebar-footer {
        display: none;
    }


    /* =========================================================
       BADGES
       ========================================================= */

    .menu-badge {
        margin-left: auto;

        background: var(--primary);
        color: white;

        padding: 2px 8px;

        border-radius: 20px;

        font-size: 11px;
        font-weight: 700;
    }

    .menu-badge.pending {
        background: var(--warning);
        color: #fff;
    }


    /* =========================================================
       FOOTER
       ========================================================= */

    .sidebar-footer {
        padding: 18px 20px;

        border-top: 1px solid var(--border);

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;

        background: #FAFAFA;

        margin-top: auto;
        flex-shrink: 0;
    }

    .footer-logo {
        margin: 0 0 7px;
        background: linear-gradient(100deg, #1A73E8 0%, #A142F4 52%, #EA4335 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        color: #1A73E8;
        font-size: 21px;
        font-weight: 800;
        letter-spacing: .12em;
        line-height: 1.15;
    }

    .footer-app-name {
        max-width: 190px;
        font-size: 10px;
        font-weight: 650;
        color: var(--text-muted);
        margin-bottom: 2px;
        text-align: center;
        line-height: 1.4;
        letter-spacing: .08em;
        text-transform: uppercase;
    }


    /* =========================================================
       DESKTOP
       ========================================================= */

    @media (min-width: 769px) {

        .close-menu {
            display: none;
        }

        .sidebar-brand {justify-content:flex-start}
    }


    /* =========================================================
       MOBILE SIDEBAR
       ========================================================= */

    @media (max-width: 768px) {

        .sidebar-header {
            height: 64px;
            min-height: 64px;
            padding: 8px 12px;

            justify-content: space-between;
        }

        .sidebar-brand {
            justify-content: flex-start;
        }

        .sidebar-logo {
            width: 32px;
            height: 32px;
            flex-basis: 32px;
        }

        .sidebar-name {
            width: min(100%, 150px);
            max-height: 48px;
        }

        .close-menu {
            display: flex;

            width: 38px;
            height: 38px;

            flex-shrink: 0;
        }

        .close-menu .material-symbols-rounded {
            font-size: 23px;
        }

        .sidebar-nav {
            padding-top: 12px;
            padding-bottom: 20px;
        }

        .nav-link {
            width: calc(100% - 24px);
            margin: 0 12px;

            min-height: 48px;
            padding: 12px 16px;

            font-size: 14px;
        }

        .nav-link .material-symbols-rounded {
            font-size: 21px;
            margin-right: 12px;
        }

        .nav-divider {
            margin: 10px 20px;
        }

        .sidebar-footer {
            padding: 16px 20px;
        }

        #sidebar-container.is-collapsed .sidebar-header {
            height: 64px;
            min-height: 64px;
            padding: 10px 6px;
        }

        #sidebar-container.is-collapsed .close-menu {
            display: flex;
            width: 34px;
            height: 34px;
        }
    }
</style>
