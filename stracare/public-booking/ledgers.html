<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Stra Care - Ledgers Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
<link rel="stylesheet" href="css/corebiq.css">
</head>
<body>

<div class="module-container" id="ledger-module">
    
    <style>
    :root {
        --primary: #2563EB;
        --primary-light: #EFF6FF;
        --bg: #F8FAFC;
        --surface: #FFFFFF;
        --text-main: #0F172A;
        --text-muted: #64748B;
        --border: #E2E8F0;
        --grey-med: #CBD5E1;
        --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
        --success: #10B981;
        --danger: #EF4444;
        --secondary: #64748B;
    }

        #ledger-module { font-family: 'Inter', sans-serif; width: 100%; max-width: 1120px; margin: 0 auto; padding-bottom: 40px; }
        
        #ledger-module .section-title { font-size: 24px; font-weight: 800; margin-bottom: 24px; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        
        #ledger-module .grid-layout { display: grid; grid-template-columns: 1fr; gap: 24px; margin-bottom: 24px; }
        @media (min-width: 992px) { #ledger-module .grid-layout { grid-template-columns: 300px 1fr; } }

        #ledger-module .card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); }
        
        #ledger-module .form-label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        
        #ledger-module .input-group { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
        @media (min-width: 768px) { #ledger-module .input-group.two-cols { grid-template-columns: 1fr 1fr; } }
        @media (min-width: 1024px) { #ledger-module .input-group.three-cols { grid-template-columns: 1fr 1fr 1fr; } }

        #ledger-module .form-input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--border); font-size: 14px; color: var(--text-main); background: #FAFAFA; outline: none; transition: border 0.2s; appearance: auto; margin-bottom: 16px;}
        #ledger-module .form-input:focus { border-color: var(--primary); background: var(--surface); box-shadow: 0 0 0 3px var(--primary-light); }
        #ledger-module .form-input:read-only { background: #E2E8F0; color: var(--text-muted); cursor: not-allowed; font-weight: 700; }
        
        #ledger-module .btn-primary { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;}
        #ledger-module .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        
        #ledger-module .btn-outline { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 12px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;}
        #ledger-module .btn-outline:hover { background: #FAFAFA; border-color: var(--primary); color: var(--primary); }

        /* Table Styles */
        #ledger-module .table-container { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px; }
        #ledger-module .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        #ledger-module .saas-table { width: 100%; min-width: 900px; border-collapse: collapse; text-align: left; }
        #ledger-module .saas-table th { padding: 16px 20px; font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; background: #FAFAFA; border-bottom: 1px solid var(--border); white-space: nowrap; }
        #ledger-module .saas-table td { padding: 16px 20px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
        
        .badge { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; text-transform: uppercase; display: inline-block; }
        .badge-dr { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .badge-cr { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .badge-cat { background: var(--bg); border: 1px solid var(--border); color: var(--text-main); }
    </style>

    <div class="section-title">
        <span class="material-symbols-rounded">account_balance</span>
        Ledger Master (Chart of Accounts)
    </div>

    <div class="grid-layout">
        
        <!-- LEFT: ADD CATEGORY -->
        <div class="card" style="height: fit-content;">
            <h3 style="margin: 0 0 16px 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Add Ledger Category</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Create categories like Indirect Expenses, Purchases, Assets, etc.</p>
            
            <form onsubmit="event.preventDefault(); window.saveCategory();">
                <label class="form-label">Category Name *</label>
                <input type="text" id="newCategoryName" class="form-input" placeholder="e.g., Indirect Expense" required>
                <button type="submit" class="btn-primary" id="saveCatBtn">
                    <span class="material-symbols-rounded" style="font-size: 18px;">add</span> Add Category
                </button>
            </form>
        </div>

        <!-- RIGHT: ADD LEDGER -->
        <div class="card">
            <h3 style="margin: 0 0 16px 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Create / Edit Ledger</h3>
            
            <form id="ledger-form" onsubmit="event.preventDefault(); window.saveLedger();">
                <input type="hidden" id="docId" value="">
                
                <div class="input-group three-cols">
                    <div>
                        <label class="form-label">Ledger No.</label>
                        <input type="text" id="lNo" class="form-input" readonly placeholder="Auto-generated">
                    </div>
                    <div style="grid-column: span 2;">
                        <label class="form-label">Ledger Name *</label>
                        <input type="text" id="lName" class="form-input" placeholder="e.g., Electricity Bill, Supplier Name..." required>
                    </div>
                </div>

                <div class="input-group two-cols">
                    <div>
                        <label class="form-label">Ledger Category *</label>
                        <select id="lCategory" class="form-input" required>
                            <option value="">Loading Categories...</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Opening Balance</label>
                        <div style="display: flex; gap: 8px;">
                            <select id="lOpType" class="form-input" style="width: 90px; margin-bottom: 0;">
                                <option value="Dr">Dr</option>
                                <option value="Cr">Cr</option>
                            </select>
                            <input type="number" id="lOpAmt" class="form-input" placeholder="0.00" style="margin-bottom: 0;">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="form-label">Other Info (Bank details, GST No, Loan Info, etc.)</label>
                    <textarea id="lOtherInfo" class="form-input" rows="2" placeholder="Optional details..."></textarea>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px;">
                    <button type="button" class="btn-outline" onclick="window.resetLedgerForm()">Clear Form</button>
                    <button type="submit" class="btn-primary" id="saveLedgerBtn" style="width: auto;">
                        <span class="material-symbols-rounded">save</span> Save Ledger
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DIRECTORY TABLE -->
    <div class="table-container">
        <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #FAFAFA;">
            <h4 style="margin: 0; font-size: 15px;">Ledgers Directory</h4>
            <div style="display: flex; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; width: 250px;">
                <span class="material-symbols-rounded" style="font-size: 18px; color: var(--text-muted);">search</span>
                <input type="text" id="searchLedger" onkeyup="window.filterLedgers()" placeholder="Search ledgers..." style="border: none; background: transparent; outline: none; font-size: 13px; width: 100%; margin-left: 8px;">
            </div>
        </div>

        <div class="table-responsive">
            <table class="saas-table">
                <thead>
                    <tr>
                        <th>Ledger No.</th>
                        <th>Ledger Name</th>
                        <th>Category</th>
                        <th>Opening Balance</th>
                        <th>Other Info</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="ledgerTableBody">
                    <tr><td colspan="6" style="text-align: center; padding: 30px;">Loading ledgers...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { db } from './firebase-config.js'; 
        import { collection, addDoc, query, getDocs, updateDoc, deleteDoc, doc, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        window.ledgerDataCache = {};
        window.nextLedgerCount = 1;

        // 1. Load Categories
        window.loadCategories = async function() {
            const select = document.getElementById('lCategory');
            try {
                const snap = await getDocs(collection(db, "ledger_categories"));
                
                // Auto-seed defaults if empty
                if(snap.empty) {
                    const defaults = ['Indirect Expense', 'Direct Expense', 'Purchase', 'Sales', 'Fixed Assets', 'Sundry Creditors', 'Sundry Debtors', 'Bank Accounts'];
                    for(let cat of defaults) {
                        await addDoc(collection(db, "ledger_categories"), { name: cat });
                    }
                    return window.loadCategories(); // Reload after seeding
                }

                let catList = [];
                snap.forEach(d => { if(d.data().name) catList.push(d.data().name); });
                catList.sort();

                select.innerHTML = '<option value="">Select a Category</option>';
                catList.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c; opt.text = c; select.appendChild(opt);
                });
            } catch(e) { console.error("Error loading categories", e); }
        };

        // 2. Save New Category
        window.saveCategory = async function() {
            const input = document.getElementById('newCategoryName');
            const name = input.value.trim();
            const btn = document.getElementById('saveCatBtn');

            if(!name) return;
            btn.disabled = true; btn.innerText = "Adding...";

            try {
                await addDoc(collection(db, "ledger_categories"), { name: name });
                input.value = '';
                await window.loadCategories();
                alert(`Category '${name}' added successfully!`);
            } catch(e) { alert("Failed to add category."); }
            
            btn.disabled = false; 
            btn.innerHTML = `<span class="material-symbols-rounded" style="font-size: 18px;">add</span> Add Category`;
        };

        // 3. Load Ledgers & Auto-generate Ledger No.
        window.loadLedgers = async function() {
            const tbody = document.getElementById('ledgerTableBody');
            try {
                const snap = await getDocs(collection(db, "ledgers"));
                tbody.innerHTML = '';
                window.ledgerDataCache = {};
                
                // Set the next auto-ID based on total records
                window.nextLedgerCount = snap.size + 1;
                document.getElementById('lNo').value = `LD/CMB/${String(window.nextLedgerCount).padStart(3, '0')}`;

                if(snap.empty) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 30px; color: var(--text-muted);">No ledgers found. Create one above.</td></tr>';
                    return;
                }

                let arr = [];
                snap.forEach(d => arr.push({ id: d.id, ...d.data() }));
                // Sort by Ledger No
                arr.sort((a, b) => (a.ledgerNo || '').localeCompare(b.ledgerNo || ''));

                arr.forEach(data => {
                    window.ledgerDataCache[data.id] = data;
                    
                    const badgeClass = data.opType === 'Dr' ? 'badge-dr' : 'badge-cr';
                    const balHtml = data.opAmt > 0 ? `<span class="badge ${badgeClass}">${data.opType} ${data.opAmt.toFixed(2)}</span>` : '<span style="color: var(--text-muted); font-size: 12px;">Nil</span>';

                    const tr = document.createElement('tr');
                    tr.className = "ledger-row";
                    tr.setAttribute("data-search", `${data.ledgerNo} ${data.name} ${data.category} ${data.otherInfo}`.toLowerCase());

                    tr.innerHTML = `
                        <td><strong>${data.ledgerNo}</strong></td>
                        <td><strong style="color: var(--primary);">${data.name}</strong></td>
                        <td><span class="badge badge-cat">${data.category}</span></td>
                        <td>${balHtml}</td>
                        <td><span style="font-size: 12px; color: var(--secondary); display: block; max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${data.otherInfo || ''}">${data.otherInfo || '--'}</span></td>
                        <td style="text-align: right;">
                            <div style="display:flex; gap: 10px; align-items:center; justify-content: flex-end;">
                                <span class="material-symbols-rounded" style="color: var(--secondary); cursor: pointer; font-size: 18px;" onclick="window.editLedger('${data.id}')" title="Edit">edit</span>
                                <span class="material-symbols-rounded" style="color: var(--danger); cursor: pointer; font-size: 18px;" onclick="window.deleteLedger('${data.id}')" title="Delete">delete</span>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) { console.error("Error loading ledgers", error); }
        };

        // 4. Save Ledger
        window.saveLedger = async function() {
            const docId = document.getElementById('docId').value;
            const ledgerNo = document.getElementById('lNo').value;
            const name = document.getElementById('lName').value.trim();
            const category = document.getElementById('lCategory').value;
            const opType = document.getElementById('lOpType').value;
            const opAmt = parseFloat(document.getElementById('lOpAmt').value) || 0;
            const otherInfo = document.getElementById('lOtherInfo').value.trim();
            
            const btn = document.getElementById('saveLedgerBtn');

            if(!name || !category) return alert("Please fill the required fields.");

            btn.disabled = true; btn.innerText = "Saving...";

            const payload = {
                ledgerNo: ledgerNo,
                name: name,
                category: category,
                opType: opType,
                opAmt: opAmt,
                otherInfo: otherInfo,
                updatedAt: new Date()
            };

            try {
                if(docId) {
                    await updateDoc(doc(db, "ledgers", docId), payload);
                    alert("Ledger updated!");
                } else {
                    payload.createdAt = new Date();
                    await addDoc(collection(db, "ledgers"), payload);
                    alert("New Ledger saved!");
                }
                window.resetLedgerForm();
                window.loadLedgers();
            } catch(e) { console.error(e); alert("Error saving ledger."); }

            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-rounded">save</span> Save Ledger`;
        };

        // 5. Edit / Delete / Reset / Filter
        window.editLedger = function(id) {
            const data = window.ledgerDataCache[id];
            if(!data) return;
            document.getElementById('docId').value = id;
            document.getElementById('lNo').value = data.ledgerNo;
            document.getElementById('lName').value = data.name;
            document.getElementById('lCategory').value = data.category;
            document.getElementById('lOpType').value = data.opType || 'Dr';
            document.getElementById('lOpAmt').value = data.opAmt || '';
            document.getElementById('lOtherInfo').value = data.otherInfo || '';
            
            document.getElementById('saveLedgerBtn').innerHTML = `<span class="material-symbols-rounded">update</span> Update Ledger`;
            document.getElementById('main-content').scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteLedger = async function(id) {
            if(confirm("Are you sure you want to permanently delete this Ledger?")) {
                try {
                    await deleteDoc(doc(db, "ledgers", id));
                    window.loadLedgers();
                } catch(e) { alert("Error deleting ledger."); }
            }
        };

        window.resetLedgerForm = function() {
            document.getElementById('ledger-form').reset();
            document.getElementById('docId').value = '';
            document.getElementById('saveLedgerBtn').innerHTML = `<span class="material-symbols-rounded">save</span> Save Ledger`;
            document.getElementById('lNo').value = `LD/CMB/${String(window.nextLedgerCount).padStart(3, '0')}`;
        };

        window.filterLedgers = function() {
            const query = document.getElementById('searchLedger').value.toLowerCase();
            const rows = document.querySelectorAll('.ledger-row');
            rows.forEach(row => {
                const txt = row.getAttribute('data-search');
                row.style.display = txt.includes(query) ? '' : 'none';
            });
        };

        // Bootstrap Module
        window.loadCategories();
        window.loadLedgers();

    </script>
</div>
</body>
</html>
