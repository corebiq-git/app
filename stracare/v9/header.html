<style>
    .dashboard-header {
        min-height: 72px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--outline-soft);
        box-shadow: 0 2px 8px rgba(31, 35, 40, .04);
        position: relative;
        z-index: 60;
    }

    .sidebar-toggle-button {
        width: 42px;
        height: 42px;
        display: grid;
        flex: 0 0 42px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #0B1F4B;
        cursor: pointer;
        transition: color .18s ease;
    }

    .sidebar-toggle-button:hover,
    .sidebar-toggle-button[aria-expanded="true"] {
        background: transparent;
        color: #0B1F4B;
    }

    .sidebar-toggle-button:focus-visible,
    .module-search-toggle:focus-visible,
    .support-button:focus-visible,
    .notification-button:focus-visible,
    .profile-button:focus-visible {
        outline: 2px solid #0B1F4B;
        outline-offset: 2px;
    }

    .sidebar-toggle-button .material-symbols-rounded {
        font-size: 22px;
    }

    .module-search {
        position: relative;
        width: 42px;
        flex: 0 0 42px;
        margin: 0 0 0 auto;
    }

    .module-search.open {
        z-index: 105;
    }

    .module-search-box {
        position: relative;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 0;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 22px;
        color: var(--muted);
        transition: width .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .module-search-toggle {
        width: 42px;
        height: 42px;
        display: grid;
        flex: 0 0 42px;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #0B1F4B;
        cursor: pointer;
    }

    .module-search-toggle:hover,
    .module-search-toggle[aria-expanded="true"] {
        background: #F1F3F8;
    }

    .module-search.open .module-search-box {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 105;
        width: min(360px, calc(100vw - 24px));
        justify-content: flex-start;
        padding: 0 8px 0 0;
        background: var(--surface);
        border-color: var(--primary-soft);
        box-shadow: 0 8px 24px rgba(31, 35, 40, .14);
    }

    .module-search.open .module-search-box:focus-within {
        background: var(--surface);
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-soft);
    }

    .module-search-input {
        display: none;
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 14px;
    }

    .module-search.open .module-search-input {
        display: block;
    }

    .module-search.open .module-search-toggle {
        width: 34px;
        flex-basis: 34px;
    }

    .module-search-toggle .material-symbols-rounded {
        font-size: 22px;
    }

    .module-search-input::placeholder {
        color: var(--muted);
    }

    .module-search-clear {
        width: 30px;
        height: 30px;
        display: none;
        flex: 0 0 30px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
    }

    .module-search-clear:hover {
        background: #E9EAEC;
        color: var(--primary);
    }

    .module-search-input:not(:placeholder-shown) ~ .module-search-clear {
        display: flex;
    }

    .module-search-clear .material-symbols-rounded {
        font-size: 19px;
    }

    .module-search-results {
        position: absolute;
        top: 50px;
        left: 0;
        display: none;
        width: min(360px, calc(100vw - 24px));
        max-height: min(60vh, 420px);
        overflow-y: auto;
        padding: 6px;
        background: var(--surface);
        border: 1px solid var(--outline-soft);
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(31, 35, 40, .16);
        z-index: 100;
    }

    .module-search-results.open {
        display: block;
    }

    .module-search-result {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text);
        text-align: left;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
    }

    .module-search-result:hover,
    .module-search-result:focus-visible {
        outline: 0;
        background: #F8F9FA;
        color: var(--primary);
    }

    .module-search-result .material-symbols-rounded {
        color: var(--primary);
        font-size: 20px;
    }

    .module-search-empty {
        padding: 14px 12px;
        color: var(--muted);
        font-size: 13px;
    }

    .header-actions {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 9px;
    }

    .install-app-button {
        position: relative;
        isolation: isolate;
        display: inline-flex;
        flex: 0 0 42px;
        align-items: center;
        justify-content: center;
        width: 42px;
        height: 42px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #126B4A;
        cursor: pointer;
        transition: background-color .18s ease, color .18s ease;
    }

    .install-app-button:hover {
        background: #EAF5EF;
    }

    .install-app-button:focus-visible { outline: 2px solid #0F7A52; outline-offset: 2px; }
    .install-app-button .material-symbols-rounded { font-size: 22px; }

    .support-actions {
        position: relative;
    }

    .support-button {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #0B1F4B;
        cursor: pointer;
        transition: background-color .18s ease, color .18s ease, box-shadow .18s ease;
    }

    .support-button:hover,
    .support-button[aria-expanded="true"] {
        outline: 0;
        background: #F1F3F8;
        color: #0B1F4B;
    }

    .support-button:focus-visible {
        box-shadow: 0 0 0 2px #0B1F4B;
    }

    .support-button .material-symbols-rounded {
        font-size: 23px;
    }

    .support-menu {
        position: absolute;
        z-index: 120;
        top: calc(100% + 9px);
        right: 0;
        display: none;
        width: 214px;
        padding: 7px;
        border: 1px solid var(--outline-soft);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 12px 30px rgba(31, 35, 40, .16);
    }

    .support-menu.open {
        display: block;
        animation: support-menu-enter .16s ease-out;
    }

    @keyframes support-menu-enter {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .support-menu-title {
        margin: 4px 9px 6px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 650;
    }

    .support-menu-link {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 42px;
        padding: 0 10px;
        border-radius: 9px;
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        transition: background-color .16s ease;
    }

    .support-menu-link:hover,
    .support-menu-link:focus-visible {
        outline: 0;
        background: #F4F5F9;
    }

    .support-menu-link .material-symbols-rounded {
        color: #0B1F4B;
        font-size: 20px;
    }

    .support-menu-link svg {
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        color: #0B1F4B;
    }

    .notification-button {
        position: relative;
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #0B1F4B;
        cursor: pointer;
    }

    .notification-button.has-unread .material-symbols-rounded {
        transform-origin: 50% 10%;
        animation: notification-ring 1.8s ease-in-out infinite;
    }

    .notification-badge {
        position: absolute;
        top: 3px;
        right: 3px;
        width: 10px;
        height: 10px;
        border: 2px solid var(--surface);
        border-radius: 50%;
        background: #D93025;
        box-shadow: 0 0 0 0 rgba(217,48,37,.45);
    }

    .notification-button.has-unread .notification-badge {
        animation: notification-pulse 1.8s ease-out infinite;
    }

    @keyframes notification-ring {
        0%, 56%, 100% { transform: rotate(0); }
        8%, 24%, 40% { transform: rotate(13deg); }
        16%, 32%, 48% { transform: rotate(-13deg); }
    }

    @keyframes notification-pulse {
        0% { box-shadow: 0 0 0 0 rgba(217,48,37,.42); }
        70%, 100% { box-shadow: 0 0 0 7px rgba(217,48,37,0); }
    }

    @media (prefers-reduced-motion: reduce) {
        .notification-button.has-unread .material-symbols-rounded,
        .notification-button.has-unread .notification-badge { animation: none; }
    }

    .notification-button:hover {
        background: transparent;
        color: #0B1F4B;
    }

    .notification-button .material-symbols-rounded {
        font-size: 22px;
    }

    .profile-button {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #0B1F4B;
        cursor: pointer;
    }

    .profile-button:hover,
    .profile-button[aria-expanded="true"] {
        background: transparent;
        color: #0B1F4B;
    }

    .profile-button .material-symbols-rounded {
        font-size: 23px;
    }

    .profile-menu {
        position: absolute;
        top: calc(100% + 9px);
        right: 0;
        display: none;
        width: min(290px, calc(100vw - 24px));
        padding: 16px;
        background: var(--surface);
        border: 1px solid var(--outline-soft);
        border-radius: 14px;
        box-shadow: 0 12px 32px rgba(31, 35, 40, .16);
        z-index: 110;
    }

    .profile-menu.open {
        display: block;
    }

    .profile-name {
        margin: 0;
        color: var(--text);
        font-size: 15px;
        font-weight: 700;
        overflow-wrap: anywhere;
    }

    .profile-email {
        margin: 4px 0 12px;
        color: var(--muted);
        font-size: 12px;
        overflow-wrap: anywhere;
    }

    .profile-details {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 7px 10px;
        padding: 12px 0;
        border-top: 1px solid var(--outline-soft);
        border-bottom: 1px solid var(--outline-soft);
        font-size: 12px;
    }

    .profile-detail-label {
        color: var(--muted);
    }

    .profile-detail-value {
        color: var(--text);
        font-weight: 600;
        overflow-wrap: anywhere;
    }

    .profile-signout {
        width: 100%;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 9px;
        margin-top: 12px;
        padding: 0 10px;
        border: 0;
        border-radius: 9px;
        background: var(--primary-soft);
        color: var(--primary);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
    }

    .profile-signout:hover {
        background: var(--primary);
        color: var(--surface);
    }

    @media (max-width: 768px) {
        .dashboard-header {
            min-height: 64px;
            gap: 8px;
            padding: 8px 12px;
        }

        .sidebar-toggle-button { display: none; }

        .header-actions {
            gap: 6px;
        }

        .support-button {
            width: 38px;
            height: 38px;
        }

        .notification-button,
        .profile-button {
            width: 38px;
            height: 38px;
        }
    }
</style>

<header class="dashboard-header">
    <button
        class="sidebar-toggle-button"
        id="sidebar-toggle-button"
        type="button"
        aria-label="Collapse navigation"
        aria-expanded="true"
        title="Collapse navigation"
        onclick="window.toggleSidebarCollapse()">
        <span class="material-symbols-rounded" aria-hidden="true">left_panel_close</span>
    </button>

    <div class="module-search">
        <div class="module-search-box">
            <button
                class="module-search-toggle"
                id="module-search-toggle"
                type="button"
                aria-label="Search dashboard modules"
                aria-expanded="false"
                aria-controls="module-search-input"
                title="Search modules"
                onclick="window.toggleModuleSearch()">
                <span class="material-symbols-rounded" aria-hidden="true">search</span>
            </button>
            <input
                class="module-search-input"
                id="module-search-input"
                type="text"
                placeholder="Search modules..."
                autocomplete="off"
                aria-label="Search dashboard modules"
                aria-controls="module-search-results"
                aria-expanded="false"
                oninput="window.searchModules(this.value)"
                onkeydown="window.handleModuleSearchKeydown(event)">
            <button
                class="module-search-clear"
                type="button"
                aria-label="Clear module search"
                title="Clear search"
                onclick="window.clearModuleSearch()">
                <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </button>
        </div>
        <div class="module-search-results" id="module-search-results" role="listbox"></div>
    </div>

    <div class="header-actions">
        <button
            class="install-app-button"
            id="install-app-button"
            type="button"
            aria-label="Install STRA CARE app"
            title="Install app"
            onclick="window.installApp()">
            <span class="material-symbols-rounded" aria-hidden="true">install_mobile</span>
        </button>
        <div class="support-actions">
            <button
                class="support-button"
                id="support-button"
                type="button"
                aria-label="Contact COREBIQ support"
                aria-expanded="false"
                aria-controls="support-menu"
                title="Contact support"
                onclick="window.toggleSupportMenu(event)">
                <span class="material-symbols-rounded" aria-hidden="true">support_agent</span>
            </button>
            <section class="support-menu" id="support-menu" aria-label="Contact COREBIQ support">
                <h2 class="support-menu-title">Contact support</h2>
                <a
                    class="support-menu-link"
                    href="https://wa.me/919946151111?text=Hello%20COREBIQ%20Support%2C%20I%20need%20help%20with%20the%20dashboard."
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Contact COREBIQ support on WhatsApp">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M20.2 11.6a8.2 8.2 0 0 1-12.1 7.2L3.5 20l1.2-4.4a8.2 8.2 0 1 1 15.5-4Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M8.3 7.8c.2-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.7 1.7c.1.2 0 .4-.1.6l-.5.6c-.2.2-.2.4 0 .6.5.9 1.2 1.6 2.1 2.1.2.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.6.8c.2.1.3.3.3.5 0 .5-.3 1.1-.7 1.4-.5.4-1.1.6-1.8.5-1.2-.2-2.6-.9-4-2.3-1.2-1.2-2-2.7-2.1-3.8-.1-.7.1-1.2.4-1.6l.4-.5Z" fill="currentColor"/>
                    </svg>
                    WhatsApp
                </a>
                <a
                    class="support-menu-link"
                    href="mailto:support@corebiq.com?subject=COREBIQ%20Support%20Request&amp;body=Hello%20COREBIQ%20Support%2C%0D%0A%0D%0AI%20need%20help%20with%20the%20dashboard.%0D%0A%0D%0A"
                    aria-label="Email COREBIQ support">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="m3 7 9 6 9-6"/>
                    </svg>
                    Email
                </a>
            </section>
        </div>
        <button class="notification-button" id="notification-button" type="button" aria-label="Notifications" title="App updates" onclick="window.openAppUpdates()">
            <span class="material-symbols-rounded" id="bell-icon" aria-hidden="true">notifications</span>
            <span class="notification-badge" id="notif-badge" aria-hidden="true" hidden></span>
        </button>
        <button
            class="profile-button"
            id="profile-button"
            type="button"
            aria-label="View signed-in user profile"
            aria-expanded="false"
            aria-controls="profile-menu"
            onclick="window.toggleProfileMenu()">
            <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
        </button>
        <section class="profile-menu" id="profile-menu" aria-label="User profile">
            <h2 class="profile-name" id="profile-name">Signed-in user</h2>
            <p class="profile-email" id="profile-email"></p>
            <div class="profile-details">
                <span class="profile-detail-label">Role</span>
                <span class="profile-detail-value" id="profile-role"></span>
                <span class="profile-detail-label">Branch</span>
                <span class="profile-detail-value" id="profile-branch"></span>
            </div>
            <button class="profile-signout" type="button" onclick="window.handleLogout()">
                <span class="material-symbols-rounded" aria-hidden="true">logout</span>
                Sign out
            </button>
        </section>
    </div>
</header>
