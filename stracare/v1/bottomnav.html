<style>
    /* =========================================================
       BOTTOM NAVIGATION - Material 3 / Gemini Style
       ========================================================= */

    .bottom-nav {
        position: fixed;
        z-index: 1100;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 4px;
        padding: 12px 8px max(12px, env(safe-area-inset-bottom));
        background: var(--surface, #FFFFFF);
        box-shadow: 0px -1px 2px 0px rgba(0, 0, 0, 0.1), 0px -2px 6px 2px rgba(0, 0, 0, 0.05); /* M3 Bottom Elevation */
        border: none;
    }

    .bottom-nav-item {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border: 0;
        background: transparent;
        color: var(--text-muted, #444746);
        font-family: "Google Sans", "Google Sans Text", Roboto, "Outfit", sans-serif;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.2;
        letter-spacing: 0.2px;
        text-align: center;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: color 0.2s ease;
    }

    .bottom-nav-item:hover {
        color: var(--text-main, #1F1F1F);
    }

    .bottom-nav-item:active {
        transform: scale(0.98);
    }

    .bottom-nav-item:focus-visible {
        outline: none;
    }

    .bottom-nav-item:focus-visible .bottom-nav-icon-wrap {
        outline: 2px solid var(--primary, #0B1F4B);
        outline-offset: 2px;
    }

    .bottom-nav-item[aria-current="page"],
    .bottom-nav-item[aria-pressed="true"],
    .bottom-nav-item[aria-expanded="true"] {
        color: var(--text-main, #1F1F1F);
        font-weight: 600;
    }

    /* M3 Pill-shaped active indicator */
    .bottom-nav-icon-wrap {
        display: grid;
        width: 100%;
        max-width: 56px;
        height: 32px;
        place-items: center;
        border-radius: 16px; /* Perfect pill for 32px height */
        color: currentColor;
        transition: background-color 0.2s ease, color 0.2s ease;
    }

    .bottom-nav-item:hover .bottom-nav-icon-wrap {
        background: rgba(31, 31, 31, 0.08); /* M3 hover state */
    }

    .bottom-nav-item[aria-current="page"] .bottom-nav-icon-wrap,
    .bottom-nav-item[aria-pressed="true"] .bottom-nav-icon-wrap,
    .bottom-nav-item[aria-expanded="true"] .bottom-nav-icon-wrap {
        background: var(--primary-soft, #E8EEF7);
        color: var(--primary, #0B1F4B);
    }

    .bottom-nav-icon {
        font-size: 24px;
        line-height: 1;
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
        transition: font-variation-settings 0.2s ease, transform 0.2s ease;
    }

    .bottom-nav-item[aria-current="page"] .bottom-nav-icon,
    .bottom-nav-item[aria-pressed="true"] .bottom-nav-icon,
    .bottom-nav-item[aria-expanded="true"] .bottom-nav-icon {
        font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24;
    }

    @media (min-width: 769px) {
        .bottom-nav {
            display: none;
        }
    }

    @media (max-width: 360px) {
        .bottom-nav {
            gap: 1px;
            padding-right: 4px;
            padding-left: 4px;
        }

        .bottom-nav-item {
            font-size: 10px;
            letter-spacing: -0.1px;
        }

        .bottom-nav-icon-wrap {
            max-width: 48px;
        }
    }
</style>

<nav class="bottom-nav" aria-label="Mobile navigation">
    <button class="bottom-nav-item active" type="button" aria-label="Home" aria-current="page" onclick="window.switchView('view-dashboard', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">home</span></span>
        <span>Home</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Contacts" onclick="window.switchView('view-contacts', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">contact_page</span></span>
        <span>Contacts</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="My tasks" onclick="window.switchView('view-my-tasks', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">task_alt</span></span>
        <span>My Task</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Appointments" onclick="window.switchView('view-appointments', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">event_available</span></span>
        <span>Appointments</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Calculator" data-nav-action="calculator" aria-pressed="false" onclick="window.switchView('view-calc', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">calculate</span></span>
        <span>Calc</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Open menu" aria-expanded="false" onclick="window.toggleMenu()">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">menu_open</span></span>
        <span>Menu</span>
    </button>
</nav>
