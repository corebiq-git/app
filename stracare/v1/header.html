<style>
    .dashboard-header {
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 24px;
        background: var(--surface, #FFFFFF);
        border-bottom: 1px solid var(--outline-soft, #C4C7C5);
        position: relative;
        z-index: 60;
        font-family: "Google Sans", "Google Sans Text", Roboto, "Outfit", sans-serif;
    }

    .sidebar-toggle-button {
        width: 40px;
        height: 40px;
        display: grid;
        flex: 0 0 40px;
        place-items: center;
        border: 0;
        border-radius: 50%; /* M3 Circular interaction */
        background: transparent;
        color: var(--text-muted, #444746);
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }

    .sidebar-toggle-button:hover,
    .sidebar-toggle-button[aria-expanded="true"] {
        background: rgba(31, 31, 31, 0.08); /* M3 Hover state */
        color: var(--text-main, #1F1F1F);
    }

    .sidebar-toggle-button:focus-visible,
    .notification-button:focus-visible,
    .profile-button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .sidebar-toggle-button .material-symbols-rounded {
        font-size: 24px;
    }

    .module-search {
        position: relative;
        width: min(100%, 720px);
        flex: 1 1 420px;
        margin: 0;
    }

    /* M3 Search Bar */
    .module-search-box {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: var(--surface-container, #F0F4F9);
        border: none;
        border-radius: 9999px; /* Pill shape */
        color: var(--text-muted, #444746);
        transition: background 0.2s, box-shadow 0.2s;
    }

    .module-search-box:focus-within {
        background: var(--surface, #FFFFFF);
        box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 1px 3px 1px rgba(0, 0, 0, 0.15); /* M3 Elevation 1 */
    }

    .module-search-box > .material-symbols-rounded {
        flex: 0 0 auto;
        font-size: 20px;
        color: var(--text-muted, #444746);
    }
    
    .module-search-box:focus-within > .material-symbols-rounded {
        color: var(--primary, #0B1F4B);
    }

    .module-search-input {
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--text-main, #1F1F1F);
        font: inherit;
        font-size: 16px;
    }

    .module-search-input::placeholder {
        color: var(--text-muted, #444746);
    }

    .module-search-clear {
        width: 32px;
        height: 32px;
        display: none;
        flex: 0 0 32px;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--text-muted, #444746);
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }

    .module-search-clear:hover {
        background: rgba(31, 31, 31, 0.08);
        color: var(--text-main, #1F1F1F);
    }

    .module-search-input:not(:placeholder-shown) ~ .module-search-clear {
        display: flex;
    }

    .module-search-clear .material-symbols-rounded {
        font-size: 20px;
    }

    /* M3 Floating Panel */
    .module-search-results {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        display: none;
        max-height: min(60vh, 420px);
        overflow-y: auto;
        padding: 8px;
        background: var(--surface, #FFFFFF);
        border: none;
        border-radius: 16px; /* M3 Radius */
        box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15); /* M3 Elevation 2 */
        z-index: 100;
    }

    .module-search-results.open {
        display: block;
    }

    .module-search-result {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        border: 0;
        border-radius: 9999px; /* M3 List Item Pill */
        background: transparent;
        color: var(--text-main, #1F1F1F);
        text-align: left;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        transition: background 0.2s;
    }

    .module-search-result:hover,
    .module-search-result:focus-visible {
        outline: 0;
        background: rgba(31, 31, 31, 0.04);
    }

    .module-search-result .material-symbols-rounded {
        color: var(--text-muted, #444746);
        font-size: 20px;
    }

    .module-search-empty {
        padding: 16px;
        color: var(--text-muted, #444746);
        font-size: 14px;
        text-align: center;
    }

    .header-actions {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .notification-button,
    .profile-button {
        position: relative;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: var(--text-muted, #444746);
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
    }

    .notification-button:hover,
    .profile-button:hover,
    .profile-button[aria-expanded="true"] {
        background: rgba(31, 31, 31, 0.08);
        color: var(--text-main, #1F1F1F);
    }

    .notification-button .material-symbols-rounded,
    .profile-button .material-symbols-rounded {
        font-size: 24px;
    }

    .notification-button.has-unread .material-symbols-rounded {
        transform-origin: 50% 10%;
        animation: notification-ring 1.8s ease-in-out infinite;
    }

    .notification-badge {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 8px;
        height: 8px;
        border: 2px solid var(--surface);
        border-radius: 50%;
        background: var(--danger, #B3261E);
    }

    @keyframes notification-ring {
        0%, 56%, 100% { transform: rotate(0); }
        8%, 24%, 40% { transform: rotate(13deg); }
        16%, 32%, 48% { transform: rotate(-13deg); }
    }

    @media (prefers-reduced-motion: reduce) {
        .notification-button.has-unread .material-symbols-rounded { animation: none; }
    }

    /* M3 Profile Floating Panel */
    .profile-menu {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        display: none;
        width: min(320px, calc(100vw - 24px));
        padding: 24px;
        background: var(--surface, #FFFFFF);
        border: none;
        border-radius: 24px; /* M3 Large Dialog Radius */
        box-shadow: 0px 1px 2px 0px rgba(0, 0, 0, 0.3), 0px 2px 6px 2px rgba(0, 0, 0, 0.15); /* M3 Elevation 2 */
        z-index: 110;
    }

    .profile-menu.open {
        display: block;
    }

    .profile-name {
        margin: 0;
        color: var(--text-main, #1F1F1F);
        font-size: 18px;
        font-weight: 400;
        overflow-wrap: anywhere;
    }

    .profile-email {
        margin: 4px 0 16px;
        color: var(--text-muted, #444746);
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    .profile-details {
        display: grid;
        grid-template-columns: 72px minmax(0, 1fr);
        gap: 8px 12px;
        padding: 16px 0;
        border-top: 1px solid var(--outline-soft, #C4C7C5);
        border-bottom: 1px solid var(--outline-soft, #C4C7C5);
        font-size: 13px;
    }

    .profile-detail-label {
        color: var(--text-muted, #444746);
        font-weight: 500;
    }

    .profile-detail-value {
        color: var(--text-main, #1F1F1F);
        font-weight: 500;
        overflow-wrap: anywhere;
    }

    /* M3 Pill Button */
    .profile-signout {
        width: 100%;
        min-height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 16px;
        padding: 0 24px;
        border: 0;
        border-radius: 9999px;
        background: var(--primary-soft, #E8EEF7);
        color: var(--primary, #0B1F4B);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
    }

    .profile-signout:hover {
        background: rgba(11, 31, 75, 0.12); /* Soft hover state */
    }

    .profile-signout .material-symbols-rounded {
        font-size: 18px;
    }

    @media (max-width: 768px) {
        .dashboard-header {
            min-height: 64px;
            gap: 12px;
            padding: 8px 16px;
        }

        .sidebar-toggle-button { display: none; }

        .module-search {
            width: auto;
            flex: 1 1 auto;
        }

        .module-search-box {
            height: 44px;
            gap: 8px;
            padding: 0 12px;
        }

        .module-search-input {
            font-size: 14px;
        }

        .header-actions {
            gap: 4px;
        }
    }
</style>

<header class="dashboard-header">
    <button
        class="sidebar-toggle-button"
        id="sidebar-toggle-button"
        type="button"
        aria-label="Collapse navigation"
        aria-expanded="true"
        title="Collapse navigation"
        onclick="window.toggleSidebarCollapse()">
        <span class="material-symbols-rounded" aria-hidden="true">menu</span>
    </button>

    <div class="module-search">
        <div class="module-search-box">
            <span class="material-symbols-rounded" aria-hidden="true">search</span>
            <input
                class="module-search-input"
                id="module-search-input"
                type="text"
                placeholder="Search modules..."
                autocomplete="off"
                aria-label="Search dashboard modules"
                aria-controls="module-search-results"
                aria-expanded="false"
                oninput="window.searchModules(this.value)"
                onkeydown="window.handleModuleSearchKeydown(event)">
            <button
                class="module-search-clear"
                type="button"
                aria-label="Clear module search"
                title="Clear search"
                onclick="window.clearModuleSearch()">
                <span class="material-symbols-rounded" aria-hidden="true">close</span>
            </button>
        </div>
        <div class="module-search-results" id="module-search-results" role="listbox"></div>
    </div>

    <div class="header-actions">
        <button class="notification-button" id="notification-button" type="button" aria-label="Notifications" title="App updates" onclick="window.openAppUpdates()">
            <span class="material-symbols-rounded" id="bell-icon" aria-hidden="true">notifications</span>
            <span class="notification-badge" id="notif-badge" aria-hidden="true" hidden></span>
        </button>
        <button
            class="profile-button"
            id="profile-button"
            type="button"
            aria-label="View signed-in user profile"
            aria-expanded="false"
            aria-controls="profile-menu"
            onclick="window.toggleProfileMenu()">
            <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
        </button>
        <section class="profile-menu" id="profile-menu" aria-label="User profile">
            <h2 class="profile-name" id="profile-name">Signed-in user</h2>
            <p class="profile-email" id="profile-email"></p>
            <div class="profile-details">
                <span class="profile-detail-label">Role</span>
                <span class="profile-detail-value" id="profile-role"></span>
                <span class="profile-detail-label">Branch</span>
                <span class="profile-detail-value" id="profile-branch"></span>
            </div>
            <button class="profile-signout" type="button" onclick="window.handleLogout()">
                <span class="material-symbols-rounded" aria-hidden="true">logout</span>
                Sign out
            </button>
        </section>
    </div>
</header>
