<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COREBIQ | Contacts</title>
    <link rel="stylesheet" href="css/corebiq.css">
</head>
<body>
<div class="module-container" id="contacts-module">
    <style>
        #contacts-module {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            color: var(--text);
            font-family: Outfit, sans-serif;
        }

        #contacts-module * { box-sizing: border-box; }

        #contacts-module .contacts-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        #contacts-module .contacts-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #contacts-module .contacts-title-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 23px;
        }

        #contacts-module h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 650;
        }

        #contacts-module .contacts-subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        #contacts-module .contacts-search {
            width: 100%;
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 0 14px;
            border: 1px solid var(--outline-soft);
            border-radius: 16px;
            background: #fff;
            color: var(--muted);
            box-shadow: var(--shadow);
        }

        #contacts-module .contacts-search:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        #contacts-module .contacts-search .material-symbols-rounded {
            color: var(--primary);
        }

        #contacts-module .contacts-search input {
            width: 100%;
            min-width: 0;
            height: 42px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        #contacts-module .contacts-count {
            margin: 0 0 9px 4px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        #contacts-module .contacts-list {
            overflow: hidden;
            border: 1px solid var(--outline-soft);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        #contacts-module .contact-row {
            min-height: 78px;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--outline-soft);
            transition: background-color .15s ease;
        }

        #contacts-module .contact-row:last-child { border-bottom: 0; }
        #contacts-module .contact-row:hover { background: #F8FAFF; }

        #contacts-module .contact-avatar {
            width: 46px;
            height: 46px;
            display: grid;
            flex: 0 0 46px;
            place-items: center;
            border-radius: 50%;
            background: #E8F0FE;
            color: #1A73E8;
            font-size: 15px;
            font-weight: 700;
        }

        #contacts-module .contact-row:nth-child(4n + 2) .contact-avatar {
            background: #F3E8FD;
            color: #8E44AD;
        }

        #contacts-module .contact-row:nth-child(4n + 3) .contact-avatar {
            background: #FCE8E6;
            color: #D93025;
        }

        #contacts-module .contact-row:nth-child(4n + 4) .contact-avatar {
            background: #E6F4EA;
            color: #188038;
        }

        #contacts-module .contact-details {
            min-width: 0;
            flex: 1;
        }

        #contacts-module .contact-name {
            display: block;
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #contacts-module .contact-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        #contacts-module .contact-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 7px;
        }

        #contacts-module .contact-action {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid var(--outline-soft);
            border-radius: 50%;
            background: #fff;
            color: var(--primary);
            text-decoration: none;
            transition: background-color .15s ease, transform .15s ease;
        }

        #contacts-module .contact-action:hover {
            transform: translateY(-1px);
            background: var(--primary-soft);
        }

        #contacts-module .contact-action.whatsapp {
            border-color: #CDE8D3;
            color: #188038;
        }

        #contacts-module .contact-action.whatsapp:hover { background: #E8F5E9; }

        #contacts-module .contacts-state {
            padding: 32px 16px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
        }

        #contacts-module .contacts-state.error {
            color: var(--danger);
        }

        @media (max-width: 520px) {
            #contacts-module h1 { font-size: 22px; }
            #contacts-module .contact-row { gap: 10px; padding: 11px 12px; }
            #contacts-module .contact-avatar { width: 42px; height: 42px; flex-basis: 42px; }
            #contacts-module .contact-action { width: 38px; height: 38px; }
        }
    </style>

    <header class="contacts-heading">
        <div class="contacts-title">
            <span class="material-symbols-rounded contacts-title-icon" aria-hidden="true">contacts</span>
            <div>
                <h1>Contacts</h1>
                <p class="contacts-subtitle">Patient contacts with quick call and WhatsApp actions.</p>
            </div>
        </div>
    </header>

    <label class="contacts-search">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input id="contacts-search-input" type="text" placeholder="Search name, mobile, or patient ID..." autocomplete="off">
    </label>
    <p class="contacts-count" id="contacts-count">Loading contacts...</p>
    <div class="contacts-list" id="contacts-list" aria-live="polite">
        <div class="contacts-state">Loading patient contacts...</div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import {
            collection,
            doc,
            getDoc,
            getDocs,
            query,
            where
        } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';

        const contactsList = document.getElementById('contacts-list');
        const searchInput = document.getElementById('contacts-search-input');
        const countElement = document.getElementById('contacts-count');
        let contacts = [];
        let loadingUser = null;

        function showState(message, isError = false) {
            contactsList.replaceChildren();
            const state = document.createElement('div');
            state.className = `contacts-state${isError ? ' error' : ''}`;
            state.textContent = message;
            contactsList.appendChild(state);
            countElement.textContent = isError ? 'Unable to load contacts' : '0 contacts';
        }

        function getInitials(name) {
            return name.trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || '?';
        }

        function normalizePhone(value) {
            let digits = String(value || '').replace(/\D/g, '');
            if (digits.startsWith('00')) digits = digits.slice(2);
            if (digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
            if (digits.length === 10) digits = `91${digits}`;
            return digits;
        }

        function appendContact(contact) {
            const row = document.createElement('article');
            row.className = 'contact-row';

            const avatar = document.createElement('span');
            avatar.className = 'contact-avatar';
            avatar.setAttribute('aria-hidden', 'true');
            avatar.textContent = getInitials(contact.name);

            const details = document.createElement('div');
            details.className = 'contact-details';
            const name = document.createElement('span');
            name.className = 'contact-name';
            name.textContent = contact.name;
            const meta = document.createElement('div');
            meta.className = 'contact-meta';
            const mobile = document.createElement('span');
            mobile.textContent = contact.mobile || 'No phone number';
            meta.appendChild(mobile);
            if (contact.patientId) {
                const patientId = document.createElement('span');
                patientId.textContent = contact.patientId;
                meta.appendChild(patientId);
            }
            details.append(name, meta);
            row.append(avatar, details);

            const actions = document.createElement('div');
            actions.className = 'contact-actions';
            if (contact.phoneDigits) {
                const call = document.createElement('a');
                call.className = 'contact-action';
                call.href = `tel:+${contact.phoneDigits}`;
                call.setAttribute('aria-label', `Call ${contact.name}`);
                call.title = 'Call';
                call.innerHTML = '<span class="material-symbols-rounded" aria-hidden="true">call</span>';
                actions.appendChild(call);

                const whatsapp = document.createElement('a');
                whatsapp.className = 'contact-action whatsapp';
                whatsapp.href = `https://wa.me/${contact.phoneDigits}`;
                whatsapp.target = '_blank';
                whatsapp.rel = 'noopener noreferrer';
                whatsapp.setAttribute('aria-label', `WhatsApp ${contact.name}`);
                whatsapp.title = 'WhatsApp';
                whatsapp.innerHTML = '<span class="material-symbols-rounded" aria-hidden="true">chat</span>';
                actions.appendChild(whatsapp);
            }
            row.appendChild(actions);
            contactsList.appendChild(row);
        }

        function renderContacts() {
            const search = searchInput.value.trim().toLocaleLowerCase();
            const filtered = contacts.filter(contact =>
                `${contact.name} ${contact.mobile} ${contact.patientId}`.toLocaleLowerCase().includes(search)
            );
            countElement.textContent = `${filtered.length} ${filtered.length === 1 ? 'contact' : 'contacts'}`;
            contactsList.replaceChildren();
            if (!filtered.length) {
                const state = document.createElement('div');
                state.className = 'contacts-state';
                state.textContent = contacts.length
                    ? 'No contacts match your search.'
                    : 'No patient contacts found.';
                contactsList.appendChild(state);
                return;
            }
            filtered.forEach(appendContact);
        }

        async function loadContacts(user) {
            if (!user || loadingUser === user.uid) return;
            loadingUser = user.uid;
            contactsList.replaceChildren();
            const state = document.createElement('div');
            state.className = 'contacts-state';
            state.textContent = 'Loading patient contacts...';
            contactsList.appendChild(state);
            countElement.textContent = 'Loading contacts...';

            try {
                const email = String(user.email || '').toLowerCase();
                if (!email) throw new Error('Signed-in account has no email address.');
                const userSnapshot = await getDoc(doc(db, 'users', email));
                if (!userSnapshot.exists()) throw new Error('User profile was not found.');
                const currentUser = userSnapshot.data();
                let patientQuery;
                if (currentUser && currentUser.role !== 'admin') {
                    patientQuery = query(
                        collection(db, 'patients'),
                        where('branch', '==', currentUser.branch)
                    );
                } else {
                    patientQuery = query(collection(db, 'patients'));
                }
                const snapshot = await getDocs(patientQuery);
                contacts = snapshot.docs.map(patientDoc => {
                    const data = patientDoc.data();
                    return {
                        name: String(data.name || 'Unnamed contact').trim(),
                        mobile: String(data.mobile || '').trim(),
                        patientId: String(data.patientId || '').trim(),
                        phoneDigits: normalizePhone(data.mobile)
                    };
                }).sort((a, b) => a.name.localeCompare(b.name));
                loadingUser = null;
                renderContacts();
            } catch (error) {
                console.error('Unable to load patient contacts:', error);
                loadingUser = null;
                showState(`Could not load contacts: ${error.message}`, true);
            }
        }

        searchInput.addEventListener('input', renderContacts);
        onAuthStateChanged(auth, user => {
            if (!user) {
                contacts = [];
                loadingUser = null;
                showState('Sign in to view patient contacts.', true);
                return;
            }
            loadContacts(user);
        });
    </script>
</div>
</body>
</html>
