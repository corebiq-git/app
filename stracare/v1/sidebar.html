<style>
    /* =========================================================
       SIDEBAR BASE - Material 3 / Gemini Style
       ========================================================= */

    .sidebar-inner-wrapper {
        display: flex;
        flex-direction: column;
        min-height: 100%;
        height: 100%;
        font-family: "Google Sans", "Google Sans Text", Roboto, "Outfit", sans-serif;
        background: var(--surface-container, #F0F4F9); /* Exact M3 Drawer Background */
    }

    /* =========================================================
       SIDEBAR HEADER
       ========================================================= */

    .sidebar-header {
        position: sticky;
        top: 0;
        background: transparent;
        z-index: 10;
        border-bottom: none; /* M3 removes heavy header borders */
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 72px;
        min-height: 72px;
    }

    .sidebar-brand {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 12px;
        min-width: 0;
        padding-left: 8px;
    }

    .sidebar-logo {
        display: block;
        width: 32px;
        height: 32px;
        object-fit: contain;
        flex: 0 0 32px;
    }

    .sidebar-name {
        display: block;
        width: min(100%, 140px);
        max-height: 42px;
        object-fit: contain;
    }

    .close-menu {
        background: transparent;
        border: none;
        cursor: pointer;
        color: var(--text-muted, #444746);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%; /* M3 circular icon buttons */
        transition: background 0.2s, color 0.2s;
    }

    .close-menu:hover {
        background: rgba(31, 31, 31, 0.08); /* M3 Hover state */
        color: var(--text-main, #1F1F1F);
    }

    .sidebar-brand-actions {
        display: flex;
        align-items: center;
        flex: 0 0 auto;
    }

    /* =========================================================
       NAVIGATION
       ========================================================= */

    .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0 20px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        scrollbar-width: thin;
    }

    /* =========================================================
       NAVIGATION LINKS
       ========================================================= */

    .nav-link {
        display: flex;
        align-items: center;
        width: calc(100% - 24px);
        margin: 2px 12px;
        height: 48px; /* M3 standard touch target */
        padding: 0 16px;
        border: none;
        background: transparent;
        text-align: left;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-main, #1F1F1F);
        border-radius: 9999px; /* M3 Pill shape */
        transition: background-color 0.2s ease, color 0.2s ease;
        font-family: inherit;
        letter-spacing: 0.1px;
    }

    .nav-link:hover,
    .nav-link:active {
        background: rgba(31, 31, 31, 0.08);
        color: var(--text-main, #1F1F1F);
    }

    .nav-link:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .nav-link.active {
        background: var(--primary, #0B1F4B);
        color: #FFFFFF;
        font-weight: 500;
    }

    .nav-link.active:hover {
        background: var(--primary-hover, #071630);
    }

    .nav-link .material-symbols-rounded {
        font-size: 20px;
        margin-right: 12px;
        color: var(--text-muted, #444746);
        transition: color 0.2s ease;
        flex-shrink: 0;
    }

    .nav-link.active .material-symbols-rounded {
        color: #FFFFFF;
    }

    /* =========================================================
       DIVIDERS & LABELS
       ========================================================= */

    .nav-divider {
        height: 1px;
        background: var(--outline-soft, #C4C7C5);
        margin: 8px 24px;
        flex-shrink: 0;
    }

    .nav-section-label {
        margin: 16px 24px 8px;
        color: var(--text-muted, #444746);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.1px;
        line-height: 1.2;
        font-family: "Google Sans Text", sans-serif;
    }

    /* =========================================================
       COLLAPSED STATE
       ========================================================= */

    #sidebar-container.is-collapsed .sidebar-header {
        justify-content: center;
        padding: 12px 8px;
    }

    #sidebar-container.is-collapsed .sidebar-brand {
        justify-content: center;
        padding-left: 0;
    }

    #sidebar-container.is-collapsed .close-menu { display: none; }
    #sidebar-container.is-collapsed .sidebar-name { display: none; }
    
    #sidebar-container.is-collapsed .sidebar-logo {
        width: 36px;
        height: 36px;
    }

    #sidebar-container.is-collapsed .sidebar-nav {
        padding-left: 6px;
        padding-right: 6px;
    }

    #sidebar-container.is-collapsed .nav-link {
        width: 48px;
        height: 48px;
        justify-content: center;
        margin: 2px auto;
        padding: 0;
        border-radius: 50%; /* Circle for collapsed */
        font-size: 0;
    }

    #sidebar-container.is-collapsed .nav-link .material-symbols-rounded {
        margin: 0;
    }

    #sidebar-container.is-collapsed .nav-divider { margin: 8px 12px; }
    #sidebar-container.is-collapsed .nav-section-label { display: none; }
    #sidebar-container.is-collapsed .sidebar-footer { display: none; }

    /* =========================================================
       BADGES
       ========================================================= */

    .menu-badge {
        margin-left: auto;
        background: var(--primary);
        color: white;
        padding: 2px 8px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 500;
        font-family: "Google Sans Text", sans-serif;
    }

    .menu-badge.pending {
        background: var(--danger, #B3261E);
        color: #fff;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    .sidebar-footer {
        padding: 16px 24px;
        border-top: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: transparent;
        margin-top: auto;
        flex-shrink: 0;
    }

    .footer-logo {
        margin: 0 0 4px;
        background: linear-gradient(100deg, #0B1F4B 0%, #274777 68%, #8394B3 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        color: var(--primary, #0B1F4B);
        font-size: 18px;
        font-weight: 500;
        letter-spacing: -0.2px;
    }

    .footer-app-name {
        max-width: 190px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted, #444746);
        text-align: center;
        letter-spacing: 0.2px;
    }

    /* =========================================================
       DESKTOP & MOBILE RESPONSIVENESS
       ========================================================= */

    @media (min-width: 769px) {
        .close-menu { display: none; }
    }

    @media (max-width: 768px) {
        .sidebar-header {
            height: 64px;
            min-height: 64px;
            padding: 8px 16px;
        }

        .sidebar-logo {
            width: 32px;
            height: 32px;
            flex-basis: 32px;
        }

        .close-menu {
            display: flex;
            width: 40px;
            height: 40px;
        }

        .nav-link {
            height: 52px; /* Slightly taller for mobile touch */
        }
    }
</style>
