<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bottom Nav - Animated Menu Icon</title>
  
  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" rel="stylesheet" />
  
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --md-sys-color-surface: #FFFFFF;
      --md-sys-color-on-surface-variant: #444746;
      --md-sys-color-secondary-container: #E8EAED; /* Light Grey */
      --md-sys-color-on-secondary-container: #1F1F1F; /* Dark Grey/Black */
      --md-sys-color-outline-variant: #C4C7C5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #F3F4F9; 
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    .gpay-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80px;
      background-color: var(--md-sys-color-surface);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
      padding-bottom: env(safe-area-inset-bottom);
      border-top: 1px solid var(--md-sys-color-outline-variant);
      box-shadow: 0 -1px 2px rgba(0, 0, 0, 0.05);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--md-sys-color-on-surface-variant);
      flex: 1;
      height: 100%;
      gap: 6px; 
      cursor: pointer;
    }

    .icon-container {
      width: 64px;
      height: 32px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
      transition: background-color 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .label {
      font-size: 14px; 
      font-weight: 500;
      line-height: 18px;
      letter-spacing: 0.1px;
      transition: color 0.2s cubic-bezier(0.2, 0, 0, 1);
    }

    .material-symbols-rounded {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      font-size: 24px;
      transition: color 0.2s cubic-bezier(0.2, 0, 0, 1), font-variation-settings 0.2s ease;
    }

    /* Active State Behaviors */
    .nav-item.active {
      color: var(--md-sys-color-on-secondary-container);
    }

    .nav-item.active .icon-container {
      background-color: var(--md-sys-color-secondary-container);
    }

    .nav-item.active .material-symbols-rounded {
      color: var(--md-sys-color-on-secondary-container);
      /* This setting triggers the "fill" animation */
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    .nav-item.active .label {
      font-weight: 600;
      color: var(--md-sys-color-on-secondary-container);
    }
  </style>
</head>
<body>

  <nav class="gpay-bottom-nav">
    <a href="#" class="nav-item active">
      <div class="icon-container">
        <span class="material-symbols-rounded">home</span>
      </div>
      <span class="label">Home</span>
    </a>
    
    <a href="#" class="nav-item">
      <div class="icon-container">
        <span class="material-symbols-rounded">contacts</span>
      </div>
      <span class="label">Contacts</span>
    </a>
    
    <a href="#" class="nav-item">
      <div class="icon-container">
        <span class="material-symbols-rounded">task</span>
      </div>
      <span class="label">Task</span>
    </a>

    <a href="#" class="nav-item">
      <div class="icon-container">
        <!-- Changed to grid_view so it visibly fills in on click -->
        <span class="material-symbols-rounded">grid_view</span> 
      </div>
      <span class="label">Menu</span>
    </a>
  </nav>

  <script>
    const navItems = document.querySelectorAll('.nav-item');

    navItems.forEach(item => {
      item.addEventListener('click', (e) => {
        e.preventDefault(); 
        
        navItems.forEach(nav => nav.classList.remove('active'));
        item.classList.add('active');
      });
    });
  </script>
</body>
</html>
