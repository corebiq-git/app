<!-- We place the CSS link INSIDE the module container so your DOMParser router grabs it -->
<div class="module-container" id="company-module">
  
  <link rel="stylesheet" href="css/company-module.css">
  
  <div class="app-card">
    <div class="toolbar">
      <div class="toolbar-title">Companies</div>
      
      <!-- Search Input -->
      <div class="search-container">
        <span class="material-symbols-rounded">search</span>
        <input type="text" class="search-input" id="searchInput" placeholder="Search companies...">
      </div>

      <!-- Action Buttons -->
      <div class="action-icons" style="display: flex; gap: 4px;">
        <button class="icon-btn" title="Sort"><span class="material-symbols-rounded">sort</span></button>
        <button class="icon-btn" title="Filter"><span class="material-symbols-rounded">filter_list</span></button>
        <button class="icon-btn" title="Download"><span class="material-symbols-rounded">download</span></button>
        <button class="icon-btn" title="Options"><span class="material-symbols-rounded">more_vert</span></button>
      </div>

      <!-- Primary Action -->
      <button class="btn btn-primary" id="openCompanyModalBtn">
        <span class="material-symbols-rounded">add</span>
        Add Company
      </button>
    </div>

    <!-- Live Data Area -->
    <div class="data-view" id="companyContainer">
      <!-- Records injected by JS -->
    </div>
  </div>

  <!-- Popup Form Modal for Company -->
  <div class="modal-overlay" id="companyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Register Company</h2>
        <button class="icon-btn" id="closeModalIcon">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
      
      <form id="companyForm">
        <div class="form-grid">
          
          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="companyName">Legal Company Name</label>
            <input type="text" id="companyName" class="form-control" placeholder="Enter full legal name" required>
          </div>

          <div class="form-grid two-cols" style="grid-column: 1 / -1; gap: 16px;">
            <div class="form-group">
              <label for="entityType">Entity Type</label>
              <select id="entityType" class="form-control">
                <option value="Private Limited">Private Limited</option>
                <option value="LLP">LLP</option>
                <option value="Partnership">Partnership</option>
                <option value="Sole Proprietorship">Sole Proprietorship</option>
                <option value="Public Limited">Public Limited</option>
              </select>
            </div>
            
            <div class="form-group">
              <label for="gstin">GSTIN / Tax ID</label>
              <input type="text" id="gstin" class="form-control" placeholder="e.g. 32XXXXX1234X1ZX">
            </div>

            <div class="form-group">
              <label for="email">Primary Email</label>
              <input type="email" id="email" class="form-control" placeholder="contact@company.com">
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" class="form-control" placeholder="+91 00000 00000">
            </div>
          </div>

          <div class="form-group" style="grid-column: 1 / -1;">
            <label for="status">Compliance Status</label>
            <select id="status" class="form-control">
              <option value="active">Active</option>
              <option value="pending">Pending Registration</option>
              <option value="archived">Inactive/Struck Off</option>
            </select>
          </div>

        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-outlined" id="cancelBtn">Cancel</button>
          <button type="button" class="btn btn-tonal" id="clearBtn">Clear Form</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Company</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts must remain inside the fetched document to be parsed/re-injected by your router -->
<script type="module">
  import { db } from "./firebase-config.js";
  import { 
    collection, 
    addDoc, 
    onSnapshot, 
    query, 
    orderBy, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

  // --- DOM Elements ---
  const modal = document.getElementById('companyModal');
  const openBtn = document.getElementById('openCompanyModalBtn');
  const closeIcon = document.getElementById('closeModalIcon');
  const cancelBtn = document.getElementById('cancelBtn');
  const clearBtn = document.getElementById('clearBtn');
  const form = document.getElementById('companyForm');
  const dataContainer = document.getElementById('companyContainer');
  const saveBtn = document.getElementById('saveBtn');

  // --- Modal Controls ---
  const openModal = () => modal.classList.add('active');
  const closeModal = () => modal.classList.remove('active');

  if(openBtn) openBtn.addEventListener('click', openModal);
  if(closeIcon) closeIcon.addEventListener('click', closeModal);
  if(cancelBtn) cancelBtn.addEventListener('click', closeModal);
  if(modal) modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  if(clearBtn) clearBtn.addEventListener('click', () => { form.reset(); });

  // Firestore Collection Reference
  const companiesCollection = collection(db, "companies");
  const q = query(companiesCollection, orderBy("createdAt", "desc"));

  // --- Real-time Firestore Listener ---
  if(dataContainer) {
    onSnapshot(q, (snapshot) => {
      dataContainer.innerHTML = '';

      if (snapshot.empty) {
        dataContainer.innerHTML = `<div class="empty-state">No companies registered yet. Click 'Add Company' to begin.</div>`;
        return;
      }

      snapshot.forEach((doc) => {
        const record = doc.data();
        const card = document.createElement('div');
        card.className = 'record-card';
        
        card.innerHTML = `
          <div class="record-details">
            <h3>${record.name}</h3>
            <div class="meta">
              <span>
                <span class="material-symbols-rounded" style="font-size: 16px;">domain</span>
                ${record.type}
              </span>
              ${record.gstin ? `
              <span>
                <span class="material-symbols-rounded" style="font-size: 16px;">receipt_long</span>
                ${record.gstin}
              </span>` : ''}
            </div>
            <div class="meta" style="margin-top: 8px;">
              ${record.email ? `<span><span class="material-symbols-rounded" style="font-size: 16px;">mail</span> ${record.email}</span>` : ''}
              ${record.phone ? `<span><span class="material-symbols-rounded" style="font-size: 16px;">call</span> ${record.phone}</span>` : ''}
            </div>
          </div>
          <div class="badge ${record.status}">
            ${record.status.replace('-', ' ')}
          </div>
        `;
        dataContainer.appendChild(card);
      });
    }, (error) => {
      console.error("Firestore sync error:", error);
      dataContainer.innerHTML = `<div class="empty-state" style="color:var(--danger)">Failed to load data.</div>`;
    });
  }

  // --- Add New Document to Firestore ---
  if(form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      saveBtn.disabled = true;

      try {
        await addDoc(companiesCollection, {
          name: document.getElementById('companyName').value,
          type: document.getElementById('entityType').value,
          gstin: document.getElementById('gstin').value,
          email: document.getElementById('email').value,
          phone: document.getElementById('phone').value,
          status: document.getElementById('status').value,
          createdAt: serverTimestamp()
        });

        closeModal();
        form.reset();
      } catch (err) {
        console.error("Error saving document:", err);
        alert("Error saving record: " + err.message);
      } finally {
        saveBtn.disabled = false;
      }
    });
  }
</script>
