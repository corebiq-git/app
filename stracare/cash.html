<div class="module-container" id="cash-ledger-module" data-ledger-kind="cash">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0">
    <link rel="stylesheet" href="css/corebiq.css">
    <style>
        #cash-ledger-module,#cash-ledger-module *{box-sizing:border-box}
        #cash-ledger-module{--ledger-primary:#2563eb;--ledger-text:#0f172a;--ledger-muted:#64748b;--ledger-border:#e2e8f0;width:100%;max-width:1180px;margin:0 auto;color:var(--ledger-text);font-family:Inter,sans-serif}
        #cash-ledger-module .ledger-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}
        #cash-ledger-module h1{margin:0;font-size:26px;font-weight:750}
        #cash-ledger-module .subtitle{margin-top:5px;color:var(--ledger-muted);font-size:13px}
        #cash-ledger-module .head-actions{display:flex;gap:8px;flex-wrap:wrap}
        #cash-ledger-module button,#cash-ledger-module input,#cash-ledger-module select{font:inherit}
        #cash-ledger-module .ledger-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 13px;border:1px solid var(--ledger-border);border-radius:11px;background:#fff;color:var(--ledger-text);font-size:12px;font-weight:700;cursor:pointer}
        #cash-ledger-module .ledger-btn:hover{background:#f8fafc}
        #cash-ledger-module .ledger-btn.primary{border-color:#2563eb;background:#2563eb;color:#fff}
        #cash-ledger-module .ledger-btn.primary:hover{background:#1d4ed8}
        #cash-ledger-module .ledger-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:14px}
        #cash-ledger-module .ledger-card,#cash-ledger-module .ledger-panel{border:1px solid var(--ledger-border);border-radius:15px;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.05)}
        #cash-ledger-module .ledger-card{padding:14px 16px}
        #cash-ledger-module .ledger-card span{display:block;color:var(--ledger-muted);font-size:11px;font-weight:650}
        #cash-ledger-module .ledger-card strong{display:block;margin-top:6px;font-size:22px;font-weight:800}
        #cash-ledger-module .ledger-card.in strong{color:#047857}
        #cash-ledger-module .ledger-card.out strong{color:#b42318}
        #cash-ledger-module .ledger-panel{overflow:hidden}
        #cash-ledger-module .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--ledger-border)}
        #cash-ledger-module .panel-head h2{margin:0;font-size:15px;font-weight:750}
        #cash-ledger-module .filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;background:#f8fafc;border-bottom:1px solid var(--ledger-border)}
        #cash-ledger-module .filters input,#cash-ledger-module .filters select{min-height:38px;padding:8px 10px;border:1px solid var(--ledger-border);border-radius:10px;background:#fff;color:var(--ledger-text);font-size:12px}
        #cash-ledger-module .filters input[type=search]{flex:1 1 200px;min-width:170px}
        #cash-ledger-module .table-wrap{overflow:auto}
        #cash-ledger-module table{width:100%;min-width:850px;border-collapse:collapse;text-align:left}
        #cash-ledger-module th{padding:11px 13px;background:#f8fafc;color:var(--ledger-muted);font-size:10px;font-weight:750;text-transform:uppercase;white-space:nowrap}
        #cash-ledger-module td{padding:12px 13px;border-top:1px solid #eef0f4;font-size:12px;vertical-align:middle}
        #cash-ledger-module .amount-in{color:#047857;font-weight:750}
        #cash-ledger-module .amount-out{color:#b42318;font-weight:750}
        #cash-ledger-module .tag{display:inline-flex;padding:4px 8px;border-radius:99px;background:#eff6ff;color:#1d4ed8;font-size:10px;font-weight:750}
        #cash-ledger-module .empty{padding:28px;text-align:center;color:var(--ledger-muted)}
        #cash-ledger-module .error{color:#b42318}
        @media(max-width:680px){#cash-ledger-module .ledger-head{align-items:flex-start}#cash-ledger-module h1{font-size:22px}#cash-ledger-module .ledger-cards{gap:6px}#cash-ledger-module .ledger-card{padding:10px}#cash-ledger-module .ledger-card strong{font-size:16px}#cash-ledger-module .ledger-card span{font-size:10px}#cash-ledger-module .head-actions{justify-content:flex-end}#cash-ledger-module .head-actions .ledger-btn{padding:0 9px}}
        @media print{#cash-ledger-module .no-print{display:none!important}#cash-ledger-module .ledger-panel,#cash-ledger-module .ledger-card{box-shadow:none}#cash-ledger-module table{min-width:100%}}
    </style>
    <header class="ledger-head">
        <div><h1>Cash Ledger</h1><div class="subtitle">Cash-mode transactions, receipts and payments in one ledger.</div></div>
        <div class="head-actions no-print">
            <button class="ledger-btn" type="button" onclick="window.print()"><span class="material-symbols-rounded">print</span>Print</button>
            <button class="ledger-btn primary" type="button" onclick="window.openView('view-transaction')"><span class="material-symbols-rounded">add</span>Transactions</button>
        </div>
    </header>
    <section class="ledger-cards" aria-label="Cash ledger totals">
        <div class="ledger-card in"><span>Cash In</span><strong id="cashLedgerIn">₹0.00</strong></div>
        <div class="ledger-card out"><span>Cash Out</span><strong id="cashLedgerOut">₹0.00</strong></div>
        <div class="ledger-card"><span>Net Cash Movement</span><strong id="cashLedgerBalance">₹0.00</strong></div>
    </section>
    <section class="ledger-panel">
        <header class="panel-head"><h2>Cash Transactions</h2><span id="cashLedgerCount" class="subtitle">0 records</span></header>
        <div class="filters no-print">
            <input id="cashLedgerFrom" type="date" title="From date">
            <input id="cashLedgerTo" type="date" title="To date">
            <select id="cashLedgerType" aria-label="Transaction type"><option value="">All types</option><option>Sales</option><option>Receipt</option><option>Payment</option><option>Expense</option></select>
            <select id="cashLedgerBranch" aria-label="Branch"><option value="">All branches</option></select>
            <input id="cashLedgerSearch" type="search" placeholder="Search name, mobile, ID, reference…">
            <button class="ledger-btn" type="button" onclick="window.clearLedgerFilters('cash')">Clear</button>
        </div>
        <div class="table-wrap">
            <table><thead><tr><th>Date / Voucher</th><th>Patient / Ledger</th><th>Branch</th><th>Type / Mode</th><th style="text-align:right">In (+)</th><th style="text-align:right">Out (−)</th><th>Reference / Notes</th></tr></thead>
                <tbody id="cashLedgerRows"><tr><td colspan="7" class="empty">Loading cash transactions…</td></tr></tbody>
            </table>
        </div>
    </section>
    <script type="module">import { initializeLedgerView } from './ledger-view.js'; initializeLedgerView('cash');</script>
</div>
