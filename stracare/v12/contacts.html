<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COREBIQ | Contacts</title>
    <link rel="stylesheet" href="css/corebiq.css">
</head>
<body>
<div class="module-container" id="contacts-module">
    <style>
        #contacts-module {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            color: var(--text);
            font-family: Outfit, sans-serif;
        }

        #contacts-module * { box-sizing: border-box; }

        #contacts-module .contacts-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        #contacts-module .contacts-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #contacts-module .contacts-title-icon {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: var(--primary-soft);
            color: var(--primary);
            font-size: 23px;
        }

        #contacts-module h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 650;
        }

        #contacts-module .contacts-subtitle {
            margin: 4px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        #contacts-module .contacts-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin: 0 0 16px;
            padding: 4px;
            border: 1px solid var(--outline-soft);
            border-radius: 16px;
            background: #fff;
            box-shadow: var(--shadow);
            scrollbar-width: none;
        }

        #contacts-module .contacts-tabs::-webkit-scrollbar { display: none; }

        #contacts-module .contacts-tab {
            min-height: 42px;
            display: inline-flex;
            flex: 1 0 auto;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 16px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }

        #contacts-module .contacts-tab:hover { background: #F4F7FC; color: var(--primary); }
        #contacts-module .contacts-tab.active { background: var(--primary); color: #fff; }
        #contacts-module .contacts-tab:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        #contacts-module .contacts-tab .material-symbols-rounded { font-size: 19px; }

        #contacts-module .contacts-search {
            width: 100%;
            min-height: 46px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 0 14px;
            border: 1px solid var(--outline-soft);
            border-radius: 16px;
            background: #fff;
            color: var(--muted);
            box-shadow: var(--shadow);
        }

        #contacts-module .contacts-search:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        #contacts-module .contacts-search .material-symbols-rounded {
            color: var(--primary);
        }

        #contacts-module .contacts-search input {
            width: 100%;
            min-width: 0;
            height: 42px;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
        }

        #contacts-module .contacts-count {
            margin: 0 0 9px 4px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
        }

        #contacts-module .contacts-list {
            overflow: hidden;
            border: 1px solid var(--outline-soft);
            border-radius: 20px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        #contacts-module .contact-row {
            min-height: 78px;
            display: flex;
            align-items: center;
            gap: 13px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--outline-soft);
            transition: background-color .15s ease;
        }

        #contacts-module .contact-row:last-child { border-bottom: 0; }
        #contacts-module .contact-row:hover { background: #F8FAFF; }

        #contacts-module .contact-avatar {
            width: 46px;
            height: 46px;
            display: grid;
            flex: 0 0 46px;
            place-items: center;
            border-radius: 50%;
            background: #E8EEF7;
            color: #0B1F4B;
            font-size: 15px;
            font-weight: 700;
        }

        #contacts-module .contact-row:nth-child(4n + 2) .contact-avatar {
            background: #F3E8FD;
            color: #8E44AD;
        }

        #contacts-module .contact-row:nth-child(4n + 3) .contact-avatar {
            background: #FCE8E6;
            color: #D93025;
        }

        #contacts-module .contact-row:nth-child(4n + 4) .contact-avatar {
            background: #E6F4EA;
            color: #188038;
        }

        #contacts-module .contact-details {
            min-width: 0;
            flex: 1;
        }

        #contacts-module .contact-name {
            display: block;
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #contacts-module .contact-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }

        #contacts-module .contact-actions {
            display: flex;
            flex: 0 0 auto;
            align-items: center;
            gap: 7px;
        }

        #contacts-module .contact-action {
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            border: 1px solid var(--outline-soft);
            border-radius: 50%;
            background: #fff;
            color: var(--primary);
            text-decoration: none;
            transition: background-color .15s ease, transform .15s ease;
        }

        #contacts-module .contact-action:hover {
            transform: translateY(-1px);
            background: var(--primary-soft);
        }

        #contacts-module .contact-action.whatsapp {
            border-color: #CDE8D3;
            color: #188038;
        }

        #contacts-module .contact-action.whatsapp:hover { background: #E8F5E9; }

        #contacts-module .contacts-state {
            padding: 32px 16px;
            color: var(--muted);
            text-align: center;
            font-size: 13px;
        }

        #contacts-module .contacts-state.error {
            color: var(--danger);
        }

        @media (max-width: 520px) {
            #contacts-module h1 { font-size: 22px; }
            #contacts-module .contact-row { gap: 10px; padding: 11px 12px; }
            #contacts-module .contact-avatar { width: 42px; height: 42px; flex-basis: 42px; }
            #contacts-module .contact-action { width: 38px; height: 38px; }
        }
    </style>

    <header class="contacts-heading">
        <div class="contacts-title">
            <span class="material-symbols-rounded contacts-title-icon" aria-hidden="true">contacts</span>
            <div>
                <h1>Contacts</h1>
                <p class="contacts-subtitle">Find and contact patients, staff, and therapists.</p>
            </div>
        </div>
    </header>

    <div class="contacts-tabs" role="tablist" aria-label="Contact categories">
        <button class="contacts-tab active" id="contacts-tab-patients" type="button" role="tab" aria-selected="true" aria-controls="contacts-list" data-contact-type="patients">
            <span class="material-symbols-rounded" aria-hidden="true">groups</span>Patients
        </button>
        <button class="contacts-tab" id="contacts-tab-staff" type="button" role="tab" aria-selected="false" aria-controls="contacts-list" tabindex="-1" data-contact-type="staff">
            <span class="material-symbols-rounded" aria-hidden="true">badge</span>Staff
        </button>
        <button class="contacts-tab" id="contacts-tab-therapists" type="button" role="tab" aria-selected="false" aria-controls="contacts-list" tabindex="-1" data-contact-type="therapists">
            <span class="material-symbols-rounded" aria-hidden="true">medical_services</span>Therapists
        </button>
    </div>

    <label class="contacts-search">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input id="contacts-search-input" type="text" placeholder="Search name, mobile, or patient ID..." autocomplete="off">
    </label>
    <p class="contacts-count" id="contacts-count">Loading contacts...</p>
    <div class="contacts-list" id="contacts-list" aria-live="polite">
        <div class="contacts-state">Loading patient contacts...</div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import {
            collection,
            doc,
            getDoc,
            getDocs,
            query,
            where
        } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';

        const contactsList = document.getElementById('contacts-list');
        const searchInput = document.getElementById('contacts-search-input');
        const countElement = document.getElementById('contacts-count');
        const tabs = Array.from(document.querySelectorAll('.contacts-tab'));
        const contactTypes = {
            patients: { collection: 'patients', label: 'patient', idField: 'patientId' },
            staff: { collection: 'staff', label: 'staff', idField: 'empId' },
            therapists: { collection: 'therapists', label: 'therapist', idField: 'therapistId' }
        };
        const contactsByType = { patients: null, staff: null, therapists: null };
        const loadingTypes = new Set();
        let activeType = 'patients';
        let currentAuthUser = null;
        let currentUserProfile = null;

        function showState(message, isError = false) {
            contactsList.replaceChildren();
            const state = document.createElement('div');
            state.className = `contacts-state${isError ? ' error' : ''}`;
            state.textContent = message;
            contactsList.appendChild(state);
            countElement.textContent = isError ? 'Unable to load contacts' : '0 contacts';
        }

        function getInitials(name) {
            return name.trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase() || '?';
        }

        function normalizePhone(value) {
            let digits = String(value || '').replace(/\D/g, '');
            if (digits.startsWith('00')) digits = digits.slice(2);
            if (digits.length === 11 && digits.startsWith('0')) digits = digits.slice(1);
            if (digits.length === 10) digits = `91${digits}`;
            return digits;
        }

        function appendContact(contact) {
            const row = document.createElement('article');
            row.className = 'contact-row';

            const avatar = document.createElement('span');
            avatar.className = 'contact-avatar';
            avatar.setAttribute('aria-hidden', 'true');
            avatar.textContent = getInitials(contact.name);

            const details = document.createElement('div');
            details.className = 'contact-details';
            const name = document.createElement('span');
            name.className = 'contact-name';
            name.textContent = contact.name;
            const meta = document.createElement('div');
            meta.className = 'contact-meta';
            const mobile = document.createElement('span');
            mobile.textContent = contact.mobile || 'No phone number';
            meta.appendChild(mobile);
            [contact.recordId, contact.detail, contact.branch].filter(Boolean).forEach(value => {
                const item = document.createElement('span');
                item.textContent = value;
                meta.appendChild(item);
            });
            details.append(name, meta);
            row.append(avatar, details);

            const actions = document.createElement('div');
            actions.className = 'contact-actions';
            if (contact.phoneDigits) {
                const call = document.createElement('a');
                call.className = 'contact-action';
                call.href = `tel:+${contact.phoneDigits}`;
                call.setAttribute('aria-label', `Call ${contact.name}`);
                call.title = 'Call';
                call.innerHTML = '<span class="material-symbols-rounded" aria-hidden="true">call</span>';
                actions.appendChild(call);

                const whatsapp = document.createElement('a');
                whatsapp.className = 'contact-action whatsapp';
                whatsapp.href = `https://wa.me/${contact.phoneDigits}`;
                whatsapp.target = '_blank';
                whatsapp.rel = 'noopener noreferrer';
                whatsapp.setAttribute('aria-label', `WhatsApp ${contact.name}`);
                whatsapp.title = 'WhatsApp';
                whatsapp.innerHTML = '<span class="material-symbols-rounded" aria-hidden="true">chat</span>';
                actions.appendChild(whatsapp);
            }
            row.appendChild(actions);
            contactsList.appendChild(row);
        }

        function renderContacts() {
            const search = searchInput.value.trim().toLocaleLowerCase();
            const contacts = contactsByType[activeType] || [];
            const filtered = contacts.filter(contact =>
                `${contact.name} ${contact.mobile} ${contact.recordId} ${contact.detail} ${contact.branch}`.toLocaleLowerCase().includes(search)
            );
            countElement.textContent = `${filtered.length} ${filtered.length === 1 ? 'contact' : 'contacts'}`;
            contactsList.replaceChildren();
            if (!filtered.length) {
                const state = document.createElement('div');
                state.className = 'contacts-state';
                state.textContent = contacts.length
                    ? 'No contacts match your search.'
                    : `No ${contactTypes[activeType].label} contacts found.`;
                contactsList.appendChild(state);
                return;
            }
            filtered.forEach(appendContact);
        }

        function setActiveType(type) {
            if (!contactTypes[type]) return;
            activeType = type;
            tabs.forEach(tab => {
                const selected = tab.dataset.contactType === type;
                tab.classList.toggle('active', selected);
                tab.setAttribute('aria-selected', String(selected));
                tab.tabIndex = selected ? 0 : -1;
            });
            searchInput.value = '';
            const label = contactTypes[type].label;
            searchInput.placeholder = `Search ${label} name, mobile, ID, or branch...`;
            if (contactsByType[type]) renderContacts();
            else loadContacts(currentAuthUser, type);
        }

        async function loadContacts(user, type) {
            if (!user || !contactTypes[type] || contactsByType[type] || loadingTypes.has(type)) return;
            loadingTypes.add(type);
            const label = contactTypes[type].label;
            if (type === activeType) {
                contactsList.replaceChildren();
                const state = document.createElement('div');
                state.className = 'contacts-state';
                state.textContent = `Loading ${label} contacts...`;
                contactsList.appendChild(state);
                countElement.textContent = 'Loading contacts...';
            }

            try {
                if (!currentUserProfile) {
                    const email = String(user.email || '').toLowerCase();
                    if (!email) throw new Error('Signed-in account has no email address.');
                    const userSnapshot = await getDoc(doc(db, 'users', email));
                    if (!userSnapshot.exists()) throw new Error('User profile was not found.');
                    currentUserProfile = userSnapshot.data();
                }
                const typeConfig = contactTypes[type];
                let contactQuery;
                if (currentUserProfile && currentUserProfile.role !== 'admin') {
                    contactQuery = query(
                        collection(db, typeConfig.collection),
                        where('branch', '==', currentUserProfile.branch)
                    );
                } else {
                    contactQuery = collection(db, typeConfig.collection);
                }
                const snapshot = await getDocs(contactQuery);
                contactsByType[type] = snapshot.docs.map(contactDoc => {
                    const data = contactDoc.data();
                    const mobile = String(data.mobile || data.contact || '').trim();
                    return {
                        name: String(data.name || 'Unnamed contact').trim(),
                        mobile,
                        recordId: String(data[typeConfig.idField] || '').trim(),
                        detail: String(data.role || data.specialisation || '').trim(),
                        branch: String(data.branch || '').trim(),
                        phoneDigits: normalizePhone(mobile)
                    };
                }).sort((a, b) => a.name.localeCompare(b.name));
                if (type === activeType) renderContacts();
            } catch (error) {
                console.error(`Unable to load ${label} contacts:`, error);
                if (type === activeType) showState(`Could not load ${label} contacts: ${error.message}`, true);
            } finally {
                loadingTypes.delete(type);
            }
        }

        searchInput.addEventListener('input', renderContacts);
        tabs.forEach((tab, index) => {
            tab.addEventListener('click', () => setActiveType(tab.dataset.contactType));
            tab.addEventListener('keydown', event => {
                if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const nextTab = tabs[(index + offset + tabs.length) % tabs.length];
                nextTab.focus();
                setActiveType(nextTab.dataset.contactType);
            });
        });
        onAuthStateChanged(auth, user => {
            if (!user) {
                currentAuthUser = null;
                currentUserProfile = null;
                Object.keys(contactsByType).forEach(type => { contactsByType[type] = null; });
                showState('Sign in to view patient contacts.', true);
                return;
            }
            if (currentAuthUser?.uid !== user.uid) {
                currentAuthUser = user;
                currentUserProfile = null;
                Object.keys(contactsByType).forEach(type => { contactsByType[type] = null; });
            }
            loadContacts(user, activeType);
        });
    </script>
</div>
</body>
</html>
