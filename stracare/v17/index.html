<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>COREBIQ BUSINESS FLOW APP | Clinic Management Dashboard</title>
<meta name="application-name" content="COREBIQ BUSINESS FLOW APP">
<meta name="theme-color" content="#0B1F4B">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/app-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
<link rel="stylesheet" href="css/index.css">
</head>

<body>
<iframe id="startup-splash" src="components/splash-screen.html" title="Loading COREBIQ BUSINESS FLOW APP"></iframe>
<div id="app-container">

    <div id="sidebar-container"></div>
    <div id="mobile-nav-backdrop" onclick="window.toggleMobileNavigationMenu(false)" aria-hidden="true"></div>

    <div class="main-wrapper">
        <div id="header-container"></div>

        <main id="main-content">

            <div id="view-dashboard" class="view-section"></div>

            <!-- Dynamically loaded application modules -->
            <div id="view-patients" class="view-section"></div>
            <div id="view-corebiq-ai" class="view-section"></div>
            <div id="view-contacts" class="view-section"></div>
            <div id="view-appointments" class="view-section"></div>
            <div id="view-public-booking" class="view-section">
                <iframe
                    src="modules/crm/public-booking/public-booking.html"
                    title="Public appointment booking page"
                    style="display:block;width:100%;height:calc(100vh - 112px);min-height:640px;border:0;border-radius:16px;background:#f7f7fb"
                ></iframe>
            </div>
            <div id="view-email" class="view-section">
                <section class="email-module-container" aria-label="Email">
                    <div class="email-module-toolbar">
                        <div>
                            <h1>Email</h1>
                            <p>If Gmail does not load here, open it in a new tab.</p>
                        </div>
                        <a href="https://mail.google.com/" target="_blank" rel="noopener noreferrer">
                            <span class="material-symbols-rounded" aria-hidden="true">open_in_new</span>
                            Open Gmail
                        </a>
                    </div>
                    <iframe
                        src="https://mail.google.com/"
                        title="Gmail"
                        referrerpolicy="strict-origin-when-cross-origin"
                    ></iframe>
                </section>
            </div>
            <div id="view-my-tasks" class="view-section"></div>
            <div id="view-invoice" class="view-section">
                <iframe
                    id="invoice-frame"
                    src="modules/templates/template-invoice/template-invoice.html"
                    title="Appointment invoice template"
                    onload="this.dataset.ready='true';window.dispatchInvoicePayload?.()"
                ></iframe>
            </div>
            <div id="view-transaction" class="view-section"></div>
            <div id="view-cash-ledger" class="view-section"></div>
            <div id="view-bank-ledger" class="view-section"></div>
            <div id="view-ledgers" class="view-section"></div>
            <div id="view-branches" class="view-section"></div>
            <div id="view-therapist" class="view-section"></div>
            <div id="view-calender" class="view-section"></div>
            <div id="view-staff" class="view-section"></div>
            <div id="view-attendance" class="view-section"></div>
            <div id="view-users" class="view-section"></div>
            <div id="view-clinic-details" class="view-section"></div>
            <div id="view-company" class="view-section"></div>
            <div id="view-letterhead" class="view-section"></div>
            <div id="view-bank-card" class="view-section"></div>
            <div id="view-report" class="view-section"></div>
            <div id="view-seal" class="view-section"></div>
            <div id="view-qr" class="view-section"></div>
            <div id="view-updates" class="view-section"></div>
            <div id="view-licenceinfo" class="view-section"></div>
            <div id="view-aboutapp" class="view-section"></div>
            <div id="view-privacy" class="view-section"></div>
            <div id="view-backup" class="view-section"></div>
            <div id="view-calc" class="view-section"></div>

        </main>

        <div id="bottomnav-container"></div>
    </div>

    <!-- Calculator popup -->
    <div id="calc-popup-container">
        <div id="calc-popup-header">
            <span style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px">
                <span class="material-symbols-rounded" style="font-size:20px;color:var(--primary)">calculate</span>
                Calculator
            </span>
            <span class="material-symbols-rounded"
                  style="cursor:pointer;font-size:20px"
                  onclick="window.toggleCalculator()">close</span>
        </div>

        <div id="calc-popup-content"
             style="flex:1;padding:0;overflow-y:auto;overflow-x:hidden;height:100%">
        </div>
    </div>

</div>

<script type="module" src="js/index.js"></script>

</body>
</html>
