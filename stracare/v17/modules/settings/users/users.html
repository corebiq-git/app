<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>COREBIQ BUSINESS FLOW APP | User Access Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../css/corebiq.css">
</head>
<body>
<div class="module-container">
    <div style="padding: 24px;">
        <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 24px;">User Access Management</h2>
        
        <div style="background: var(--surface); padding: 24px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 24px;">
            <h3 id="userFormTitle" style="font-size: 16px; margin-bottom: 8px;">Add User</h3>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;">
                Create accounts or update a user's email, password, role, and branch assignment.
            </p>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 16px;">
                <div>
                    <label style="font-size: 12px; color: var(--text-muted); font-weight: bold;">Email</label>
                    <input type="email" id="editUserEmail" placeholder="user@example.com" autocomplete="off" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;">
                </div>
                <div>
                    <label style="font-size: 12px; color: var(--text-muted); font-weight: bold;">Password</label>
                    <input type="password" id="editUserPassword" placeholder="Required for new users" autocomplete="new-password" minlength="6" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;">
                </div>
                <div>
                    <label style="font-size: 12px; color: var(--text-muted); font-weight: bold;">Role</label>
                    <select id="editUserRole" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;" onchange="window.toggleBranchInput()">
                        <option value="user">Standard User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 12px; color: var(--text-muted); font-weight: bold;">Branch Assignment</label>
                    <input type="text" id="editUserBranch" placeholder="e.g. Mahe" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;">
                </div>
            </div>

            <button id="saveUserBtn" type="button" style="background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold;">Create User</button>
            <button id="clearUserBtn" type="button" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-left: 8px;">Clear Form</button>
            <div id="userMsg" role="status" aria-live="polite" style="margin-top: 12px; font-size: 13px; font-weight: bold;"></div>
        </div>

        <div class="dash-table-wrapper">
            <table class="saas-table" style="width: 100%; text-align: left; border-collapse: collapse;">
                <thead>
                    <tr style="background: #FAFAFA; border-bottom: 1px solid var(--border);">
                        <th style="padding: 12px;">Email</th>
                        <th style="padding: 12px;">Role</th>
                        <th style="padding: 12px;">Branch</th>
                        <th style="padding: 12px; text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr><td colspan="4" style="text-align: center; padding: 20px;">Loading users...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./users.js"></script>
</div>
</body>
</html>
