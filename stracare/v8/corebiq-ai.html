<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COREBIQ AI | Patient Assistant</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">
<link rel="stylesheet" href="css/corebiq.css">
</head>
<body>
<main class="module-container" id="corebiq-ai">
  <style>
    #corebiq-ai{--ai-ink:#17213c;--ai-muted:#69738a;--ai-border:#e6e9f2;--ai-surface:#fff;position:relative;isolation:isolate;max-width:1120px;margin:0 auto;color:var(--ai-ink);font-family:Inter,sans-serif}
    #corebiq-ai *{box-sizing:border-box}
    #corebiq-ai .ai-shell{position:relative;overflow:hidden;min-height:650px;padding:clamp(20px,4vw,44px);border:1px solid #e8eaf2;border-radius:26px;background:linear-gradient(145deg,#fbfaff 0%,#f5f8ff 48%,#fff9fc 100%);box-shadow:0 16px 55px rgba(38,46,82,.08)}
    #corebiq-ai .ai-orb{position:absolute;z-index:-1;width:320px;height:320px;border-radius:50%;filter:blur(65px);opacity:.25;pointer-events:none;animation:corebiqAiDrift 12s ease-in-out infinite alternate}
    #corebiq-ai .ai-orb.one{top:-175px;left:-75px;background:#8b72ff}
    #corebiq-ai .ai-orb.two{top:150px;right:-205px;background:#ff7797;animation-delay:-4s}
    #corebiq-ai .ai-orb.three{bottom:-250px;left:30%;background:#56c8ff;animation-delay:-7s}
    #corebiq-ai .ai-head{position:relative;display:flex;align-items:center;gap:15px;margin-bottom:30px}
    #corebiq-ai .ai-mark{position:relative;display:grid;place-items:center;width:54px;height:54px;flex:0 0 54px;border-radius:19px;color:#fff;background:conic-gradient(from 15deg,#7187ff,#ad70ff,#ff7ea7,#50c9e9,#7187ff);box-shadow:0 8px 24px rgba(127,103,255,.25)}
    #corebiq-ai .ai-mark:before{position:absolute;inset:2px;border:1px solid rgba(255,255,255,.55);border-radius:17px;content:""}
    #corebiq-ai .ai-mark .material-symbols-rounded{font-size:29px}
    #corebiq-ai .ai-title{margin:0;font-size:clamp(21px,3vw,29px);font-weight:750;letter-spacing:-.8px}
    #corebiq-ai .ai-title .gradient-text{color:#725fe5;background:linear-gradient(100deg,#5e73ea,#9a62db 54%,#e16d9c);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    #corebiq-ai .ai-subtitle{margin:5px 0 0;color:var(--ai-muted);font-size:13px}
    #corebiq-ai .ai-kicker{display:inline-flex;align-items:center;gap:6px;margin-left:auto;padding:7px 10px;border:1px solid rgba(125,111,219,.18);border-radius:999px;background:rgba(255,255,255,.7);color:#655bb0;font-size:11px;font-weight:650}
    #corebiq-ai .ai-kicker .material-symbols-rounded{font-size:15px}
    #corebiq-ai .ai-intro{max-width:720px;margin:0 auto 25px;text-align:center}
    #corebiq-ai .ai-intro h1{margin:0;color:#18213a;font-size:clamp(25px,5vw,40px);font-weight:650;letter-spacing:-1.5px;line-height:1.15}
    #corebiq-ai .ai-intro p{margin:10px 0 0;color:var(--ai-muted);font-size:14px;line-height:1.6}
    #corebiq-ai .ai-search-wrap{position:relative;max-width:760px;margin:0 auto}
    #corebiq-ai .ai-search-card{position:relative;padding:2px;border-radius:20px;background:linear-gradient(105deg,#7588ff,#bd71e9 48%,#ff87a7,#62c7ed);background-size:220% 220%;animation:corebiqAiGradient 8s ease infinite;box-shadow:0 9px 30px rgba(113,105,223,.15)}
    #corebiq-ai .ai-search-inner{display:flex;align-items:center;gap:10px;min-height:66px;padding:9px 10px 9px 18px;border-radius:18px;background:#fff}
    #corebiq-ai .ai-search-icon{flex:0 0 auto;color:#8584a1}
    #corebiq-ai .ai-search-inner input{width:100%;min-width:0;height:44px;border:0;outline:0;background:transparent;color:#202943;font:500 15px Inter,sans-serif}
    #corebiq-ai .ai-search-inner input::placeholder{color:#9aa1b3}
    #corebiq-ai .ai-search-button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 17px;border:0;border-radius:13px;background:linear-gradient(110deg,#6679e8,#936be3 58%,#d570a5);color:#fff;font:650 13px Inter,sans-serif;white-space:nowrap;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
    #corebiq-ai .ai-search-button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(119,103,220,.28)}
    #corebiq-ai .ai-search-button:disabled{opacity:.65;cursor:wait;transform:none}
    #corebiq-ai .ai-suggestions{position:absolute;z-index:5;top:calc(100% + 8px);left:0;right:0;display:none;overflow:hidden;border:1px solid var(--ai-border);border-radius:16px;background:#fff;box-shadow:0 14px 34px rgba(30,39,72,.14)}
    #corebiq-ai .ai-suggestions.show{display:block}
    #corebiq-ai .ai-suggestion{display:flex;width:100%;align-items:center;gap:11px;padding:12px 15px;border:0;border-bottom:1px solid #f0f1f6;background:#fff;text-align:left;cursor:pointer}
    #corebiq-ai .ai-suggestion:last-child{border-bottom:0}
    #corebiq-ai .ai-suggestion:hover,#corebiq-ai .ai-suggestion:focus{background:#f7f7ff;outline:0}
    #corebiq-ai .ai-avatar{display:grid;place-items:center;width:37px;height:37px;flex:0 0 37px;border-radius:50%;background:linear-gradient(140deg,#e5e9ff,#f8e3f0);color:#625dc4;font-weight:750}
    #corebiq-ai .ai-suggestion-name{display:block;color:#202943;font-size:13px;font-weight:700}
    #corebiq-ai .ai-suggestion-meta{display:block;margin-top:3px;color:var(--ai-muted);font-size:11px}
    #corebiq-ai .ai-loading,#corebiq-ai .ai-error,#corebiq-ai .ai-empty{max-width:760px;margin:14px auto 0;padding:12px 15px;border:1px solid var(--ai-border);border-radius:14px;background:rgba(255,255,255,.86);color:var(--ai-muted);font-size:13px}
    #corebiq-ai .ai-error{border-color:#fecaca;background:#fff7f7;color:#b42318}
    #corebiq-ai .ai-results{max-width:920px;margin:34px auto 0;animation:corebiqAiRise .45s ease both}
    #corebiq-ai .ai-answer{display:flex;align-items:flex-start;gap:12px;margin-bottom:15px}
    #corebiq-ai .ai-answer-mark{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;border-radius:12px;background:linear-gradient(135deg,#7785f0,#bf71dc,#ed78a2);color:#fff}
    #corebiq-ai .ai-answer-mark .material-symbols-rounded{font-size:19px}
    #corebiq-ai .ai-answer-copy{padding:11px 15px;border:1px solid rgba(126,112,222,.13);border-radius:4px 16px 16px 16px;background:rgba(255,255,255,.76);color:#535d74;font-size:13px;line-height:1.55}
    #corebiq-ai .ai-answer-copy strong{color:#25304c}
    #corebiq-ai .ai-patient-card{overflow:hidden;border:1px solid rgba(124,119,207,.19);border-radius:20px;background:rgba(255,255,255,.91);box-shadow:0 10px 32px rgba(47,55,93,.07)}
    #corebiq-ai .ai-patient-head{display:flex;align-items:center;gap:14px;padding:19px 21px;border-bottom:1px solid #edf0f5;background:linear-gradient(100deg,rgba(238,239,255,.75),rgba(255,240,247,.65),rgba(236,249,255,.7))}
    #corebiq-ai .ai-patient-avatar{display:grid;place-items:center;width:48px;height:48px;flex:0 0 48px;border:2px solid #fff;border-radius:16px;background:linear-gradient(145deg,#7187ee,#ad70d6 60%,#ee84a7);box-shadow:0 4px 12px rgba(113,105,223,.2);color:#fff;font-size:19px;font-weight:750}
    #corebiq-ai .ai-patient-name{margin:0;color:#202943;font-size:18px;font-weight:750}
    #corebiq-ai .ai-patient-meta{margin:5px 0 0;color:var(--ai-muted);font-size:12px}
    #corebiq-ai .ai-patient-id{margin-left:auto;color:#6d7191;font-size:11px;text-align:right}
    #corebiq-ai .ai-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;padding:16px 18px}
    #corebiq-ai .ai-metric{min-height:108px;padding:14px;border:1px solid #eceef5;border-radius:15px;background:linear-gradient(150deg,#fff,#fbfbff)}
    #corebiq-ai .ai-metric-label{display:flex;align-items:center;gap:6px;color:#7a8296;font-size:11px;font-weight:650}
    #corebiq-ai .ai-metric-label .material-symbols-rounded{font-size:16px;color:#8a7ee1}
    #corebiq-ai .ai-metric-value{display:block;margin-top:12px;color:#26314d;font-size:clamp(16px,2vw,21px);font-weight:750;line-height:1.25;overflow-wrap:anywhere}
    #corebiq-ai .ai-metric-value.due{color:#d44851}
    #corebiq-ai .ai-metric-value.credit{color:#13845d}
    #corebiq-ai .ai-metric-note{display:block;margin-top:5px;color:#9097a8;font-size:10px}
    #corebiq-ai .ai-detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:15px;padding:0 18px 18px}
    #corebiq-ai .ai-detail-card{padding:15px;border:1px solid #eceef5;border-radius:15px;background:#fff}
    #corebiq-ai .ai-section-title{display:flex;align-items:center;gap:7px;margin:0 0 12px;color:#35405c;font-size:13px;font-weight:750}
    #corebiq-ai .ai-section-title .material-symbols-rounded{font-size:18px;color:#8a7ee1}
    #corebiq-ai .ai-detail-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f0f1f5;color:#737c90;font-size:12px}
    #corebiq-ai .ai-detail-line:last-child{border-bottom:0}
    #corebiq-ai .ai-detail-line strong{color:#303b56;text-align:right;font-weight:650}
    #corebiq-ai .ai-history-wrap{overflow-x:auto}
    #corebiq-ai .ai-history{width:100%;border-collapse:collapse}
    #corebiq-ai .ai-history th,#corebiq-ai .ai-history td{padding:9px 8px;border-bottom:1px solid #eff0f5;text-align:left;font-size:11px;white-space:nowrap}
    #corebiq-ai .ai-history th{color:#81899b;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
    #corebiq-ai .ai-history td{color:#46516a}
    #corebiq-ai .ai-history tr:last-child td{border-bottom:0}
    #corebiq-ai .ai-status{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f0efff;color:#655dc1;font-size:10px;font-weight:700}
    #corebiq-ai .ai-status.completed{background:#eaf8f1;color:#16835b}
    #corebiq-ai .ai-status.cancelled{background:#fff0f0;color:#c44646}
    #corebiq-ai .ai-footnote{margin:14px 4px 0;color:#8b92a2;font-size:10px;line-height:1.5}
    @keyframes corebiqAiGradient{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
    @keyframes corebiqAiDrift{from{transform:translate3d(-10px,0,0) scale(.95)}to{transform:translate3d(24px,22px,0) scale(1.08)}}
    @keyframes corebiqAiRise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:700px){#corebiq-ai .ai-shell{min-height:0;padding:20px 14px;border-radius:20px}#corebiq-ai .ai-head{gap:10px;margin-bottom:26px}#corebiq-ai .ai-kicker{padding:6px 8px;font-size:10px}#corebiq-ai .ai-kicker .kicker-label{display:none}#corebiq-ai .ai-intro p{font-size:13px}#corebiq-ai .ai-search-inner{gap:7px;padding-left:12px}#corebiq-ai .ai-search-button{padding:0 12px;font-size:12px}#corebiq-ai .ai-metrics{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px;gap:8px}#corebiq-ai .ai-metric{min-height:98px;padding:11px}#corebiq-ai .ai-detail-grid{grid-template-columns:1fr;padding:0 12px 12px;gap:9px}#corebiq-ai .ai-patient-head{padding:15px 13px}#corebiq-ai .ai-patient-id{font-size:10px}#corebiq-ai .ai-patient-name{font-size:16px}}
    @media(max-width:400px){#corebiq-ai .ai-search-inner{flex-wrap:wrap;padding:10px 11px}#corebiq-ai .ai-search-icon{display:none}#corebiq-ai .ai-search-inner input{height:40px;flex:1 1 100%}#corebiq-ai .ai-search-button{width:100%}#corebiq-ai .ai-patient-id{display:none}}
    @media(prefers-reduced-motion:reduce){#corebiq-ai *,#corebiq-ai *:before,#corebiq-ai *:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>

  <section class="ai-shell" aria-labelledby="corebiqAiTitle">
    <div class="ai-orb one"></div><div class="ai-orb two"></div><div class="ai-orb three"></div>
    <header class="ai-head">
      <div class="ai-mark" aria-hidden="true"><span class="material-symbols-rounded">auto_awesome</span></div>
      <div><h2 class="ai-title"><span class="gradient-text">COREBIQ AI</span></h2><p class="ai-subtitle">Patient insight assistant</p></div>
      <div class="ai-kicker"><span class="material-symbols-rounded">verified_user</span><span class="kicker-label">Private clinic records</span></div>
    </header>

    <div class="ai-intro">
      <h1 id="corebiqAiTitle">How can I help with a patient?</h1>
      <p>Search by patient name or mobile number to see their outstanding balance, last completed service, and appointment history.</p>
    </div>

    <div class="ai-search-wrap">
      <form class="ai-search-card" id="aiSearchForm" autocomplete="off">
        <div class="ai-search-inner">
          <span class="material-symbols-rounded ai-search-icon" aria-hidden="true">search</span>
          <input id="aiPatientSearch" type="search" placeholder="Ask about a patient by name or mobile..." aria-label="Search patient by name or mobile" aria-autocomplete="list" aria-controls="aiSuggestions">
          <button class="ai-search-button" id="aiSearchButton" type="submit"><span class="material-symbols-rounded" aria-hidden="true">auto_awesome</span>Find patient</button>
        </div>
      </form>
      <div class="ai-suggestions" id="aiSuggestions" role="listbox" aria-label="Matching patients"></div>
    </div>

    <div class="ai-loading" id="aiLoading" role="status">Loading patients available to your account…</div>
    <div class="ai-error" id="aiError" role="alert" hidden></div>
    <div class="ai-results" id="aiResults" hidden aria-live="polite"></div>
  </section>
</main>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js';
import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';

const root=document.getElementById('corebiq-ai');
const searchInput=document.getElementById('aiPatientSearch');
const suggestions=document.getElementById('aiSuggestions');
const loading=document.getElementById('aiLoading');
const errorBox=document.getElementById('aiError');
const results=document.getElementById('aiResults');
const searchButton=document.getElementById('aiSearchButton');
let patients=[];
let visiblePatients=[];
let activeUser=null;

const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const money=value=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(value)||0);
const dateValue=value=>{
  const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match)return null;
  const date=new Date(Number(match[1]),Number(match[2])-1,Number(match[3]));
  return date.getFullYear()===Number(match[1])&&date.getMonth()===Number(match[2])-1&&date.getDate()===Number(match[3])?date:null;
};
const formatDate=value=>{
  const date=dateValue(value);
  return date?new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'short',year:'numeric'}).format(date):'Not recorded';
};
const formatTime=value=>{
  const match=String(value||'').trim().match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?$/i);
  if(!match)return String(value||'');
  let hour=Number(match[1]);
  if(match[3])return hour>=1&&hour<=12?`${String(hour).padStart(2,'0')}:${match[2]} ${match[3].toUpperCase()}`:String(value);
  if(hour>23)return String(value);
  const period=hour>=12?'PM':'AM';
  hour=hour%12||12;
  return `${String(hour).padStart(2,'0')}:${match[2]} ${period}`;
};
const dayOrder=(a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.time||'').localeCompare(String(a.time||''));
const setError=message=>{
  errorBox.textContent=message;
  errorBox.hidden=!message;
};

function renderSuggestions(value){
  const term=value.trim().toLocaleLowerCase();
  if(!term){suggestions.classList.remove('show');suggestions.innerHTML='';visiblePatients=[];return}
  const digits=term.replace(/\D/g,'');
  const matches=patients.filter(({data})=>{
    const name=String(data.name||'').toLocaleLowerCase();
    const mobile=String(data.mobile||'').replace(/\D/g,'');
    return name.includes(term)||(digits.length>0&&mobile.includes(digits));
  }).sort((a,b)=>{
    const aName=String(a.data.name||'').toLocaleLowerCase(),bName=String(b.data.name||'').toLocaleLowerCase();
    const aExact=String(a.data.mobile||'').replace(/\D/g,'')===digits||aName===term;
    const bExact=String(b.data.mobile||'').replace(/\D/g,'')===digits||bName===term;
    return Number(bExact)-Number(aExact)||aName.localeCompare(bName);
  }).slice(0,8);
  visiblePatients=matches;
  if(!matches.length){
    suggestions.innerHTML='<div class="ai-empty">No matching patients found in your permitted records.</div>';
    suggestions.classList.add('show');
    return;
  }
  suggestions.innerHTML=matches.map((item,index)=>{
    const patient=item.data;
    const name=patient.name||'Unnamed patient';
    const meta=[patient.mobile,patient.branch].filter(Boolean).join(' · ');
    return `<button type="button" class="ai-suggestion" role="option" aria-selected="false" data-patient-index="${index}"><span class="ai-avatar">${escapeHtml(name.trim().charAt(0).toUpperCase()||'?')}</span><span><span class="ai-suggestion-name">${escapeHtml(name)}</span><span class="ai-suggestion-meta">${escapeHtml(meta||'Patient details')}</span></span></button>`;
  }).join('');
  suggestions.classList.add('show');
}

async function loadPatientAppointments(patient){
  let appointmentQuery=query(collection(db,'appointments'),where('mobile','==',String(patient.mobile||'')));
  if(activeUser.role!=='admin'){
    appointmentQuery=query(collection(db,'appointments'),where('mobile','==',String(patient.mobile||'')),where('branch','==',activeUser.branch));
  }
  const snapshot=await getDocs(appointmentQuery);
  return snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
}

function renderPatient(patient,appointments){
  const patientName=patient.name||'Unnamed patient';
  const due=appointments.reduce((total,appointment)=>total+(Number(appointment.balance)||0),0);
  const completed=appointments.filter(appointment=>String(appointment.status||'').toLowerCase()==='completed');
  const lastService=[...completed].sort(dayOrder)[0]||null;
  const today=new Date();
  today.setHours(0,0,0,0);
  const upcoming=appointments.filter(appointment=>{
    const date=dateValue(appointment.date);
    return date&&date>=today&&String(appointment.status||'').toLowerCase()==='pending';
  }).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.time||'').localeCompare(String(b.time||'')))[0]||null;
  const recent=[...appointments].sort(dayOrder).slice(0,6);
  const dueClass=due>0.005?'due':due<-.005?'credit':'';
  const dueLabel=due>0.005?'Outstanding due':due<-.005?'Credit / excess':'Outstanding due';
  const dueText=due>0.005?money(due):due<-.005?money(Math.abs(due)):'No due';
  const ageGender=[patient.age?`${escapeHtml(patient.age)} yrs`:null,patient.gender?escapeHtml(patient.gender):null].filter(Boolean).join(' · ');
  const lastServiceText=lastService?formatDate(lastService.date):'No completed service';
  const lastServiceNote=lastService?[lastService.time?formatTime(lastService.time):'',lastService.therapist||''].filter(Boolean).map(escapeHtml).join(' · '):'Completed visits only';
  const nextText=upcoming?formatDate(upcoming.date):'None scheduled';
  const nextNote=upcoming?[upcoming.time?formatTime(upcoming.time):'',upcoming.branch||''].filter(Boolean).map(escapeHtml).join(' · '):'No upcoming pending appointment';
  const recentRows=recent.length?recent.map(appointment=>{
    const balance=Number(appointment.balance)||0;
    const status=String(appointment.status||'Pending');
    const statusClass=status.toLowerCase()==='completed'?'completed':status.toLowerCase()==='cancelled'?'cancelled':'';
    return `<tr><td>${escapeHtml(formatDate(appointment.date))}${appointment.time?` · ${escapeHtml(formatTime(appointment.time))}`:''}</td><td>${escapeHtml(appointment.therapist||'—')}</td><td>${escapeHtml(appointment.branch||'—')}</td><td><span class="ai-status ${statusClass}">${escapeHtml(status)}</span></td><td>${balance>0.005?`<span style="color:#c44646;font-weight:700">${escapeHtml(money(balance))}</span>`:balance<-.005?`<span style="color:#16835b;font-weight:700">${escapeHtml(money(Math.abs(balance)))}</span>`:'—'}</td></tr>`;
  }).join(''):'<tr><td colspan="5">No appointments found for this patient.</td></tr>';

  results.innerHTML=`
    <div class="ai-answer"><div class="ai-answer-mark" aria-hidden="true"><span class="material-symbols-rounded">auto_awesome</span></div><div class="ai-answer-copy"><strong>Here’s the patient summary.</strong> The details below are based on saved clinic records.</div></div>
    <section class="ai-patient-card" aria-label="Patient summary">
      <header class="ai-patient-head">
        <div class="ai-patient-avatar" aria-hidden="true">${escapeHtml(patientName.trim().charAt(0).toUpperCase()||'?')}</div>
        <div><h2 class="ai-patient-name">${escapeHtml(patientName)}</h2><p class="ai-patient-meta">${escapeHtml([patient.mobile,patient.branch].filter(Boolean).join(' · ')||'Patient profile')}</p>${ageGender?`<p class="ai-patient-meta">${ageGender}</p>`:''}</div>
        <div class="ai-patient-id">${patient.patientId?`Patient ID<br><strong>${escapeHtml(patient.patientId)}</strong>`:''}</div>
      </header>
      <div class="ai-metrics">
        <div class="ai-metric"><span class="ai-metric-label"><span class="material-symbols-rounded">account_balance_wallet</span>${dueLabel}</span><strong class="ai-metric-value ${dueClass}">${dueText}</strong><span class="ai-metric-note">${due<-.005?'Available credit':due>0.005?'Across recorded appointments':'All recorded appointments settled'}</span></div>
        <div class="ai-metric"><span class="ai-metric-label"><span class="material-symbols-rounded">event_available</span>Last service</span><strong class="ai-metric-value">${escapeHtml(lastServiceText)}</strong><span class="ai-metric-note">${lastServiceNote||'Completed visits only'}</span></div>
        <div class="ai-metric"><span class="ai-metric-label"><span class="material-symbols-rounded">medical_services</span>Completed sessions</span><strong class="ai-metric-value">${completed.length}</strong><span class="ai-metric-note">Based on completed appointments</span></div>
        <div class="ai-metric"><span class="ai-metric-label"><span class="material-symbols-rounded">upcoming</span>Next appointment</span><strong class="ai-metric-value">${escapeHtml(nextText)}</strong><span class="ai-metric-note">${nextNote||'No upcoming pending appointment'}</span></div>
      </div>
      <div class="ai-detail-grid">
        <section class="ai-detail-card"><h3 class="ai-section-title"><span class="material-symbols-rounded">person</span>Patient details</h3>
          <div class="ai-detail-line"><span>Category</span><strong>${escapeHtml(patient.category||'Not recorded')}</strong></div>
          <div class="ai-detail-line"><span>Branch</span><strong>${escapeHtml(patient.branch||'Not recorded')}</strong></div>
          <div class="ai-detail-line"><span>Last therapist</span><strong>${escapeHtml(lastService?.therapist||'Not recorded')}</strong></div>
          <div class="ai-detail-line"><span>Total appointments</span><strong>${appointments.length}</strong></div>
        </section>
        <section class="ai-detail-card"><h3 class="ai-section-title"><span class="material-symbols-rounded">history</span>Recent appointments</h3>
          <div class="ai-history-wrap"><table class="ai-history"><thead><tr><th>Date</th><th>Therapist</th><th>Branch</th><th>Status</th><th>Balance</th></tr></thead><tbody>${recentRows}</tbody></table></div>
        </section>
      </div>
    </section>
    <p class="ai-footnote">Summary is calculated from appointment records visible to your account. “Last service” uses appointments marked Completed. Please verify balances against the original records before collecting payment.</p>`;
  results.hidden=false;
}

async function selectPatient(patientRecord){
  const patient=patientRecord.data;
  suggestions.classList.remove('show');
  searchInput.value=patient.name||patient.mobile||'';
  setError('');
  results.hidden=true;
  loading.textContent=`Looking up appointments for ${patient.name||'this patient'}…`;
  loading.hidden=false;
  searchButton.disabled=true;
  try{
    const appointments=await loadPatientAppointments(patient);
    renderPatient(patient,appointments);
  }catch(error){
    console.error('COREBIQ AI patient lookup failed:',error);
    setError('Unable to load this patient’s appointment details. Check your account access and try again.');
  }finally{
    loading.hidden=true;
    searchButton.disabled=false;
  }
}

document.getElementById('aiSearchForm').addEventListener('submit',event=>{
  event.preventDefault();
  const term=searchInput.value.trim().toLocaleLowerCase();
  if(!term){setError('Enter a patient name or mobile number to search.');searchInput.focus();return}
  const digits=term.replace(/\D/g,'');
  const exact=patients.find(({data})=>String(data.mobile||'').replace(/\D/g,'')===digits||String(data.name||'').toLocaleLowerCase()===term);
  const match=exact||visiblePatients[0];
  if(!match){renderSuggestions(searchInput.value);setError('No matching patient found. Check the spelling or mobile number.');return}
  setError('');
  selectPatient(match);
});
searchInput.addEventListener('input',()=>{
  setError('');
  renderSuggestions(searchInput.value);
});
suggestions.addEventListener('click',event=>{
  const button=event.target.closest('[data-patient-index]');
  if(!button)return;
  const patient=visiblePatients[Number(button.dataset.patientIndex)];
  if(patient)selectPatient(patient);
});
document.addEventListener('click',event=>{
  if(!root.contains(event.target))suggestions.classList.remove('show');
});

onAuthStateChanged(auth,async user=>{
  if(!user){setError('Access denied. Please sign in to use the patient assistant.');loading.hidden=true;searchButton.disabled=true;return}
  activeUser=window.currentUser;
  if(!activeUser){setError('Your user profile is still loading. Please refresh and try again.');loading.hidden=true;return}
  loading.textContent='Loading patients available to your account…';
  loading.hidden=false;
  try{
    let patientQuery=query(collection(db,'patients'));
    if(activeUser.role!=='admin')patientQuery=query(collection(db,'patients'),where('branch','==',activeUser.branch));
    const snapshot=await getDocs(patientQuery);
    patients=snapshot.docs.map(doc=>({id:doc.id,data:doc.data()})).filter(item=>item.data.name||item.data.mobile);
    loading.textContent=patients.length?`Ready · ${patients.length} patient${patients.length===1?'':'s'} available in your records.`:'No patients were found in your records.';
  }catch(error){
    console.error('COREBIQ AI patient list failed to load:',error);
    loading.hidden=true;
    setError('Unable to load patients. Check your account access and connection, then refresh this page.');
  }
});
</script>
</body>
</html>
