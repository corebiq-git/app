<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ - QR Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
    
    <!-- QRCode.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
</head>
<body>

<div class="module-container" id="qr-module">
    
    <style>
        /* --- Core Theme Variables (Gemini Material 3) --- */
        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --primary-light: #EEF2FF;
            --accent: #6366F1;
            --bg: #F8FAFF;
            --surface: #FFFFFF;
            --text-main: #111827;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 24px rgba(79, 70, 229, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
        }

        #qr-module { 
            font-family: 'Outfit', sans-serif; 
            width: 100%; 
            max-width: 600px; 
            margin: 0 auto; 
            padding-bottom: 40px;
        } 

        /* --- UI Components --- */
        #qr-module .section-title { 
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 20px; 
            color: var(--text-main); 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        
        #qr-module .form-card { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 24px; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border); 
            margin-bottom: 24px; 
        }
        
        #qr-module .form-label { 
            display: block; 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            letter-spacing: 0.5px; 
        }
        
        #qr-module .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 18px; 
            margin-bottom: 18px; 
        }

        #qr-module .form-input, #qr-module .form-select { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border); 
            font-size: 15px; 
            color: var(--text-main); 
            background: #FAFAFA; 
            outline: none; 
            transition: 0.2s ease; 
            font-family: 'Outfit', sans-serif;
        }
        
        #qr-module .form-input:focus, #qr-module .form-select:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* Phone Input Group */
        #qr-module .phone-group {
            display: flex;
            gap: 10px;
        }
        #qr-module .phone-code {
            flex: 0 0 100px;
        }
        #qr-module .phone-number {
            flex: 1;
        }

        /* Checkbox */
        #qr-module .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: -6px;
        }
        #qr-module .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        #qr-module .checkbox-wrapper label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* Buttons */
        #qr-module .btn-primary { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            color: white; 
            border: none; 
            padding: 16px 24px; 
            border-radius: 999px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: 0.2s ease; 
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-md);
        }
        #qr-module .btn-primary:active { transform: translateY(2px); }
        
        #qr-module .btn-secondary {
            background: var(--primary-light);
            color: var(--primary-dark);
            border: none;
            padding: 14px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        #qr-module .btn-secondary:hover {
            background: var(--accent-soft);
            color: var(--primary);
        }

        #qr-module .btn-whatsapp {
            background: #ECFDF5;
            color: #10B981;
        }
        #qr-module .btn-whatsapp:hover {
            background: #D1FAE5;
            color: #059669;
        }

        /* QR Preview */
        #qr-module .preview-card {
            display: none;
            text-align: center;
            animation: fadeIn 0.4s ease forwards;
        }

        #qr-module .preview-card.active {
            display: block;
        }

        #qr-image-container {
            width: 100%;
            max-width: 350px;
            margin: 0 auto 24px auto;
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            background: #fff;
            padding: 24px;
        }

        #qr-image-container img.qr-code-img {
            width: 100%;
            height: auto;
            display: block;
            margin: 20px 0;
        }
        
        .qr-logo-top {
            max-height: 40px;
            margin-bottom: 10px;
        }
        
        .qr-logo-bottom {
            max-height: 30px;
            opacity: 0.6;
            margin-top: 20px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <div class="section-title">
        <span class="material-symbols-rounded" style="color: var(--primary);">qr_code_2</span>
        Payment QR Generator
    </div>

    <!-- INPUT FORM -->
    <div class="form-card" id="qr-form-card">
        <form id="qr-generator-form">
            
            <div class="input-group">
                <div>
                    <label class="form-label">Saved UPI Profiles</label>
                    <select id="savedUpiSelect" class="form-select" onchange="window.handleSavedUpiSelect()">
                        <option value="">-- Custom Entry --</option>
                        <!-- Populated dynamically -->
                    </select>
                </div>

                <div>
                    <label class="form-label">UPI ID</label>
                    <input type="text" id="upiId" class="form-input" placeholder="e.g. name@bank" required>
                </div>
                
                <div>
                    <label class="form-label">Payee Name</label>
                    <input type="text" id="payeeName" class="form-input" placeholder="Enter business or person name" required>
                </div>

                <div class="checkbox-wrapper">
                    <input type="checkbox" id="saveUpiCheck">
                    <label for="saveUpiCheck">Save this UPI ID for future use</label>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;">

            <div class="input-group">
                <div>
                    <label class="form-label">Party Contact Number</label>
                    <div class="phone-group">
                        <select id="countryCode" class="form-select phone-code">
                            <option value="91">🇮🇳 +91</option>
                            <option value="971">🇦🇪 +971</option>
                        </select>
                        <input type="tel" id="contactNo" class="form-input phone-number" placeholder="Contact Number" required>
                    </div>
                </div>

                <div>
                    <label class="form-label">Amount (INR)</label>
                    <input type="number" id="qrAmount" class="form-input" placeholder="0.00" step="0.01">
                </div>

                <div>
                    <label class="form-label">Description / Note (Optional)</label>
                    <input type="text" id="qrNote" class="form-input" placeholder="e.g. Invoice INV-001">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="generateBtn">
                <span class="material-symbols-rounded">magic_button</span>
                Generate QR Code
            </button>
        </form>
    </div>

    <!-- PREVIEW AREA -->
    <div class="form-card preview-card" id="qr-preview-card">
        <div class="form-label" style="margin-bottom: 16px;">Generated QR Code</div>
        
        <div id="qr-image-container">
            <img src="assets/name.png" alt="COREBIQ" class="qr-logo-top" onerror="this.style.display='none'">
            <img id="finalQrImg" src="" alt="Payment QR Code" class="qr-code-img">
            <div id="qr-details" style="text-align: center; color: var(--text-main); font-weight: 600; margin-bottom: 10px;"></div>
            <img src="assets/poweredby.png" alt="Powered by COREBIQ" class="qr-logo-bottom" onerror="this.style.display='none'">
        </div>

        <div class="action-grid">
            <button type="button" class="btn-secondary" onclick="window.downloadQR()">
                <span class="material-symbols-rounded">download</span>
                Download
            </button>
            <button type="button" class="btn-secondary btn-whatsapp" onclick="window.sendWhatsApp()">
                <span class="material-symbols-rounded">send</span>
                Send
            </button>
        </div>
        
        <button type="button" class="btn-secondary" style="margin-top: 12px; background: transparent; border: 1px solid var(--border);" onclick="window.resetForm()">
            <span class="material-symbols-rounded">refresh</span>
            Create Another
        </button>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const savedUpiRef = collection(db, "saved_upis");
        let allSavedUpis = [];
        let generatedQrDataUrl = "";
        let transactionId = "";

        // --- 1. LOAD SAVED UPIs ---
        window.loadSavedUpis = async function() {
            try {
                const snap = await getDocs(savedUpiRef);
                const select = document.getElementById('savedUpiSelect');
                allSavedUpis = [];
                
                // Clear existing options except first
                select.innerHTML = '<option value="">-- Custom Entry --</option>';

                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    allSavedUpis.push({ id: docSnap.id, ...data });
                    
                    const opt = document.createElement('option');
                    opt.value = data.upiId;
                    opt.innerText = `${data.name} (${data.upiId})`;
                    select.appendChild(opt);
                });
            } catch (error) {
                console.error("Error loading UPIs:", error);
            }
        };

        window.handleSavedUpiSelect = function() {
            const val = document.getElementById('savedUpiSelect').value;
            const upiInput = document.getElementById('upiId');
            const nameInput = document.getElementById('payeeName');
            
            if (val) {
                const selected = allSavedUpis.find(u => u.upiId === val);
                if (selected) {
                    upiInput.value = selected.upiId;
                    nameInput.value = selected.name;
                    upiInput.setAttribute('readonly', true);
                    nameInput.setAttribute('readonly', true);
                    document.getElementById('saveUpiCheck').checked = false;
                    document.getElementById('saveUpiCheck').disabled = true;
                }
            } else {
                upiInput.value = '';
                nameInput.value = '';
                upiInput.removeAttribute('readonly');
                nameInput.removeAttribute('readonly');
                document.getElementById('saveUpiCheck').disabled = false;
            }
        };

        // Initialize
        window.loadSavedUpis();

        // --- 2. GENERATE ID ---
        function generateReferenceId() {
            const date = new Date();
            const yy = String(date.getFullYear()).slice(-2);
            const mm = String(date.getMonth() + 1).padStart(2, '0');
            const dd = String(date.getDate()).padStart(2, '0');
            const random = Math.random().toString(36).substring(2, 8).toUpperCase();
            return `QR-BI${yy}${mm}${dd}${random}`;
        }

        // --- 3. GENERATE QR LOGIC ---
        document.getElementById('qr-generator-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('generateBtn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-rounded">hourglass_empty</span> Generating...';
            btn.disabled = true;

            const upiId = document.getElementById('upiId').value.trim();
            const payeeName = document.getElementById('payeeName').value.trim();
            const amount = document.getElementById('qrAmount').value.trim();
            let note = document.getElementById('qrNote').value.trim();
            const shouldSave = document.getElementById('saveUpiCheck').checked;

            transactionId = generateReferenceId();
            if(!note) note = `Ref: ${transactionId}`;

            // Save to Firebase if checked
            if (shouldSave) {
                try {
                    // Use a clean version of the UPI ID as the document ID
                    const docId = upiId.replace(/[^a-zA-Z0-9]/g, '_');
                    await setDoc(doc(savedUpiRef, docId), {
                        upiId: upiId,
                        name: payeeName,
                        addedAt: new Date()
                    }, { merge: true });
                    window.loadSavedUpis(); // Reload dropdown
                } catch (err) {
                    console.error("Failed to save UPI:", err);
                }
            }

            // Build UPI String
            let upiString = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(payeeName)}&tr=${transactionId}`;
            if (amount) upiString += `&am=${amount}`;
            if (note) upiString += `&tn=${encodeURIComponent(note)}`;

            try {
                // Generate QR Code as Data URL directly
                generatedQrDataUrl = await QRCode.toDataURL(upiString, {
                    width: 300,
                    margin: 2,
                    color: { dark: '#0F172A', light: '#FFFFFF' }
                });

                document.getElementById('finalQrImg').src = generatedQrDataUrl;
                
                // Update Details text in preview
                let detailsHtml = `<div>${payeeName}</div>`;
                if (amount) detailsHtml = `<div style="font-size: 20px; font-weight: 700; margin-bottom: 4px;">₹ ${amount}</div>` + detailsHtml;
                document.getElementById('qr-details').innerHTML = detailsHtml;

                // Switch UI Views
                document.getElementById('qr-form-card').style.display = 'none';
                document.getElementById('qr-preview-card').classList.add('active');

            } catch (err) {
                console.error("QR Generation Failed:", err);
                alert("Failed to generate QR Code. Please check inputs.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // --- 4. ACTIONS ---
        window.downloadQR = function() {
            if (!generatedQrDataUrl) return;
            const a = document.createElement('a');
            a.href = generatedQrDataUrl;
            a.download = `QR_${transactionId}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        window.sendWhatsApp = function() {
            const countryCode = document.getElementById('countryCode').value;
            const phone = document.getElementById('contactNo').value.replace(/\D/g, '');
            const payeeName = document.getElementById('payeeName').value;
            const amount = document.getElementById('qrAmount').value;
            
            if (!phone) {
                alert("Please ensure contact number is provided.");
                return;
            }

            let message = `Hello, here is the payment link for ${payeeName}.\n\n`;
            if (amount) message += `*Amount:* ₹${amount}\n`;
            message += `*Ref ID:* ${transactionId}\n\n`;
            message += `Please find the attached QR code image to complete the payment.`;

            // Prompt user to attach the downloaded image
            alert("Note: WhatsApp web/app requires you to manually attach the QR Code image. We will download the image for you now, please attach it in the chat.");
            window.downloadQR();

            const waUrl = `https://wa.me/${countryCode}${phone}?text=${encodeURIComponent(message)}`;
            window.open(waUrl, '_blank');
        };

        window.resetForm = function() {
            document.getElementById('qr-preview-card').classList.remove('active');
            document.getElementById('qr-form-card').style.display = 'block';
            generatedQrDataUrl = "";
            transactionId = "";
        };

    </script>
</div>

</body>
</html>
