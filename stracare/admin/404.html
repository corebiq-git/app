<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | STRA CARE</title>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --prof-red: #C80000;
            --prof-red-hover: #A50000;
            --text-dark: #374151;
            --text-grey: #6B7280;
            --bg-color: #F9FAFB;
            --border-color: #E5E7EB;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-align: center;
        }

        /* Main Content Wrapper */
        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .error-code {
            font-size: clamp(100px, 15vw, 150px);
            font-weight: 700;
            color: var(--prof-red);
            line-height: 1;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 12px;
        }

        .error-message {
            font-size: 16px;
            color: var(--text-grey);
            max-width: 400px;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        /* Back to Main Page Button */
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--prof-red);
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(200, 0, 0, 0.2);
        }

        .btn-back:hover {
            background-color: var(--prof-red-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(200, 0, 0, 0.3);
        }

        .btn-back:active {
            transform: translateY(0);
        }

        /* Bottom Footer */
        .dev-footer {
            padding: 24px 20px;
            background-color: #FFFFFF;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }

        .dev-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #9CA3AF;
        }

        .dev-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 14px;
            transition: color 0.2s ease;
        }

        .dev-link:hover {
            color: var(--prof-red);
        }

        /* 1x1 Logo */
        .dev-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <main class="error-container">
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-message">We're sorry, but the page you are looking for doesn't exist, has been removed, or is temporarily unavailable.</p>
        
        <!-- Button links back to the root of stracares.in -->
        <a href="/" class="btn-back">Back to Main Page</a>
    </main>

    <footer class="dev-footer">
        <span class="dev-label">Contact</span>
        <a href="https://www.cmfilings.com" target="_blank" class="dev-link">
            <img src="assets/logo-dark-cm.svg" alt="CM" class="dev-logo" onerror="this.style.display='none'">
        </a>
    </footer>

</body>
</html>
