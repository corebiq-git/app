<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#F8F9FA">
    <title>COREBIQ | 404 Page Not Found</title>
    
    <!-- Tailwind CSS for structural utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts & Material Symbols (Exclusively Outfit for text) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

    <style>
        /* ==========================================================================
           COREBIQ 404 - Material Design 3 + Google Gemini Era
        ========================================================================== */
        :root {
            /* Primary Tones */
            --md3-primary: #0B57D0;
            --md3-primary-container: #D3E3FD;
            --md3-on-primary-container: #041E49;

            /* Surfaces & Backgrounds */
            --md3-surface: #F8F9FA;
            --md3-on-surface: #1F1F1F;
            --md3-on-surface-variant: #444746;
            --md3-surface-container-lowest: #FFFFFF;
            --md3-surface-container: #EDEDED;
            
            /* Outlines */
            --md3-outline-variant: #C4C7C5;

            /* Gemini Signature Colors */
            --gemini-blue: #4285F4;
            --gemini-purple: #9b72cb;
            --gemini-red: #d96570;
            --gemini-gradient: linear-gradient(90deg, var(--gemini-blue) 0%, var(--gemini-purple) 50%, var(--gemini-red) 100%);
            
            /* Shadows */
            --md3-shadow-2: 0px 1px 2px 0px rgba(0, 0, 0, 0.30), 0px 2px 6px 2px rgba(0, 0, 0, 0.15);
            --md3-shadow-3: 0px 1px 3px 0px rgba(0, 0, 0, 0.30), 0px 4px 8px 3px rgba(0, 0, 0, 0.15);

            /* Typography */
            --font-brand: 'Outfit', sans-serif;
        }

        * {
            font-family: var(--font-brand);
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: var(--md3-surface);
            color: var(--md3-on-surface);
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            /* Subtle ambient background glow */
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(66, 133, 244, 0.04) 0%, transparent 25%),
                radial-gradient(circle at 85% 90%, rgba(155, 114, 203, 0.05) 0%, transparent 25%);
        }

        /* Themed Card Container */
        .gemini-error-card {
            background-color: var(--md3-surface-container-lowest);
            border: 1px solid rgba(155, 114, 203, 0.2);
            box-shadow: var(--md3-shadow-3);
            border-radius: 28px;
            width: 100%;
            max-width: 480px;
            padding: 48px 32px;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        /* Decorative Sparkle Glow inside card */
        .gemini-error-card::before {
            content: '';
            position: absolute;
            top: -80px;
            left: -80px;
            width: 200px;
            height: 200px;
            background: var(--gemini-gradient);
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(40px);
            pointer-events: none;
            z-index: -1;
        }

        /* Gradient Text Utilities */
        .text-gradient-gemini {
            background: var(--gemini-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }

        /* Typography sizing for mobile readability */
        .error-code {
            font-size: 96px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 16px;
        }
        
        .error-title {
            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;
            color: var(--md3-on-surface);
            margin-bottom: 12px;
        }
        
        .error-desc {
            font-size: 16px;
            line-height: 1.5;
            color: var(--md3-on-surface-variant);
            margin-bottom: 36px;
            max-width: 90%;
            margin-left: auto;
            margin-right: auto;
        }

        /* Buttons */
        .md3-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 52px; /* Large touch target */
            padding: 0 28px;
            border-radius: 9999px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            position: relative;
            overflow: hidden;
            width: 100%;
            text-decoration: none;
        }

        .md3-btn .material-symbols-rounded {
            font-size: 20px;
        }

        .md3-btn-ai {
            background: var(--gemini-gradient);
            color: white;
            box-shadow: var(--md3-shadow-2);
        }
        .md3-btn-ai:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: var(--md3-shadow-3);
        }

        .md3-btn-tonal {
            background-color: var(--md3-primary-container);
            color: var(--md3-on-primary-container);
        }
        .md3-btn-tonal:hover {
            background-color: #C2D5F9;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Icon Container */
        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(155, 114, 203, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px auto;
            border: 1px solid rgba(155, 114, 203, 0.2);
        }

        /* Ripple Effect */
        .ripple {
            position: relative;
            overflow: hidden;
            transform: translate3d(0, 0, 0);
        }
        .ripple::after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple-light::after { background-image: radial-gradient(circle, #fff 10%, transparent 10.01%); }
        .ripple:active::after { transform: scale(0, 0); opacity: .2; transition: 0s; }

        /* Responsive adjustments */
        @media (min-width: 640px) {
            .action-group {
                flex-direction: row;
            }
            .error-code {
                font-size: 112px;
            }
        }
        
        @media (max-width: 480px) {
            .gemini-error-card {
                padding: 40px 20px;
                border-radius: 24px;
            }
            .error-code {
                font-size: 80px;
            }
            .error-title {
                font-size: 24px;
            }
            .error-desc {
                font-size: 15px;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="gemini-error-card">
        
        <!-- Animated / Decorative Icon -->
        <div class="icon-circle">
            <span class="material-symbols-rounded text-gradient-gemini" style="font-size: 32px;">explore_off</span>
        </div>

        <!-- 404 Heading -->
        <h1 class="error-code text-gradient-gemini">404</h1>
        
        <h2 class="error-title">Page Not Found</h2>
        
        <p class="error-desc">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>

        <!-- Actions -->
        <div class="action-group">
            <a href="index.html" class="md3-btn md3-btn-ai ripple ripple-light">
                <span class="material-symbols-rounded">dashboard</span>
                Go to Dashboard
            </a>
            <button onclick="window.history.back()" class="md3-btn md3-btn-tonal ripple">
                <span class="material-symbols-rounded">arrow_back</span>
                Go Back
            </button>
        </div>

    </div>

    <!-- Script for Ripple Effect -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.ripple');
            buttons.forEach(button => {
                button.addEventListener('mousedown', function (e) {
                    const rect = this.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    this.style.setProperty('--ripple-x', `${x}px`);
                    this.style.setProperty('--ripple-y', `${y}px`);
                    
                    const styleEl = document.createElement('style');
                    const uniqueId = 'ripple-' + Date.now() + Math.floor(Math.random() * 1000);
                    styleEl.innerHTML = `
                        .${uniqueId}::after {
                            background-position: ${x}px ${y}px !important;
                        }
                    `;
                    document.head.appendChild(styleEl);
                    this.classList.add(uniqueId);
                    
                    setTimeout(() => {
                        this.classList.remove(uniqueId);
                        styleEl.remove();
                    }, 600);
                });
            });
        });
    </script>
</body>
</html>
