<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ - Stamp Seal Templates</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>
<body>

<div class="module-container" id="seal-module">
    
    <style>
        /* --- Core Theme Variables (Gemini Material 3) --- */
        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --primary-light: #EEF2FF;
            --accent: #6366F1;
            --accent-soft: #E0E7FF;
            --bg: #F8FAFF;
            --surface: #FFFFFF;
            --surface-soft: #FAFAFF;
            --text-main: #111827;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border: #E2E8F0;
            --shadow-sm: 0 4px 12px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 24px rgba(79, 70, 229, 0.08);
            --radius-md: 14px;
            --radius-lg: 20px;
            --success: #10B981;
        }

        #seal-module { 
            font-family: 'Outfit', sans-serif; 
            width: 100%; 
            max-width: 800px;
            margin: 0 auto; 
            padding-bottom: 40px;
        } 

        /* --- UI Components --- */
        .section-title { 
            font-size: 20px; 
            font-weight: 700; 
            margin-bottom: 20px; 
            color: var(--text-dark); 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        
        .form-card { 
            background: var(--surface); 
            border-radius: var(--radius-lg); 
            padding: 24px; 
            box-shadow: var(--shadow-sm); 
            border: 1px solid var(--border); 
            margin-bottom: 24px; 
        }

        .form-label { 
            display: block; 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            margin-bottom: 8px; 
            letter-spacing: 0.5px; 
        }
        
        .form-input, .form-select { 
            width: 100%; 
            padding: 14px 16px; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border); 
            font-size: 14px; 
            color: var(--text-main); 
            background: #FAFAFA; 
            outline: none; 
            transition: 0.2s ease; 
            font-family: 'Outfit', sans-serif;
        }
        
        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .input-group { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 16px; 
            margin-bottom: 20px; 
        }
        @media (min-width: 768px) { .input-group { grid-template-columns: 1fr 1fr; } }

        /* --- Buttons --- */
        .btn-primary, .btn-secondary {
            padding: 14px 24px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            width: 100%;
        }
        .btn-primary { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%); 
            color: white; 
            box-shadow: var(--shadow-md); 
        }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 25px rgba(79, 70, 229, 0.25); 
        }
        
        .btn-secondary { 
            background: var(--surface-soft); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
        }
        .btn-secondary:hover { 
            background: var(--primary-light); 
            color: var(--primary-dark); 
            border-color: var(--accent-soft); 
        }

        /* --- Canvas Preview Area --- */
        .preview-area {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            animation: fadeIn 0.4s ease forwards;
        }
        .preview-area.active {
            display: flex;
        }

        .canvas-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1 / 1;
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            /* Subtle checkerboard to show transparency */
            background-image: linear-gradient(45deg, #f0f0f0 25%, transparent 25%), 
                              linear-gradient(-45deg, #f0f0f0 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #f0f0f0 75%), 
                              linear-gradient(-45deg, transparent 75%, #f0f0f0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

    <div class="section-title">
        <span class="material-symbols-rounded" style="color: var(--primary); font-size: 28px;">verified</span>
        Stamp Seal Generator
    </div>

    <!-- INPUT FORM -->
    <div class="form-card" id="seal-form-card">
        <form id="seal-generator-form">
            
            <div class="input-group">
                <div>
                    <label class="form-label">Seal Shape</label>
                    <select id="sealShape" class="form-select" required>
                        <option value="round">Round Seal</option>
                        <option value="rectangle">Rectangle (Rubber Stamp)</option>
                        <option value="oval">Oval Seal</option>
                    </select>
                </div>
                <div>
                    <label class="form-label">Ink Color</label>
                    <select id="sealColor" class="form-select" required>
                        <option value="#3B0086">Standard Blue/Violet</option>
                        <option value="#DC2626">Red</option>
                        <option value="#16A34A">Green</option>
                        <option value="#111827">Black</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <div style="grid-column: 1 / -1;">
                    <label class="form-label">Company / Entity Name (Outer Text)</label>
                    <input type="text" id="sealName" class="form-input" placeholder="e.g. COREBIQ PRIVATE LIMITED" required autocomplete="off" maxlength="45">
                </div>
                <div>
                    <label class="form-label">Center Text (Type)</label>
                    <input type="text" id="sealCenterText" class="form-input" placeholder="e.g. APPROVED, PAID, FOR" required autocomplete="off" maxlength="15">
                </div>
                <div>
                    <label class="form-label">Bottom Text / Reg No (Optional)</label>
                    <input type="text" id="sealBottomText" class="form-input" placeholder="e.g. Reg: 123456" autocomplete="off" maxlength="20">
                </div>
            </div>

            <button type="submit" class="btn-primary" id="generateBtn" style="margin-top: 8px;">
                <span class="material-symbols-rounded">design_services</span>
                Generate Seal
            </button>
        </form>
    </div>

    <!-- PREVIEW AREA -->
    <div class="form-card preview-area" id="seal-preview-card">
        <div class="form-label" style="align-self: flex-start; margin-bottom: 0;">Generated Seal Preview</div>
        
        <div class="canvas-container">
            <!-- Canvas size set large for high-res download, scaled by CSS -->
            <canvas id="sealCanvas" width="800" height="800"></canvas>
        </div>

        <div class="action-grid">
            <button type="button" class="btn-secondary" onclick="resetForm()">
                <span class="material-symbols-rounded">edit</span>
                Edit
            </button>
            <button type="button" class="btn-primary" onclick="downloadSeal()">
                <span class="material-symbols-rounded">download</span>
                Download PNG
            </button>
        </div>
    </div>

    <script>
        // --- Seal Generator Logic ---
        document.getElementById('seal-generator-form').addEventListener('submit', function(e) {
            e.preventDefault();
            generateSeal();
        });

        function generateSeal() {
            const shape = document.getElementById('sealShape').value;
            const color = document.getElementById('sealColor').value;
            const name = document.getElementById('sealName').value.toUpperCase();
            const centerText = document.getElementById('sealCenterText').value.toUpperCase();
            const bottomText = document.getElementById('sealBottomText').value.toUpperCase();

            const canvas = document.getElementById('sealCanvas');
            const ctx = canvas.getContext('2d');
            
            // Clear previous drawing
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Set global styles
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            if (shape === 'round') {
                drawRoundSeal(ctx, cx, cy, name, centerText, bottomText, color);
            } else if (shape === 'rectangle') {
                drawRectangleSeal(ctx, cx, cy, name, centerText, bottomText, color);
            } else if (shape === 'oval') {
                drawOvalSeal(ctx, cx, cy, name, centerText, bottomText, color);
            }

            // Show Preview UI
            document.getElementById('seal-form-card').style.display = 'none';
            document.getElementById('seal-preview-card').classList.add('active');
        }

        // --- Drawing Helpers ---
        function drawTextAlongArc(ctx, str, centerX, centerY, radius, angleSpan, isBottom = false) {
            ctx.save();
            ctx.translate(centerX, centerY);
            
            // Calculate angle per character
            const anglePerChar = angleSpan / (str.length > 1 ? str.length - 1 : 1);
            
            // Initial rotation to start point
            ctx.rotate(isBottom ? (Math.PI - angleSpan / 2) : (-Math.PI / 2 - angleSpan / 2));

            for (let i = 0; i < str.length; i++) {
                ctx.save();
                ctx.translate(0, isBottom ? radius : -radius);
                // Flip bottom text so it's readable
                if (isBottom) {
                    ctx.rotate(Math.PI);
                }
                ctx.fillText(str[i], 0, 0);
                ctx.restore();
                ctx.rotate(anglePerChar);
            }
            ctx.restore();
        }

        function drawRoundSeal(ctx, cx, cy, name, center, bottom, color) {
            const outerRadius = 350;
            const innerRadius = 240;
            const textRadius = 295;

            // Outer thick circle
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius, 0, 2 * Math.PI);
            ctx.stroke();

            // Outer thin inner circle
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(cx, cy, outerRadius - 18, 0, 2 * Math.PI);
            ctx.stroke();

            // Inner circle
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.arc(cx, cy, innerRadius, 0, 2 * Math.PI);
            ctx.stroke();

            // Outer Text (Name)
            ctx.font = 'bold 54px Arial, sans-serif';
            // Determine spread based on text length (max ~220 degrees)
            const topAngle = Math.min(Math.PI * 1.3, name.length * 0.15);
            drawTextAlongArc(ctx, name, cx, cy, textRadius, topAngle, false);

            // Bottom Text
            if (bottom) {
                ctx.font = 'bold 42px Arial, sans-serif';
                const bottomAngle = Math.min(Math.PI * 0.8, bottom.length * 0.15);
                drawTextAlongArc(ctx, bottom, cx, cy, textRadius, bottomAngle, true);
                
                // Add stars separators if both texts exist
                ctx.font = '50px Arial';
                ctx.fillText('★', cx - 290, cy + 20);
                ctx.fillText('★', cx + 290, cy + 20);
            } else {
                // Star at bottom if no bottom text
                ctx.font = '60px Arial';
                ctx.fillText('★', cx, cy + textRadius);
            }

            // Center Text
            ctx.font = 'bold 65px Arial, sans-serif';
            // Handle multi-line center text if it contains spaces
            const words = center.split(' ');
            if (words.length > 1 && center.length > 10) {
                ctx.fillText(words[0], cx, cy - 35);
                ctx.font = 'bold 50px Arial, sans-serif';
                ctx.fillText(words.slice(1).join(' '), cx, cy + 45);
            } else {
                ctx.fillText(center, cx, cy);
            }
        }

        function drawRectangleSeal(ctx, cx, cy, name, center, bottom, color) {
            const width = 700;
            const height = 400;
            const x = cx - width / 2;
            const y = cy - height / 2;

            // Outer border
            ctx.lineWidth = 14;
            ctx.strokeRect(x, y, width, height);
            
            // Inner border
            ctx.lineWidth = 4;
            ctx.strokeRect(x + 16, y + 16, width - 32, height - 32);

            // Top Name
            ctx.font = 'bold 55px Arial, sans-serif';
            ctx.fillText(name, cx, cy - 100);

            // Divider Line
            ctx.beginPath();
            ctx.moveTo(x + 40, cy - 40);
            ctx.lineTo(x + width - 40, cy - 40);
            ctx.stroke();

            // Center Text
            ctx.font = 'bold 80px Arial, sans-serif';
            ctx.fillText(center, cx, cy + 40);

            // Bottom Text
            if (bottom) {
                ctx.font = 'bold 36px Arial, sans-serif';
                ctx.fillText(bottom, cx, cy + 140);
            }
        }

        function drawOvalSeal(ctx, cx, cy, name, center, bottom, color) {
            const radX = 360;
            const radY = 240;

            // Draw Oval borders
            ctx.lineWidth = 12;
            ctx.beginPath();
            ctx.ellipse(cx, cy, radX, radY, 0, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.ellipse(cx, cy, radX - 16, radY - 12, 0, 0, 2 * Math.PI);
            ctx.stroke();

            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.ellipse(cx, cy, radX - 100, radY - 70, 0, 0, 2 * Math.PI);
            ctx.stroke();

            // Note: Native text-along-oval is complex for a simple script.
            // We'll simulate it with scaled text at top and bottom.
            ctx.font = 'bold 48px Arial, sans-serif';
            
            // Outer Name (Top)
            ctx.save();
            ctx.translate(cx, cy - radY + 50);
            // Slight horizontal stretch to fit oval shape better
            ctx.scale(1.2, 1);
            ctx.fillText(name, 0, 0);
            ctx.restore();

            // Bottom Text
            if (bottom) {
                ctx.save();
                ctx.translate(cx, cy + radY - 45);
                ctx.scale(1.2, 1);
                ctx.font = 'bold 36px Arial, sans-serif';
                ctx.fillText(bottom, 0, 0);
                ctx.restore();
            }

            // Center Text
            ctx.font = 'bold 75px Arial, sans-serif';
            ctx.fillText(center, cx, cy);
        }

        // --- Actions ---
        window.resetForm = function() {
            document.getElementById('seal-preview-card').classList.remove('active');
            document.getElementById('seal-form-card').style.display = 'block';
        };

        window.downloadSeal = function() {
            const canvas = document.getElementById('sealCanvas');
            const dataUrl = canvas.toDataURL('image/png');
            const name = document.getElementById('sealName').value.replace(/[^a-zA-Z0-9]/g, '_');
            
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `SEAL_${name}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };
    </script>
</div>

</body>
</html>
