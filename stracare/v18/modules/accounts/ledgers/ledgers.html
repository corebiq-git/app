<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ BUSINESS FLOW APP | Ledgers Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
<link rel="stylesheet" href="../../../css/corebiq.css">
    <link rel="stylesheet" href="./ledgers.css" data-module-style>
</head>
<body>

<div class="module-container" id="ledger-module">
    
    

    <div class="section-title">
        <span class="material-symbols-rounded">account_balance</span>
        Ledger Master (Chart of Accounts)
    </div>

    <div class="grid-layout">
        
        <!-- LEFT: ADD CATEGORY -->
        <div class="card" style="height: fit-content;">
            <h3 style="margin: 0 0 16px 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Add Ledger Category</h3>
            <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 16px;">Create categories like Indirect Expenses, Purchases, Assets, etc.</p>
            
            <form onsubmit="event.preventDefault(); window.saveCategory();">
                <label class="form-label">Category Name *</label>
                <input type="text" id="newCategoryName" class="form-input" placeholder="e.g., Indirect Expense" required>
                <button type="submit" class="btn-primary" id="saveCatBtn">
                    <span class="material-symbols-rounded" style="font-size: 18px;">add</span> Add Category
                </button>
            </form>
        </div>

        <!-- RIGHT: ADD LEDGER -->
        <div class="card">
            <h3 style="margin: 0 0 16px 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Create / Edit Ledger</h3>
            
            <form id="ledger-form" onsubmit="event.preventDefault(); window.saveLedger();">
                <input type="hidden" id="docId" value="">
                
                <div class="input-group three-cols">
                    <div>
                        <label class="form-label">Ledger No.</label>
                        <input type="text" id="lNo" class="form-input" readonly placeholder="Auto-generated">
                    </div>
                    <div style="grid-column: span 2;">
                        <label class="form-label">Ledger Name *</label>
                        <input type="text" id="lName" class="form-input" placeholder="e.g., Electricity Bill, Supplier Name..." required>
                    </div>
                </div>

                <div class="input-group two-cols">
                    <div>
                        <label class="form-label">Ledger Category *</label>
                        <select id="lCategory" class="form-input" required>
                            <option value="">Loading Categories...</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label">Opening Balance</label>
                        <div style="display: flex; gap: 8px;">
                            <select id="lOpType" class="form-input" style="width: 90px; margin-bottom: 0;">
                                <option value="Dr">Dr</option>
                                <option value="Cr">Cr</option>
                            </select>
                            <input type="number" id="lOpAmt" class="form-input" placeholder="0.00" style="margin-bottom: 0;">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="form-label">Other Info (Bank details, GST No, Loan Info, etc.)</label>
                    <textarea id="lOtherInfo" class="form-input" rows="2" placeholder="Optional details..."></textarea>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end; margin-top: 8px;">
                    <button type="button" class="btn-outline" onclick="window.resetLedgerForm()">Clear Form</button>
                    <button type="submit" class="btn-primary" id="saveLedgerBtn" style="width: auto;">
                        <span class="material-symbols-rounded">save</span> Save Ledger
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DIRECTORY TABLE -->
    <div class="table-container">
        <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #FAFAFA;">
            <h4 style="margin: 0; font-size: 15px;">Ledgers Directory</h4>
            <div style="display: flex; align-items: center; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; width: 250px;">
                <span class="material-symbols-rounded" style="font-size: 18px; color: var(--text-muted);">search</span>
                <input type="text" id="searchLedger" onkeyup="window.filterLedgers()" placeholder="Search ledgers..." style="border: none; background: transparent; outline: none; font-size: 13px; width: 100%; margin-left: 8px;">
            </div>
        </div>

        <div class="table-responsive">
            <table class="saas-table">
                <thead>
                    <tr>
                        <th>Ledger No.</th>
                        <th>Ledger Name</th>
                        <th>Category</th>
                        <th>Balance</th>
                        <th>Other Info</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="linkedLedgerTableBody">
                    <tr><td colspan="6" style="text-align:center;padding:24px;color:var(--text-muted);">Loading linked accounts…</td></tr>
                </tbody>
                <tbody id="ledgerTableBody">
                    <tr><td colspan="6" style="text-align: center; padding: 30px;">Loading ledgers...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module" src="./ledgers.js"></script>
</div>
</body>
</html>
