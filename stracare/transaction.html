<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>COREBIQ | Transactions</title>

    <!-- Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Material Symbols Rounded -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
</head>

<body>

<div class="module-container" id="transaction-module">

<style>
/* ============================================================
   COREBIQ
   GEMINI / MATERIAL 3 INSPIRED DESIGN SYSTEM
   TRANSACTIONS MODULE
   CSS ONLY
   ============================================================ */

:root {
    --primary: #0B57D0;
    --primary-dark: #0842A0;
    --primary-light: #E8F0FE;
    --primary-container: #D3E3FD;

    --bg: #F8F9FA;
    --surface: #FFFFFF;
    --surface-low: #F8F9FA;
    --surface-container: #F1F3F4;
    --surface-high: #E8EAED;

    --text-main: #202124;
    --text-muted: #5F6368;
    --text-soft: #80868B;

    --border: #DADCE0;
    --border-light: #E8EAED;
    --grey-med: #DADCE0;

    --success: #188038;
    --success-container: #E6F4EA;

    --danger: #D93025;
    --danger-container: #FCE8E6;

    --secondary: #5F6368;

    --shadow-sm:
        0 1px 2px rgba(60,64,67,.08),
        0 2px 6px rgba(60,64,67,.06);

    --shadow-md:
        0 2px 6px rgba(60,64,67,.10),
        0 8px 24px rgba(60,64,67,.08);

    --radius-sm: 10px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --radius-xl: 28px;
}

/* ============================================================
   BASE
   ============================================================ */

#transaction-module {
    width: 100%;
    max-width: 1120px;

    font-family: 'Outfit', sans-serif;
    color: var(--text-main);

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

#transaction-module *,
#transaction-module *::before,
#transaction-module *::after {
    box-sizing: border-box;
}

/* ============================================================
   SECTION TITLE
   ============================================================ */

#transaction-module .section-title {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 20px;

    color: var(--text-main);

    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
}

#transaction-module .section-title h2 {
    margin: 0 !important;

    font-size: 22px !important;
    font-weight: 600 !important;

    letter-spacing: -0.35px;
}

/* ============================================================
   FORM CARD
   ============================================================ */

#transaction-module .form-card {
    background: var(--surface);

    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);

    padding: 28px;

    box-shadow: var(--shadow-sm);

    margin-bottom: 24px;
}

/* Form heading */

#transaction-module .form-card h4 {
    color: var(--primary) !important;

    font-size: 17px;
    font-weight: 600;

    margin-bottom: 18px !important;

    border-bottom-color: var(--border-light) !important;
}

/* ============================================================
   LABELS
   ============================================================ */

#transaction-module .form-label {
    display: block;

    margin-bottom: 7px;

    color: var(--text-muted);

    font-size: 12px;
    font-weight: 500;

    letter-spacing: 0;
    text-transform: none;
}

/* ============================================================
   INPUT GROUP
   ============================================================ */

#transaction-module .input-group {
    display: grid;

    grid-template-columns: 1fr;

    gap: 18px;

    margin-bottom: 18px;
}

@media (min-width: 768px) {
    #transaction-module .input-group {
        grid-template-columns: 1fr 1fr;
    }
}

@media (min-width: 1024px) {
    #transaction-module .input-group.three-cols {
        grid-template-columns: 1fr 1fr 1fr;
    }
}

/* ============================================================
   MATERIAL 3 INPUTS
   ============================================================ */

#transaction-module .form-input {
    width: 100%;
    min-height: 50px;

    padding: 13px 16px;

    border: 1px solid var(--border);
    border-radius: 12px;

    outline: none;

    background: var(--surface);
    color: var(--text-main);

    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 400;

    appearance: auto;

    transition:
        border-color .18s ease,
        box-shadow .18s ease,
        background .18s ease;
}

#transaction-module .form-input:hover {
    border-color: #9AA0A6;
}

#transaction-module .form-input:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 1px var(--primary);
}

#transaction-module .form-input::placeholder {
    color: #9AA0A6;
    opacity: 1;
}

#transaction-module .form-input:disabled {
    background: var(--surface-container);
    color: #9AA0A6;

    border-color: var(--border-light);

    cursor: not-allowed;
}

/* Select/date */

#transaction-module input[type="date"],
#transaction-module select {
    cursor: pointer;
}

/* ============================================================
   READONLY
   ============================================================ */

#transaction-module .readonly-input {
    background: var(--primary-light);

    border-color: transparent;

    color: var(--primary);

    font-weight: 600;

    pointer-events: none;
}

/* ============================================================
   PRIMARY BUTTON
   ============================================================ */

#transaction-module .btn-primary {
    min-height: 48px;

    padding: 0 24px;

    border: none;
    border-radius: 999px;

    background: var(--primary);
    color: #FFFFFF;

    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .18s ease,
        box-shadow .18s ease,
        transform .12s ease;
}

#transaction-module .btn-primary:hover {
    background: var(--primary-dark);

    box-shadow: var(--shadow-sm);
}

#transaction-module .btn-primary:active {
    transform: scale(.98);
}

#transaction-module .btn-primary:disabled {
    opacity: .55;
    cursor: not-allowed;
}

/* ============================================================
   OUTLINE BUTTON
   ============================================================ */

#transaction-module .btn-outline {
    min-height: 42px;

    padding: 0 17px;

    display: inline-flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    border: 1px solid var(--border);
    border-radius: 999px;

    background: transparent;
    color: var(--primary);

    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;

    cursor: pointer;

    transition:
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease;
}

#transaction-module .btn-outline:hover {
    background: var(--primary-light);

    border-color: #A8C7FA;
}

#transaction-module .btn-outline:active {
    background: var(--primary-container);
}

/* ============================================================
   VERIFY BUTTON
   ============================================================ */

#transaction-module .btn-verify {
    min-height: 50px;

    padding: 0 20px;

    border: none;
    border-radius: 999px;

    background: var(--primary);
    color: #FFFFFF;

    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;

    cursor: pointer;

    transition:
        background .18s ease,
        transform .12s ease;
}

#transaction-module .btn-verify:hover {
    background: var(--primary-dark);
}

#transaction-module .btn-verify:active {
    transform: scale(.97);
}

/* ============================================================
   CUSTOMER SUMMARY
   ============================================================ */

#CUSTOMERSummaryDash {
    display: none;

    align-items: center;
    justify-content: space-between;

    flex-wrap: wrap;

    gap: 20px;

    padding: 18px 20px;

    margin-bottom: 18px;

    border: 1px solid #C5D7F5;
    border-radius: var(--radius-md);

    background: var(--primary-light);
}

#transaction-module .summary-metric {
    display: flex;
    flex-direction: column;

    min-width: 150px;
}

#transaction-module .summary-metric span {
    margin-bottom: 5px;

    color: var(--text-muted);

    font-size: 11px;
    font-weight: 500;

    text-transform: none;
}

#transaction-module .summary-metric strong {
    color: var(--text-main);

    font-size: 19px;
    font-weight: 600;
}

/* ============================================================
   AMOUNT AREA
   ============================================================ */

#transaction-module .input-group[style*="background"] {
    padding: 18px !important;

    background: var(--surface-low) !important;

    border: 1px solid var(--border-light);

    border-radius: var(--radius-md) !important;
}

#transaction-module input[style*="color: var(--success)"] {
    color: var(--success) !important;
    font-weight: 600 !important;
}

#transaction-module input[style*="color: var(--danger)"] {
    color: var(--danger) !important;
    font-weight: 600 !important;
}

/* ============================================================
   TABLE CONTAINER
   ============================================================ */

#transaction-module .table-container {
    margin-bottom: 24px;

    overflow: hidden;

    background: var(--surface);

    border: 1px solid var(--border-light);
    border-radius: var(--radius-lg);

    box-shadow: var(--shadow-sm);
}

/* ============================================================
   TABLE HEADER
   ============================================================ */

#transaction-module .table-header {
    display: flex;
    flex-direction: column;

    gap: 16px;

    padding: 20px;

    border-bottom: 1px solid var(--border-light);
}

#transaction-module .table-header h4 {
    margin: 0;

    color: var(--text-main);

    font-size: 17px;
    font-weight: 600;
}

/* ============================================================
   FILTER BAR
   ============================================================ */

#transaction-module .table-header .no-print[style*="background"] {
    padding: 10px !important;

    background: var(--surface-low) !important;

    border: 1px solid var(--border-light) !important;

    border-radius: 14px !important;
}

#transaction-module .table-header .form-input {
    min-height: 40px;
    height: 40px;

    padding: 8px 13px;

    background: var(--surface);

    border-radius: 999px;

    font-size: 12px;
}

/* ============================================================
   SEARCH
   ============================================================ */

#transaction-module #txnSearchInput {
    min-height: 34px;

    width: 100%;

    color: var(--text-main);

    font-family: 'Outfit', sans-serif;
}

#transaction-module #txnSearchInput::placeholder {
    color: #9AA0A6;
}

/* ============================================================
   TABLE
   ============================================================ */

#transaction-module .table-responsive {
    width: 100%;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;
}

#transaction-module .saas-table {
    width: 100%;
    min-width: 900px;

    border-collapse: separate;
    border-spacing: 0;

    text-align: left;
}

#transaction-module .saas-table th {
    padding: 13px 16px;

    background: var(--surface-low);

    color: var(--text-muted);

    border-bottom: 1px solid var(--border-light);

    font-size: 11px;
    font-weight: 600;

    text-transform: none;

    letter-spacing: .1px;

    white-space: nowrap;
}

#transaction-module .saas-table td {
    padding: 15px 16px;

    color: var(--text-main);

    border-bottom: 1px solid var(--border-light);

    font-size: 13px;
    font-weight: 400;

    vertical-align: middle;

    white-space: nowrap;
}

#transaction-module .saas-table tbody tr {
    transition: background .15s ease;
}

#transaction-module .saas-table tbody tr:hover {
    background: #F8FAFF;
}

#transaction-module .saas-table tbody tr:last-child td {
    border-bottom: none;
}

/* ============================================================
   BADGES
   ============================================================ */

#transaction-module .badge {
    display: inline-flex;
    align-items: center;

    padding: 5px 10px;

    border-radius: 999px;

    font-size: 11px;
    font-weight: 600;

    line-height: 1;

    text-transform: none;
}

#transaction-module .badge-sales {
    background: var(--success-container);
    color: var(--success);
}

#transaction-module .badge-expense {
    background: var(--danger-container);
    color: var(--danger);
}

#transaction-module .badge-receipt {
    background: var(--surface-container);
    color: var(--secondary);
}

/* ============================================================
   WHATSAPP / CTA
   ============================================================ */

#transaction-module .cta-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;

    width: 34px;
    height: 34px;

    border: none;
    border-radius: 50%;

    background: transparent;

    text-decoration: none;

    transition:
        background .18s ease,
        transform .12s ease;
}

#transaction-module .cta-link:hover {
    background: var(--surface-container);

    transform: none;

    box-shadow: none;
}

#transaction-module .cta-link .material-symbols-rounded {
    font-size: 18px !important;
}

/* ============================================================
   MATERIAL SYMBOLS
   ============================================================ */

#transaction-module .material-symbols-rounded {
    font-family: 'Material Symbols Rounded';

    font-variation-settings:
        'FILL' 1,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;
}

/* ============================================================
   TABLE ACTION ICONS
   ============================================================ */

#transaction-module .saas-table td .material-symbols-rounded {
    padding: 7px;

    border-radius: 50%;

    transition:
        background .18s ease,
        transform .12s ease;
}

#transaction-module .saas-table td .material-symbols-rounded:hover {
    background: var(--surface-container);

    transform: scale(1.05);
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 767px) {

    #transaction-module {
        width: 100%;
    }

    #transaction-module .section-title {
        margin-bottom: 16px;
    }

    #transaction-module .section-title h2 {
        font-size: 20px !important;
    }

    #transaction-module .form-card {
        padding: 18px;

        border-radius: 18px;
    }

    #transaction-module .input-group {
        gap: 15px;

        margin-bottom: 15px;
    }

    #transaction-module .form-input {
        min-height: 48px;

        font-size: 14px;
    }

    #transaction-module .btn-primary {
        min-height: 46px;

        padding: 0 20px;
    }

    #transaction-module .btn-outline {
        min-height: 44px;
    }

    #transaction-module .btn-verify {
        min-height: 48px;

        padding: 0 17px;
    }

    #CUSTOMERSummaryDash {
        flex-direction: column;
        align-items: flex-start;

        gap: 14px;
    }

    #transaction-module .table-container {
        border-radius: 18px;
    }

    #transaction-module .table-header {
        padding: 16px;
    }

    #transaction-module .table-header .no-print[style*="background"] {
        padding: 10px !important;
    }

    #transaction-module .table-header .no-print[style*="background"] > div {
        width: 100%;
    }

    #transaction-module .table-header .form-input {
        width: 100% !important;

        flex: 1;
    }
}

/* ============================================================
   PRINT
   ============================================================ */

@media print {

    body {
        background: white;
        padding: 0;
    }

    #sidebar-container,
    #header-container,
    #bottomnav-container,
    .form-card,
    .section-title,
    .no-print {
        display: none !important;
    }

    .main-wrapper {
        flex: 1;

        display: block;

        overflow: visible;
    }

    #main-content {
        padding: 0;

        overflow: visible;
    }

    #transaction-module .table-container {
        margin: 0;

        border: none;

        box-shadow: none;
    }

    #transaction-module .saas-table th {
        background: white;

        color: black;

        border-bottom: 1px solid #000;
    }

    #transaction-module .saas-table td {
        border-bottom: 1px solid #E8EAED;
    }
}
</style>


<!-- ============================================================
     ORIGINAL HTML — UNCHANGED
     ============================================================ -->

<div class="section-title">
    <h2 style="margin: 0;">Transactions & Vouchers</h2>
</div>

<div class="form-card no-print">
    <form id="transaction-form" onsubmit="event.preventDefault();">
        <input type="hidden" id="txnDocId" value="">

        <h4 style="color: var(--primary); margin: 0 0 16px 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;">
            Log Transaction
        </h4>

        <div class="input-group three-cols">
            <div>
                <label class="form-label">Transaction / Voucher ID</label>
                <input type="text" id="txnIdDisplay" class="form-input readonly-input" value="Auto-Generated" readonly tabindex="-1">
            </div>

            <div>
                <label class="form-label">Date *</label>
                <input type="date" class="form-input" id="txnDate" required>
            </div>

            <div>
                <label class="form-label">Voucher Type *</label>
                <select id="txnType" class="form-input" required>
                    <option value="Receipt">Receipt (Cash In / Collect Dues)</option>
                    <option value="Sales">Sales (Receivable / Bill Fee)</option>
                    <option value="Payment">Payment (Cash Out)</option>
                    <option value="Expense">Expense</option>
                </select>
            </div>
        </div>

        <div class="input-group three-cols">
            <div>
                <label class="form-label">Client/CUSTOMER Mobile</label>

                <div style="display: flex; gap: 8px;">
                    <input
                        type="tel"
                        id="mobileInput"
                        class="form-input"
                        placeholder="10-digit number"
                        maxlength="10"
                        oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    >

                    <button
                        type="button"
                        class="btn-verify"
                        id="verifyTxnBtn"
                        onclick="window.verifyTxnMobile()"
                    >
                        Search
                    </button>
                </div>
            </div>

            <div>
                <label class="form-label">Client/Ledger Name *</label>

                <input
                    type="text"
                    id="CUSTOMERName"
                    class="form-input"
                    placeholder="Name for the ledger"
                    required
                >
            </div>

            <div>
                <label class="form-label">Branch *</label>

                <select id="txnBranch" class="form-input" required>
                    <option value="">Loading Branches...</option>
                </select>
            </div>
        </div>

        <div id="CUSTOMERSummaryDash">

            <div class="summary-metric">
                <span>Total Services Billed</span>
                <strong id="dashTotalBilled">₹0.00</strong>
            </div>

            <div class="summary-metric">
                <span>Total Paid (Advance/Receipts)</span>
                <strong id="dashTotalPaid" style="color: var(--success);">₹0.00</strong>
            </div>

            <div class="summary-metric">
                <span>Outstanding / Pending Dues</span>
                <strong id="dashTotalPending" style="color: var(--danger);">₹0.00</strong>
            </div>

        </div>

        <div class="input-group three-cols">

            <div>
                <label class="form-label">Payment Mode</label>

                <select id="txnMode" class="form-input">
                    <option value="Cash">Cash</option>
                    <option value="Bank/UPI">Bank (Card/UPI/Net)</option>
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label class="form-label">Reference / UTR / Cheque No.</label>

                <input
                    type="text"
                    id="txnRef"
                    class="form-input"
                    placeholder="Optional reference details"
                >
            </div>

        </div>

        <div
            class="input-group three-cols"
            style="background: var(--bg); padding: 16px; border-radius: 12px;"
        >

            <div>
                <label class="form-label" style="color: var(--success);">
                    Amount In (₹)
                </label>

                <input
                    type="number"
                    id="txnCashIn"
                    class="form-input"
                    placeholder="0.00"
                    style="color: var(--success); font-weight: 700;"
                >
            </div>

            <div>
                <label class="form-label" style="color: var(--danger);">
                    Amount Out (₹)
                </label>

                <input
                    type="number"
                    id="txnCashOut"
                    class="form-input"
                    placeholder="0.00"
                    style="color: var(--danger); font-weight: 700;"
                >
            </div>

            <div>
                <label class="form-label">
                    Particulars / Notes
                </label>

                <input
                    type="text"
                    id="txnNotes"
                    class="form-input"
                    placeholder="Remarks..."
                >
            </div>

        </div>

        <div style="text-align: right; margin-top: 24px;">

            <button
                type="button"
                class="btn-outline"
                style="margin-right: 12px; padding: 14px 24px;"
                onclick="window.resetTxnForm()"
            >
                Clear Form
            </button>

            <button
                type="button"
                class="btn-primary"
                id="saveTxnBtn"
                onclick="window.saveTransaction()"
            >
                Save Transaction
            </button>

        </div>

    </form>
</div>


<div class="table-container">

    <div class="table-header">

        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">

            <h4>Transaction Ledger</h4>

            <button
                class="btn-outline no-print"
                onclick="window.print()"
                style="padding: 6px 12px; font-size: 12px;"
            >
                <span
                    class="material-symbols-rounded"
                    style="font-size: 14px; color: var(--primary);"
                >
                    picture_as_pdf
                </span>

                Export Current View
            </button>

        </div>


        <div
            class="no-print"
            style="
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                align-items: center;
                background: #FAFAFA;
                padding: 12px;
                border-radius: 8px;
                border: 1px solid var(--border);
                width: 100%;
            "
        >

            <div style="display: flex; align-items: center; gap: 6px;">

                <input
                    type="date"
                    id="filterTxnDateFrom"
                    class="form-input"
                    onchange="window.filterTxnTable()"
                    style="padding: 8px; font-size: 12px; width: auto;"
                    title="From Date"
                >

                <span
                    style="font-size: 12px; color: var(--text-muted);"
                >
                    to
                </span>

                <input
                    type="date"
                    id="filterTxnDateTo"
                    class="form-input"
                    onchange="window.filterTxnTable()"
                    style="padding: 8px; font-size: 12px; width: auto;"
                    title="To Date"
                >

            </div>


            <select
                id="filterTxnType"
                class="form-input"
                onchange="window.filterTxnTable()"
                style="padding: 8px; font-size: 12px; width: auto;"
            >
                <option value="">All Voucher Types</option>
                <option value="sales">Sales</option>
                <option value="receipt">Receipt</option>
                <option value="payment">Payment</option>
                <option value="expense">Expense</option>
            </select>


            <div
                style="
                    display: flex;
                    align-items: center;
                    background: #fff;
                    border: 1px solid var(--border);
                    border-radius: 8px;
                    padding: 4px 8px;
                    flex: 1;
                    min-width: 200px;
                "
            >

                <span
                    class="material-symbols-rounded"
                    style="font-size: 16px; color: var(--text-muted);"
                >
                    search
                </span>

                <input
                    type="text"
                    id="txnSearchInput"
                    onkeyup="window.filterTxnTable()"
                    placeholder="Search CUSTOMER Name or Mobile..."
                    style="
                        border: none;
                        background: transparent;

window.verifyTxnMobile = async function() {

    const mobile =
        document.getElementById('mobileInput').value;

    const btn =
        document.getElementById('verifyTxnBtn');

    const dash =
        document.getElementById('CUSTOMERSummaryDash');

    if (mobile.length !== 10)
        return alert("Enter 10-digit mobile number.");

    btn.innerText = "...";

    try {

        const pSnap =
            await getDocs(
                query(
                    collection(db, "CUSTOMERs"),
                    where("mobile", "==", mobile)
                )
            );

        if (!pSnap.empty) {

            document.getElementById('CUSTOMERName').value =
                pSnap.docs[0].data().name;

        } else {

            alert("No CUSTOMER found. Type name manually.");

            dash.style.display = 'none';
        }


        const tSnap =
            await getDocs(
                query(
                    collection(db, "transactions"),
                    where("mobile", "==", mobile)
                )
            );


        if (!tSnap.empty) {

            let tBilled = 0;
            let tPaid = 0;

            tSnap.forEach(d => {

                const rec = d.data();

                tBilled +=
                    parseFloat(rec.cashOut) || 0;

                tPaid +=
                    parseFloat(rec.cashIn) || 0;

            });


            const tPending =
                tBilled - tPaid;


            document.getElementById('dashTotalBilled').innerText =
                `₹${tBilled.toFixed(2)}`;

            document.getElementById('dashTotalPaid').innerText =
                `₹${tPaid.toFixed(2)}`;

            document.getElementById('dashTotalPending').innerText =
                `₹${tPending.toFixed(2)}`;


            if (tPending > 0) {

                document.getElementById('txnType').value =
                    'Receipt';

                document.getElementById('txnCashIn').value =
                    tPending.toFixed(2);

                document.getElementById('txnCashOut').value =
                    '';

                document.getElementById('txnNotes').value =
                    "Clearing pending dues";
            }

            dash.style.display = 'flex';

};

window.filterTxnTable = function() {

    const typeQuery =
        document
            .getElementById("filterTxnType")
            .value
            .toLowerCase();

    const dateFromQuery =
        document
            .getElementById("filterTxnDateFrom")
            .value;

    const dateToQuery =
        document
            .getElementById("filterTxnDateTo")
            .value;

    const textQuery =
        document
            .getElementById("txnSearchInput")
            .value
            .toLowerCase();

    const trs =
        document
            .getElementById("txnTableBody")
            .getElementsByTagName("tr");


    for (let i = 0; i < trs.length; i++) {

        if (trs[i].cells.length === 1)
            continue;

        const rowType =
            trs[i].getAttribute("data-type");

        const rowDate =
            trs[i].getAttribute("data-date");

        const rowSearch =
            trs[i].getAttribute("data-search");


        let show = true;

        if (
            typeQuery &&
            rowType !== typeQuery
        )
            show = false;

        if (
            dateFromQuery &&
            rowDate < dateFromQuery
        )
            show = false;

        if (
            dateToQuery &&
            rowDate > dateToQuery
        )
            show = false;

        if (
            textQuery &&
            rowSearch.indexOf(textQuery) === -1
        )
            show = false;


        trs[i].style.display =
            show ? "" : "none";
    }

};


window.clearTxnFilters = function() {

    document.getElementById(
        "filterTxnDateFrom"
    ).value = "";

    document.getElementById(
        "filterTxnDateTo"
    ).value = "";

    document.getElementById(
        "filterTxnType"
    ).value = "";

    document.getElementById(
        "txnSearchInput"
    ).value = "";

    window.filterTxnTable();
};

window.editTxn = function(docId) {

    const data =
        window.txnDataCache[docId];

    if (!data) return;


    document.getElementById('txnDocId').value =
        docId;

    document.getElementById('txnIdDisplay').value =
        data.txnId;

    document.getElementById('txnDate').value =
        data.date || '';

    document.getElementById('txnType').value =
        data.type || 'Sales';

    document.getElementById('mobileInput').value =
        data.mobile || '';

    document.getElementById('CUSTOMERName').value =
        data.name || '';

    document.getElementById('txnBranch').value =
        data.branch || '';

    document.getElementById('txnMode').value =
        data.mode || 'Cash';

    document.getElementById('txnRef').value =
        data.ref || '';

    document.getElementById('txnCashIn').value =
        data.cashIn || '';

    document.getElementById('txnCashOut').value =
        data.cashOut || '';

    document.getElementById('txnNotes').value =
        data.notes || '';


    document.getElementById('saveTxnBtn').innerText =

    const mc =
        document.getElementById('main-content');

    if (mc) {

        mc.scrollTo({
            top: 0,
            behavior: 'smooth'
        });

    }

};

   ============================================================ */

window.deleteTxn =
async function(docId) {

    if (
        confirm(
            "Are you sure you want to permanently delete this transaction?"
        )
    ) {

        try {

            await deleteDoc(
                doc(
                    db,
                    "transactions",
                    docId
                )
            );

            alert(
                "Transaction deleted."
            );

            window.loadTransactions();

        } catch(e) {

            alert(
                "Error deleting transaction."
            );

        }

    }

};


/* ============================================================
   5C. RESET
   ============================================================ */

window.resetTxnForm =
function() {

    document
        .getElementById('transaction-form')
        .reset();

    document
        .getElementById('txnDocId')
        .value = '';

    document
        .getElementById('txnIdDisplay')
        .value =
        'Auto-Generated';

    document
        .getElementById('txnDate')
        .value =
        new Date()
            .toISOString()
            .split('T')[0];

    document
        .getElementById('saveTxnBtn')
        .innerText =
        "Save Transaction";

    document
        .getElementById('CUSTOMERSummaryDash')
        .style.display =
        'none';


    if (
        window.currentUser &&
        window.currentUser.role !== 'admin'
    ) {

        document
            .getElementById('txnBranch')
            .value =
            window.currentUser.branch;

    }

};


/* ============================================================
   6. SAVE TRANSACTION
   ============================================================ */

window.saveTransaction =
async function() {

    const saveBtn =
        document.getElementById(
            'saveTxnBtn'
        );

    const docId =
        document.getElementById(
            'txnDocId'
        ).value;


    const date =
        document.getElementById(
            'txnDate'
        ).value;

    const type =
        document.getElementById(
            'txnType'
        ).value;

    const branch =
        document.getElementById(
            'txnBranch'
        ).value;

    const mobile =
        document.getElementById(
            'mobileInput'
        ).value;

    const name =
        document.getElementById(
            'CUSTOMERName'
        ).value;

    const mode =
        document.getElementById(
            'txnMode'
        ).value;

    const ref =
        document.getElementById(
            'txnRef'
        ).value;

    const cashIn =
        document.getElementById(
            'txnCashIn'
        ).value || 0;

    const cashOut =
        document.getElementById(
            'txnCashOut'
        ).value || 0;

    const notes =
        document.getElementById(
            'txnNotes'
        ).value;


    if (
        !name ||
        !date ||
        !type ||
        !branch
    ) {

        return alert(
            "Required fields missing!"
        );

    }


    saveBtn.innerText =
        "Saving...";

    saveBtn.disabled = true;


    const payload = {

        date: date,

        type: type,

        branch: branch,

        mobile: mobile,

        name: name,

        mode: mode,

        ref: ref,

        cashIn:
            parseFloat(cashIn),

        cashOut:
            parseFloat(cashOut),

        notes: notes,

        updatedAt:
            new Date()

    };


    try {

        if (docId) {

            payload.txnId =
                document
                    .getElementById(
                        'txnIdDisplay'
                    )
                    .value;


            await updateDoc(

                doc(
                    db,
                    "transactions",
                    docId
                ),

                payload

            );


            alert(
                "Transaction updated!"
            );

        } else {

            const now =
                new Date();


            const dd =
                String(
                    now.getDate()
                ).padStart(2, '0');

            const mm =
                String(
                    now.getMonth() + 1
                ).padStart(2, '0');

            const yy =
                String(
                    now.getFullYear()
                ).slice(-2);

            const hh =
                String(
                    now.getHours()
                ).padStart(2, '0');

            const mins =
                String(
                    now.getMinutes()
                ).padStart(2, '0');


            payload.txnId =
                `TRN${dd}${mm}${yy}${hh}${mins}`;

            payload.createdAt =
                now;


            await addDoc(
                collection(
                    db,
                    "transactions"
                ),
                payload
            );


            alert(
                "Transaction saved!"
            );

        }


        window.resetTxnForm();

        window.loadTransactions();


    } catch (error) {

        console.error(
            "Firebase Save Error:",
            error
        );

        alert(
            "Failed to save."
        );

    }


    saveBtn.innerText =
        "Save Transaction";

    saveBtn.disabled = false;

};

</script>
