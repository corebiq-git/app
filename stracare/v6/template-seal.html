<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>COREBIQ | Digital Seals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0"/>
<link rel="stylesheet" href="css/corebiq.css">
</head>
<body>

<div class="module-container" id="seal-module">
    
    <style>
    :root {
        --primary: #0B1F4B;
        --bg: #F8FAFC;
        --surface: #FFFFFF;

        --text-main: #0F172A;
        --text-muted: #64748B;

        --border: #E2E8F0;
        --shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);

        --stamp-green: #007B5E; /* Authentic Rubber Stamp Green */
    }

        #seal-module { font-family: 'Inter', sans-serif; width: 100%; max-width: 800px; margin: 0 auto; }
        
        #seal-module .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--text-main); display: flex; justify-content: space-between; align-items: center; }
        #seal-module .form-card { background: var(--surface); border-radius: 20px; padding: 24px; box-shadow: var(--shadow-sm); border: 1px solid var(--border); margin-bottom: 24px; }
        
        /* --- Controls --- */
        .seal-selector-group { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
        .seal-option { flex: 1; min-width: 200px; border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: 0.2s; background: #FAFAFA; }
        .seal-option:hover { border-color: var(--primary); }
        .seal-option.active { border-color: var(--primary); background: var(--primary-light); }
        .seal-option input[type="radio"] { accent-color: var(--primary); transform: scale(1.2); cursor: pointer; }
        .seal-option-details { display: flex; flex-direction: column; }
        .seal-option-title { font-size: 14px; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .seal-option-desc { font-size: 12px; color: var(--text-muted); }

        .btn-outline { background: var(--surface); color: var(--text-main); border: 1px solid var(--border); padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
        .btn-outline:hover { background: #FAFAFA; }

        /* --- Preview Canvas --- */
        .canvas-area { background: #F0F0F0; border-radius: 16px; padding: 40px; display: flex; justify-content: center; align-items: center; min-height: 300px; border: 1px dashed #CCC; }

        /* --- Seal 1: Company Seal (2.5" x 1") --- */
        .seal-box-company {
            width: 63.5mm;
            height: 25.4mm;
            border: 2px solid var(--stamp-green);
            border-radius: 4px;
            background: transparent;
            color: var(--stamp-green);
            position: relative;
            overflow: hidden;
            font-family: "Times New Roman", serif;
            display: none; /* Toggled by JS */
        }
        .seal-box-company .seal-name { text-align: center; font-size: 18px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4mm; line-height: 1; }
        .seal-box-company .signature-line { position: absolute; left: 5mm; right: 5mm; bottom: 8mm; border-top: 1.5px solid var(--stamp-green); }
        .seal-box-company .seal-role { position: absolute; right: 5mm; bottom: 2.5mm; font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--stamp-green); }

        /* --- Seal 2: Doctor Seal (Sans-serif, No Border) --- */
        .seal-box-doctor {
            display: none; /* Toggled by JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--stamp-green);
            font-family: "Arial", "Helvetica", sans-serif; /* Matches the image */
            text-align: center;
            line-height: 1.4;
        }
        .seal-box-doctor .doc-name { font-size: 17px; font-weight: 800; letter-spacing: 0.5px; }
        .seal-box-doctor .doc-qual { font-size: 15px; font-weight: 700; }
        .seal-box-doctor .doc-reg { font-size: 14px; font-weight: 700; margin-top: 2px; }
        .seal-box-doctor .doc-role { font-size: 14px; font-weight: 700; margin-top: 2px; }

        /* --- Seal 3: Sincerely --- */
        .seal-box-sincerely {
            display: none;
            width: 63.5mm;
            min-height: 35mm;
            color: #000;
            font-family: "Times New Roman", serif;
            text-align: center;
            line-height: 1.3;
        }
        .seal-box-sincerely .sincerely-title { font-size: 16px; font-weight: 700; }
        .seal-box-sincerely .sincerely-signature-gap { height: 14mm; }
        .seal-box-sincerely .sincerely-administration,
        .seal-box-sincerely .sincerely-company { font-size: 13px; font-weight: 700; }

        /* --- Seal 4: Payment Received --- */
        .seal-box-payment {
            display: none;
            width: 63.5mm;
            min-height: 25.4mm;
            align-items: center;
            justify-content: center;
            color: #C62828;
            font-family: "Arial", "Helvetica", sans-serif;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            text-align: center;
            text-transform: uppercase;
        }

        /* --- Print Styles --- */
        @media print {
            body { background: white; padding: 0; }
            #sidebar-container, #header-container, #bottomnav-container, .form-card, .section-title, .no-print { display: none !important; }
            .main-wrapper { flex: 1; display: block; overflow: visible; }
            #main-content { padding: 0; overflow: visible; }
            
            .canvas-area { background: white; border: none; padding: 0; min-height: auto; align-items: flex-start; justify-content: flex-start; }
            .seal-box-company, .seal-box-doctor, .seal-box-sincerely, .seal-box-payment { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
    </style>

    <div class="section-title no-print">
        <h2 style="margin: 0;">Digital Seals</h2>
    </div>

    <div class="form-card no-print">
        <h4 style="color: var(--primary); margin: 0 0 16px 0; border-bottom: 1px solid var(--border); padding-bottom: 8px;">Select Seal Template</h4>
        
        <div class="seal-selector-group">
            <label class="seal-option active" id="opt-company" onclick="window.selectSeal('company')">
                <input type="radio" name="sealType" checked>
                <div class="seal-option-details">
                    <span class="seal-option-title">Company Seal</span>
                    <span class="seal-option-desc">Company name / authorised signatory designation</span>
                </div>
            </label>

            <label class="seal-option" id="opt-doctor" onclick="window.selectSeal('doctor')">
                <input type="radio" name="sealType">
                <div class="seal-option-details">
                    <span class="seal-option-title">Doctor's Seal</span>
                    <span class="seal-option-desc">Authorised signatory name / qualification or licence</span>
                </div>
            </label>

            <label class="seal-option" id="opt-sincerely" onclick="window.selectSeal('sincerely')">
                <input type="radio" name="sealType">
                <div class="seal-option-details">
                    <span class="seal-option-title">Sincerely</span>
                    <span class="seal-option-desc">Administration and company name with space for a signature</span>
                </div>
            </label>

            <label class="seal-option" id="opt-payment" onclick="window.selectSeal('payment')">
                <input type="radio" name="sealType">
                <div class="seal-option-details">
                    <span class="seal-option-title">Payment Received</span>
                    <span class="seal-option-desc">Red payment confirmation seal</span>
                </div>
            </label>
        </div>

        <div style="text-align: right;">
            <button type="button" class="btn-outline" onclick="window.print()">
                <span class="material-symbols-rounded">print</span> Print Active Seal
            </button>
        </div>
    </div>

    <!-- Canvas Area for Display/Printing -->
    <div class="canvas-area">
        
        <!-- SEAL 1: COMPANY -->
        <div class="seal-box-company" id="seal-company" style="display: block;">
            <div class="seal-name" id="seal-company-name">FOR Company name not set</div>
            <div class="signature-line"></div>
            <div class="seal-role" id="seal-company-designation">Designation not set</div>
        </div>

        <!-- SEAL 2: DOCTOR -->
        <div class="seal-box-doctor" id="seal-doctor">
            <div class="doc-name" id="seal-signatory-name">Authorised signatory name not set</div>
            <div class="doc-qual" id="seal-signatory-designation">Designation not set</div>
            <div class="doc-reg" id="seal-signatory-qualification">Qualification / Licence No. not set</div>
        </div>

        <!-- SEAL 3: SINCERELY -->
        <div class="seal-box-sincerely" id="seal-sincerely">
            <div class="sincerely-title">Sincerely</div>
            <div class="sincerely-signature-gap" aria-hidden="true"></div>
            <div class="sincerely-administration">Administration</div>
            <div class="sincerely-company" id="seal-sincerely-company">Company name not set</div>
        </div>

        <!-- SEAL 4: PAYMENT RECEIVED -->
        <div class="seal-box-payment" id="seal-payment">Payment Received</div>

    </div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js';

        async function loadSealCompanyDetails() {
            try {
                const snapshot = await getDoc(doc(db, 'settings', 'company_profile'));
                if (!snapshot.exists()) throw new Error('Company profile has not been configured.');
                const data = snapshot.data();
                const companyName = String(data.name || '').trim();
                const signatoryName = String(data.authorisedSignatoryName || '').trim();
                const designation = String(data.authorisedSignatoryDesignation || '').trim();
                const qualificationLicence = String(data.authorisedSignatoryQualificationLicence || '').trim();

                document.getElementById('seal-company-name').textContent = `FOR ${companyName || 'Company name not set'}`;
                document.getElementById('seal-company-designation').textContent = designation || 'Designation not set';
                document.getElementById('seal-signatory-name').textContent = signatoryName || 'Authorised signatory name not set';
                document.getElementById('seal-signatory-designation').textContent = designation || 'Designation not set';
                document.getElementById('seal-signatory-qualification').textContent = qualificationLicence || 'Qualification / Licence No. not set';
                document.getElementById('seal-sincerely-company').textContent = companyName || 'Company name not set';
            } catch (error) {
                console.error('Could not load seal details from the company profile:', error);
                document.getElementById('seal-company-name').textContent = 'FOR Company details unavailable';
                document.getElementById('seal-company-designation').textContent = 'Company details unavailable';
                document.getElementById('seal-signatory-name').textContent = 'Company details unavailable';
                document.getElementById('seal-signatory-designation').textContent = 'Company details unavailable';
                document.getElementById('seal-signatory-qualification').textContent = 'Company details unavailable';
                document.getElementById('seal-sincerely-company').textContent = 'Company details unavailable';
            }
        }

        loadSealCompanyDetails();

        window.selectSeal = function(sealType) {
            const sealDisplays = {
                company: 'block',
                doctor: 'flex',
                sincerely: 'block',
                payment: 'flex'
            };
            const display = sealDisplays[sealType];
            if (!display) throw new Error(`Unsupported seal type: ${sealType}`);

            ['company', 'doctor', 'sincerely', 'payment'].forEach(type => {
                document.getElementById(`opt-${type}`).classList.toggle('active', type === sealType);
                document.getElementById(`opt-${type}`).querySelector('input').checked = type === sealType;
                document.getElementById(`seal-${type}`).style.display = type === sealType ? display : 'none';
            });
        }
    </script>

</div>
</body>
</html>
