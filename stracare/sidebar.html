/* =========================================================
   COREBIQ SIDEBAR
   MAIN MODULE + DROPDOWN SUBMODULE SYSTEM
   ========================================================= */

.sidebar-inner-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100%;
    background: var(--surface);
}


/* =========================================================
   HEADER
   ========================================================= */

.sidebar-header {
    position: sticky;
    top: 0;
    z-index: 20;

    min-height: 76px;
    padding: 15px 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--surface);
    border-bottom: 1px solid var(--border);
}

.sidebar-brand {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-logo {
    display: block;

    width: 100%;
    max-width: 180px;
    max-height: 52px;

    height: auto;

    object-fit: contain;
}


/* =========================================================
   CLOSE MENU
   ========================================================= */

.close-menu {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 38px;
    height: 38px;

    padding: 0;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: var(--text-main);

    cursor: pointer;

    flex-shrink: 0;

    transition:
        background .18s ease,
        transform .12s ease;
}

.close-menu:hover {
    background: rgba(0,0,0,.05);
}

.close-menu:active {
    transform: scale(.95);
}

.close-menu .material-symbols-rounded {
    font-size: 23px;
}


/* =========================================================
   SIDEBAR NAV
   ========================================================= */

.sidebar-nav {
    flex: 1;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 12px 0 20px;

    scrollbar-width: thin;
}


/* =========================================================
   DASHBOARD / DIRECT NAV BUTTON
   ========================================================= */

.nav-link {
    width: calc(100% - 32px);
    min-height: 44px;

    margin: 3px 16px;
    padding: 10px 14px;

    display: flex;
    align-items: center;

    border: 0;
    border-radius: 10px;

    background: transparent;

    color: var(--text-muted);

    font-family: inherit;
    font-size: 14px;
    font-weight: 500;

    line-height: 1.25;

    text-align: left;

    cursor: pointer;

    transition:
        background .18s ease,
        color .18s ease,
        transform .12s ease;
}

.nav-link:hover {
    background: rgba(0,0,0,.035);
    color: var(--text-main);
}

.nav-link:active {
    transform: scale(.985);
}

.nav-link.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
}


/* =========================================================
   NAV ICON
   ========================================================= */

.nav-link > .material-symbols-rounded {
    width: 22px;
    min-width: 22px;

    margin-right: 12px;

    font-size: 21px;

    color: currentColor;

    flex-shrink: 0;
}


/* =========================================================
   MAIN MODULE
   ========================================================= */

.sidebar-module {
    margin: 2px 0;
}


/* =========================================================
   MAIN MODULE BUTTON
   ========================================================= */

.module-toggle {
    position: relative;

    width: calc(100% - 32px);
    min-height: 46px;

    margin: 2px 16px;
    padding: 10px 14px;

    display: flex;
    align-items: center;

    border: 0;
    border-radius: 10px;

    background: transparent;

    color: var(--text-muted);

    font-family: inherit;
    font-size: 14px;
    font-weight: 600;

    text-align: left;

    cursor: pointer;

    transition:
        background .18s ease,
        color .18s ease;
}

.module-toggle:hover {
    background: rgba(0,0,0,.035);
    color: var(--text-main);
}


/* =========================================================
   MODULE ICON
   ========================================================= */

.module-toggle > .material-symbols-rounded:first-child {
    width: 22px;
    min-width: 22px;

    margin-right: 12px;

    font-size: 21px;

    color: currentColor;
}


/* =========================================================
   DROPDOWN ARROW
   ========================================================= */

.module-arrow {
    margin-left: auto;

    font-size: 20px !important;

    transition: transform .22s ease;
}


/* Rotate arrow when open */

.sidebar-module.open .module-arrow {
    transform: rotate(180deg);
}


/* =========================================================
   SUBMENU
   ========================================================= */

.module-submenu {
    display: none;

    padding: 2px 0 5px;

    animation: submenuOpen .18s ease;
}

.sidebar-module.open .module-submenu {
    display: block;
}


/* =========================================================
   SUBMENU ANIMATION
   ========================================================= */

@keyframes submenuOpen {

    from {
        opacity: 0;
        transform: translateY(-4px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

   SUBMENU BUTTON

    color: currentColor;
}


/* =========================================================
   SUBMENU LEFT GUIDE LINE
   ========================================================= */

.submenu-link::before {
    content: "";

    position: absolute;

    left: -10px;
    top: 50%;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--border);

    transform: translateY(-50%);

.submenu-link.active::before {

/* =========================================================

<script>
/* =========================================================
   SIDEBAR DROPDOWN
   Only one main module opens at a time
   ========================================================= */

window.toggleSidebarModule = function(button) {

    const currentModule = button.closest('.sidebar-module');

    if (!currentModule) return;


    const modules = document.querySelectorAll(
        '#sidebar-nav .sidebar-module'
    );


    modules.forEach(function(module) {

        if (module !== currentModule) {

            module.classList.remove('open');

            const toggle = module.querySelector('.module-toggle');

            if (toggle) {
                toggle.setAttribute(
                    'aria-expanded',
                    'false'
                );
            }

        }

    });


    const isOpen = currentModule.classList.toggle('open');


    button.setAttribute(
        'aria-expanded',
        isOpen ? 'true' : 'false'
    );

};
</script>
