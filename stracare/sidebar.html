<style>
/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar-inner-wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 100%;
    background: var(--surface);
}


/* =========================================================
   HEADER
   ========================================================= */

.sidebar-header {
    position: sticky;
    top: 0;
    z-index: 20;

    min-height: 70px;
    padding: 12px 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--surface);
    border-bottom: 1px solid var(--border);
}

.sidebar-brand {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-logo {
    display: block;
    width: auto;
    max-width: 175px;
    max-height: 48px;
    object-fit: contain;
}

.close-menu {
    display: none;

    width: 38px;
    height: 38px;

    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 10px;

    background: transparent;
    color: var(--text-main);

    cursor: pointer;
}

.close-menu:hover {
    background: var(--primary-light);
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.sidebar-nav {
    flex: 1;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 8px 0 16px;

    scrollbar-width: thin;
}


/* =========================================================
   MAIN MODULE DROPDOWN
   ========================================================= */

.sidebar-group {
    margin: 2px 10px;
}


/* Main module title */

.sidebar-group > summary {
    list-style: none;

    width: 100%;

    min-height: 44px;
    padding: 0 12px;

    display: flex;
    align-items: center;

    border-radius: 10px;

    cursor: pointer;

    color: var(--text-main);

    font-family: inherit;
    font-size: 14px;
    font-weight: 650;

    user-select: none;

    transition:
        background .18s ease,
        color .18s ease;
}


/* Remove default triangle */

.sidebar-group > summary::-webkit-details-marker {
    display: none;
}


/* Icon */

.sidebar-group > summary .module-icon {
    width: 24px;
    margin-right: 12px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--text-muted);

    flex-shrink: 0;
}

.sidebar-group > summary .material-symbols-rounded {
    font-size: 21px;
}


/* Chevron */

.module-chevron {
    margin-left: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--text-muted);

    transition: transform .2s ease;
}

.module-chevron .material-symbols-rounded {
    font-size: 20px;
}


/* Open state */

.sidebar-group[open] > summary {
    background: var(--primary-light);
    color: var(--primary);
}

.sidebar-group[open] > summary .module-icon {
    color: var(--primary);
}

.sidebar-group[open] > summary .module-chevron {
    color: var(--primary);
    transform: rotate(180deg);
}


/* Hover */

.sidebar-group > summary:hover {
    background: #F7F8FA;
}


/* =========================================================
   SUB MENU
   ========================================================= */

.sidebar-submenu {
    padding: 3px 0 5px 0;

    animation: submenuOpen .16s ease;
}

@keyframes submenuOpen {
    from {
        opacity: 0;
        transform: translateY(-3px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =========================================================
   SUB MENU BUTTON
   ========================================================= */

.nav-link {
    width: calc(100% - 12px);
    min-height: 40px;

    margin: 2px 6px;
    padding: 8px 12px 8px 42px;

    display: flex;
    align-items: center;

    border: none;
    border-radius: 8px;

    background: transparent;

    color: var(--text-muted);

    text-align: left;

    font-family: inherit;
    font-size: 13px;
    font-weight: 500;

    cursor: pointer;

    transition:
        background .16s ease,
        color .16s ease;
}

.nav-link:hover {
    background: #F7F8FA;
    color: var(--text-main);
}

.nav-link.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 650;
}


/* Submenu icon */

.nav-link .material-symbols-rounded {
    width: 22px;
    margin-right: 10px;

    font-size: 19px;

    color: inherit;

    flex-shrink: 0;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.nav-divider {
    height: 1px;

    margin: 7px 20px;

    background: var(--border);
}


/* =========================================================
   BADGE
   ========================================================= */

.menu-badge {
    margin-left: auto;

    padding: 2px 7px;

    border-radius: 20px;

    background: var(--primary);
    color: #fff;

    font-size: 10px;
    font-weight: 700;
}


/* =========================================================
   FOOTER
   ========================================================= */

.sidebar-footer {
    flex-shrink: 0;

    padding: 12px 18px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #FAFAFA;
    border-top: 1px solid var(--border);
}

.footer-logo {
    width: 68px;
    height: auto;

    margin-bottom: 4px;

    object-fit: contain;
}

.footer-app-name {
    margin-bottom: 1px;

    color: var(--text-main);

    font-size: 11px;
    font-weight: 700;
}

.footer-version {
    color: var(--text-muted);

    font-size: 10px;
    font-weight: 600;

    letter-spacing: .4px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

    .sidebar-header {
        min-height: 68px;
        padding: 10px 14px;

        justify-content: space-between;
    }

    .sidebar-brand {
        justify-content: flex-start;
    }

    .sidebar-logo {
        max-width: 170px;
        max-height: 46px;
    }

    .close-menu {
        display: flex;
    }

    .sidebar-nav {
        padding-top: 7px;
        padding-bottom: 12px;
    }

    .sidebar-group {
        margin-left: 8px;
        margin-right: 8px;
    }

    .sidebar-group > summary {
        min-height: 46px;
        padding: 0 13px;

        font-size: 14px;
    }

    .sidebar-group > summary .material-symbols-rounded {
        font-size: 21px;
    }

    .nav-link {
        min-height: 43px;

        padding: 9px 12px 9px 43px;

        font-size: 13.5px;
    }

    .nav-link .material-symbols-rounded {
        font-size: 19px;
    }

    .nav-divider {
        margin: 6px 18px;
    }

    .sidebar-footer {
        padding: 11px 16px;
    }
}
</style>
