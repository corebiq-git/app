<style>
/* =========================================================
   COREBIQ SIDEBAR
   ========================================================= */

.sidebar-inner-wrapper {
    display: flex;
    flex-direction: column;
    min-height: 100%;
    height: 100%;
    background: var(--surface);
}


/* =========================================================
   SIDEBAR HEADER
   ========================================================= */

.sidebar-header {
    position: sticky;
    top: 0;
    z-index: 20;

    min-height: 76px;
    padding: 16px 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: var(--surface);
    border-bottom: 1px solid var(--border);
}

.sidebar-brand {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-logo {
    display: block;

    width: 100%;
    max-width: 190px;
    max-height: 52px;

    height: auto;

    object-fit: contain;
}


/* =========================================================
   CLOSE MENU
   ========================================================= */

.close-menu {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 38px;
    height: 38px;

    padding: 0;

    border: 0;
    border-radius: 10px;

    background: transparent;
    color: var(--text-main);

    cursor: pointer;

    flex-shrink: 0;

    transition:
        background .18s ease,
        transform .18s ease;
}

.close-menu:hover {
    background: rgba(0,0,0,.05);
}

.close-menu:active {
    transform: scale(.95);
}

.close-menu .material-symbols-rounded {
    font-size: 23px;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.sidebar-nav {
    flex: 1;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 14px 0 20px;

    display: flex;
    flex-direction: column;
    gap: 3px;

    scrollbar-width: thin;
}


/* =========================================================
   NAVIGATION BUTTON
   ========================================================= */

.nav-link {
    width: calc(100% - 32px);
    min-height: 44px;

    margin: 0 16px;
    padding: 10px 14px;

    display: flex;
    align-items: center;

    border: 0;
    border-radius: 10px;

    background: transparent;

    color: var(--text-muted);

    font-family: inherit;
    font-size: 14px;
    font-weight: 500;

    line-height: 1.25;

    text-align: left;

    cursor: pointer;

    transition:
        background .18s ease,
        color .18s ease,
        transform .12s ease;
}

.nav-link:hover {
    background: rgba(0,0,0,.035);
    color: var(--text-main);
}

.nav-link:active {
    transform: scale(.985);
}


/* =========================================================
   ACTIVE NAVIGATION
   ========================================================= */

.nav-link.active {
    background: var(--primary-light);
    color: var(--primary);

    font-weight: 600;
}


/* =========================================================
   NAV ICON
   ========================================================= */

.nav-link .material-symbols-rounded {
    width: 22px;
    min-width: 22px;

    margin-right: 12px;

    font-size: 21px;

    color: currentColor;

    flex-shrink: 0;

    transition: color .18s ease;
}


/* =========================================================
   DIVIDER
   ========================================================= */

.nav-divider {
    width: calc(100% - 40px);
    height: 1px;

    margin: 10px 20px;

    background: var(--border);

    flex-shrink: 0;
}


/* =========================================================
   BADGES
   ========================================================= */

.menu-badge {
    margin-left: auto;

    padding: 3px 8px;

    border-radius: 999px;

    background: var(--primary);
    color: #fff;

    font-size: 11px;
    font-weight: 700;

    line-height: 1;
}

.menu-badge.pending {
    background: var(--warning);
}


/* =========================================================
   FOOTER
   ========================================================= */

.sidebar-footer {
    flex-shrink: 0;

    padding: 14px 20px 16px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: var(--surface);

    border-top: 1px solid var(--border);
}


/* =========================================================
   HORIZONTAL COREBIQ FOOTER LOGO
   ========================================================= */

.footer-logo {
    display: block;

    width: 150px;
    max-width: 100%;

    height: auto;

    max-height: 32px;

    margin: 0 auto 7px;

    object-fit: contain;
}


/* =========================================================
   FOOTER APP NAME
   ========================================================= */

.footer-app-name {
    margin-bottom: 2px;

    color: var(--text-main);

    font-size: 12px;
    font-weight: 700;

    line-height: 1.2;

    text-align: center;
}


/* =========================================================
   FOOTER VERSION
   ========================================================= */

.footer-version {
    color: var(--text-muted);

    font-size: 10px;
    font-weight: 600;

    letter-spacing: .5px;
    text-transform: uppercase;

    line-height: 1.2;
}


/* =========================================================
   DESKTOP
   ========================================================= */

@media (min-width: 769px) {

    .close-menu {
        display: none;
    }

    .sidebar-header {
        justify-content: center;
    }

    .sidebar-logo {
        max-width: 175px;
    }

    .footer-logo {
        width: 145px;
        max-height: 30px;
    }
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

    .sidebar-header {
        min-height: 78px;

        padding: 13px 14px;

        justify-content: space-between;
    }

    .sidebar-brand {
        justify-content: flex-start;
    }

    .sidebar-logo {
        width: 100%;
        max-width: 185px;
        max-height: 52px;
    }

    .close-menu {
        display: flex;
    }

    .sidebar-nav {
        padding-top: 12px;
        padding-bottom: 18px;
    }

    .nav-link {
        width: calc(100% - 24px);

        min-height: 46px;

        margin: 0 12px;

        padding: 11px 14px;

        font-size: 14px;
    }

    .nav-link .material-symbols-rounded {
        font-size: 21px;
        margin-right: 12px;
    }

    .nav-divider {
        width: calc(100% - 40px);

        margin: 10px 20px;
    }

    .sidebar-footer {
        padding: 13px 20px 15px;
    }

    .footer-logo {
        width: 145px;
        max-width: 85%;
        max-height: 30px;
        margin-bottom: 6px;
    }

    .footer-app-name {
        font-size: 12px;
    }

    .footer-version {
        font-size: 10px;
    }
}


/* =========================================================
   VERY SMALL MOBILE
   ========================================================= */

@media (max-width: 380px) {

    .nav-link {
        font-size: 13.5px;

        padding-left: 12px;
        padding-right: 12px;
    }

    .sidebar-logo {
        max-width: 165px;
    }

    .footer-logo {
        width: 130px;
        max-height: 28px;
    }
}
