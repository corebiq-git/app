<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<meta name="theme-color" content="#F7F9FC">

<title>COREBIQ</title>

<link rel="icon" href="assets/logo-favicon.png" type="image/png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #F7F9FC;

    display: flex;
    align-items: center;
    justify-content: center;
}

/* Splash container */
.splash {
    width: 100%;
    height: 100dvh;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(66, 133, 244, 0.08),
            transparent 42%
        ),
        #F7F9FC;
}

/* Logo */
.logo {
    width: 86px;
    height: 86px;
    object-fit: contain;

    animation:
        logoFloat 1.8s ease-in-out infinite,
        logoGlow 3s ease-in-out infinite;
}

/* Very subtle movement */
@keyframes logoFloat {
    0%,
    100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-5px) scale(1.025);
    }
}

/* Gradient colour changing effect */
@keyframes logoGlow {
    0% {
        filter:
            drop-shadow(0 0 0 rgba(66,133,244,0));
    }

    33% {
        filter:
            drop-shadow(0 0 18px rgba(66,133,244,.22));
    }

    66% {
        filter:
            drop-shadow(0 0 18px rgba(52,168,83,.20));
    }

    100% {
        filter:
            drop-shadow(0 0 0 rgba(66,133,244,0));
    }
}
</style>
</head>

<body>

<div class="splash">
    <img
        src="assets/logo.png"
        alt="COREBIQ"
        class="logo"
    >
</div>

<script>
setTimeout(() => {
    window.location.replace("index.html");
}, 1800);
</script>

</body>
</html>
