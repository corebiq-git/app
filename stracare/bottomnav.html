<style>
    /* =========================================================
       COREBIQ MD3 BOTTOM NAVIGATION
    ========================================================= */
    .bottom-nav { 
        display: flex; 
        justify-content: space-around; 
        align-items: center;
        background: rgba(255, 255, 255, 0.94); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-top: 1px solid var(--border); 
        padding: 10px 8px calc(10px + env(safe-area-inset-bottom)); 
        position: fixed; 
        bottom: 0; 
        left: 0;
        width: 100%; 
        z-index: 1500; 
        box-shadow: 0 -4px 24px rgba(15, 23, 42, 0.04);
        font-family: 'Outfit', sans-serif;
    }
    
    .bottom-nav-item { 
        display: flex; 
        flex-direction: column; 
        align-items: center; 
        justify-content: center;
        color: var(--text-muted); 
        text-decoration: none; 
        cursor: pointer; 
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        min-width: 64px;
        gap: 4px;
        -webkit-tap-highlight-color: transparent;
    }

    /* MD3 Active Pill Wrap */
    .bottom-nav-icon-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 32px;
        border-radius: 16px;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bottom-nav-icon { 
        font-size: 24px; 
        transition: color 0.25s ease;
        /* Ensure unfilled by default */
        font-variation-settings: 'FILL' 0, 'wght' 400;
    }

    .bottom-nav-label {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.3px;
        transition: all 0.25s ease;
    }

    /* --- ACTIVE STATE --- */
    .bottom-nav-item.active { 
        color: var(--primary-dark); 
    }
    
    .bottom-nav-item.active .bottom-nav-icon-wrap {
        background: var(--primary-light);
    }

    .bottom-nav-item.active .bottom-nav-icon {
        color: var(--primary);
        /* Fill the icon when active */
        font-variation-settings: 'FILL' 1, 'wght' 400;
    }

    .bottom-nav-item.active .bottom-nav-label {
        font-weight: 700;
        color: var(--primary-dark);
    }

    /* --- HOVER STATE (For Desktop/Mice) --- */
    @media (hover: hover) {
        .bottom-nav-item:hover .bottom-nav-icon-wrap {
            background: var(--surface-soft);
        }
        .bottom-nav-item.active:hover .bottom-nav-icon-wrap {
            background: var(--primary-light);
        }
    }
</style>

<div class="bottom-nav">
    <div class="bottom-nav-item active" onclick="window.switchView('view-dashboard', this)">
        <div class="bottom-nav-icon-wrap">
            <span class="material-symbols-rounded bottom-nav-icon">home</span>
        </div>
        <span class="bottom-nav-label">Home</span>
    </div>
    
    <div class="bottom-nav-item" onclick="window.switchView('view-clients', this)">
        <div class="bottom-nav-icon-wrap">
            <span class="material-symbols-rounded bottom-nav-icon">group</span>
        </div>
        <span class="bottom-nav-label">Clients</span>
    </div>
    
    <div class="bottom-nav-item" onclick="window.switchView('view-sales', this)">
        <div class="bottom-nav-icon-wrap">
            <span class="material-symbols-rounded bottom-nav-icon">travel</span>
        </div>
        <span class="bottom-nav-label">Sales</span>
    </div>
    
    <div class="bottom-nav-item" onclick="window.toggleSidebar()">
        <div class="bottom-nav-icon-wrap">
            <span class="material-symbols-rounded bottom-nav-icon">menu</span>
        </div>
        <span class="bottom-nav-label">Menu</span>
    </div>
</div>
