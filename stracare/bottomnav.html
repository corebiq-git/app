<style>
    .bottom-nav {
        position: fixed;
        z-index: 900;
        right: 12px;
        bottom: calc(8px + env(safe-area-inset-bottom));
        left: 12px;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 5px;
        padding: 8px 7px;
        border: 1px solid rgba(196, 199, 197, .72);
        border-radius: 26px;
        background: rgba(255, 255, 255, .94);
        box-shadow: 0 8px 28px rgba(31, 35, 40, .15), 0 2px 6px rgba(31, 35, 40, .06);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
    }

    .bottom-nav-item {
        display: flex;
        flex: 1 1 0;
        min-width: 0;
        min-height: 56px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 4px 3px;
        border: 0;
        border-radius: 19px;
        background: transparent;
        color: #5F6368;
        font-family: inherit;
        font-size: 11px;
        font-weight: 600;
        line-height: 1;
        text-decoration: none;
        white-space: nowrap;
        cursor: pointer;
        transition: background-color .18s ease, color .18s ease, transform .18s ease;
    }

    .bottom-nav-item:hover {
        background: #F6F8FC;
        color: var(--primary);
    }

    .bottom-nav-item:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
    }

    .bottom-nav-item[aria-current="page"] {
        color: var(--primary);
        font-weight: 700;
    }

    .bottom-nav-icon-wrap {
        width: 58px;
        height: 30px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        transition: background-color .18s ease, color .18s ease;
    }

    .bottom-nav-item[aria-current="page"] .bottom-nav-icon-wrap {
        background: var(--primary-soft);
        color: var(--primary);
    }

    .bottom-nav-icon {
        font-size: 22px;
        line-height: 1;
    }

    @media (max-width: 360px) {
        .bottom-nav {
            right: 8px;
            left: 8px;
            gap: 2px;
            padding-right: 5px;
            padding-left: 5px;
        }

        .bottom-nav-item {
            font-size: 10px;
        }
    }
</style>

<div class="bottom-nav" role="navigation" aria-label="Mobile navigation">
    <button class="bottom-nav-item active" type="button" aria-label="Home" aria-current="page" onclick="window.switchView('view-dashboard', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">dashboard</span></span>
        <span>Home</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Contacts" onclick="window.switchView('view-contacts', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">contacts</span></span>
        <span>Contacts</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Appointments" onclick="window.switchView('view-appointments', this)">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">calendar_month</span></span>
        <span>Appointments</span>
    </button>
    <button class="bottom-nav-item" type="button" aria-label="Open menu" onclick="window.toggleSidebar()">
        <span class="bottom-nav-icon-wrap"><span class="material-symbols-rounded bottom-nav-icon" aria-hidden="true">menu</span></span>
        <span>Menu</span>
    </button>
</div>
