<div class="module-page qr-template-page" id="qrTemplatePage">
  <div class="page-header"><div class="page-title"><div class="page-title-icon"><span class="material-symbols-rounded">qr_code_2</span></div><div><h1>Payment QR Template</h1><p>Generate a UPI payment QR using Company settings and a saved invoice.</p></div></div><div class="actions"><button class="btn btn-outline" id="qrTemplateRefresh" type="button"><span class="material-symbols-rounded">refresh</span><span>Refresh</span></button></div></div>
  <div class="qr-template-layout"><form class="qr-template-form" id="qrTemplateForm"><label>Source record<select class="form-control" id="qrSourceRecord"><option value="">Select sale or invoice</option></select></label><label>Company UPI ID<input class="form-control" id="qrCompanyUpi" readonly></label><label>Payment amount<input class="form-control" id="qrPaymentAmount" type="number" min="0.01" step="0.01" required></label><label>Payment note<input class="form-control" id="qrPaymentNote" maxlength="80"></label><label>QR label<input class="form-control" id="qrPaymentLabel" maxlength="80" value="Invoice payment"></label><p class="qr-template-feedback" id="qrTemplateFeedback" role="status" hidden></p><div class="qr-template-actions"><button class="btn btn-outline" id="qrOpenCompany" type="button"><span class="material-symbols-rounded">domain</span><span>Company settings</span></button><button class="btn btn-outline" id="qrCopyPayment" type="button"><span class="material-symbols-rounded">content_copy</span><span>Copy UPI link</span></button><button class="btn btn-primary" id="qrSaveRecord" type="button"><span class="material-symbols-rounded">save</span><span>Save QR</span></button></div></form><section class="qr-template-preview"><img id="qrPreviewImage" alt="UPI payment QR preview"><strong id="qrPreviewAmount">Select a payment record</strong><code id="qrPreviewPayload"></code></section></div>
</div>
