<div class="module-page reports-page" id="reportsPage">
  <div class="page-header"><div class="page-title"><div class="page-title-icon"><span class="material-symbols-rounded">bar_chart</span></div><div><h1>Reports</h1><p id="reportsSubtitle">Financial activity</p></div></div><div class="actions"><button class="btn btn-outline" id="reportsRefresh" type="button"><span class="material-symbols-rounded">refresh</span><span>Refresh</span></button><button class="btn btn-primary" id="reportsExport" type="button"><span class="material-symbols-rounded">download</span><span>Export CSV</span></button></div></div>
  <div class="reports-filters"><label>Period<select class="form-control" id="reportsPeriod"><option value="current-fy">Current financial year</option><option value="previous-fy">Previous financial year</option><option value="month">Current month</option><option value="custom">Custom dates</option></select></label><label>From<input class="form-control" id="reportsFrom" type="date" disabled></label><label>To<input class="form-control" id="reportsTo" type="date" disabled></label><label>Source<select class="form-control" id="reportsSource"><option value="all">All sources</option><option value="sales">Sales</option><option value="invoices">Invoices</option><option value="purchases">Purchases</option><option value="expenses">Expenses</option><option value="vouchers">Vouchers</option></select></label></div>

  <section class="reports-metrics" aria-label="Financial totals"><article><span>Sales</span><strong id="reportSales">--</strong></article><article><span>Invoices</span><strong id="reportInvoices">--</strong></article><article><span>Purchases</span><strong id="reportPurchases">--</strong></article><article><span>Expenses</span><strong id="reportExpenses">--</strong></article></section>
  <section class="reports-register"><div class="reports-register-head"><h2>Activity</h2><span id="reportsCount">0 records</span></div><div class="table-wrap"><table class="data-table reports-table"><thead><tr><th>Date</th><th>Source</th><th>Reference</th><th>Party / Description</th><th>Financial Year</th><th>Amount</th><th>Status</th></tr></thead><tbody id="reportsRows"></tbody></table></div></section>
</div>
