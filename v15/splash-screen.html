<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0F7A52">
    <title>STRA CARE | Loading</title>
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body {
            position: relative;
            overflow: hidden;
            background: #fff;
        }
        .splash-content {
            position: absolute;
            inset: 0;
            display: grid;
            align-content: center;
            justify-items: center;
            gap: 22px;
        }
        .splash-logo {
            display: block;
            width: min(140px, 34vw);
            height: min(140px, 34vw);
            object-fit: contain;
            animation: spin 1.6s linear infinite;
        }
        .splash-footer {
            position: absolute;
            right: 16px;
            bottom: max(16px, env(safe-area-inset-bottom));
            left: 16px;
            display: flex;
            justify-content: center;
        }
        .splash-footer-logo {
            display: block;
            width: min(280px, 70vw);
            aspect-ratio: 4 / 1;
            object-fit: contain;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="splash-content" role="status" aria-label="Loading STRA CARE">
        <img class="splash-logo" src="assets/loading.png" alt="">
    </main>
    <footer class="splash-footer">
        <img class="splash-footer-logo" src="assets/splash-screen.png" alt="STRA CARE">
    </footer>
</body>
</html>
